    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --accent-blue-darker: #2563eb;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }
        body.dark-mode {
            --bg: #020617;
            --surface: #0f172a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --danger-color: #f87171;
            --warning-color: #f59e0b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        @keyframes subtle-glow {
          0%, 100% {
            filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.7));
          }
          50% {
            filter: drop-shadow(0 0 16px rgba(57, 255, 20, 0.7));
          }
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        #splash-screen img { 
            width: 150px; 
            height: 150px; 
            animation: pulse 2.5s infinite ease-in-out;
        }

        #login-view {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; padding: 20px;
            background-color: var(--bg);
        }
        .login-card {
            background-color: transparent;
            box-shadow: none;
            border: none;
            width: 100%; max-width: 400px; text-align: center;
        }
        
        .login-card .logo {
            display: flex;
            justify-content: center;
        }

        .login-card .logo img { 
            width: 140px; 
            height: 140px; 
            margin-bottom: 30px; 
            animation: subtle-glow 5s ease-in-out infinite;
        }
        .login-card h2 { margin-bottom: 10px; font-size: 1.8em; font-weight: 700; color: var(--text-primary); }
        .login-card p { margin-bottom: 40px; color: var(--text-secondary); }
        .login-card .form-group { text-align: left; margin-bottom: 20px; }
        .login-card .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary); }
        .login-card .form-group input { 
            width: 100%; 
            padding: 15px; 
            font-size: 1em; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background-color: #1e293b; 
            color: var(--text-primary); 
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-card .form-group input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .login-card .btn-primary { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.1em;
            font-weight: 600;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            background-color: var(--accent-blue); 
            color: white; 
            transition: background-color 0.2s;
        }
        .login-card .btn-primary:hover {
            background-color: var(--accent-blue-darker);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; font-size: 1em; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-primary); }
        .form-group input[readonly] { background-color: var(--bg); opacity: 0.7; cursor: not-allowed; }
        .form-group .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .day-selector { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 20px; }
        .day-selector label { padding: 10px; flex-grow: 1; font-weight: 600; font-size: 0.9em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background-color: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; }
        .day-selector input { display: none; }
        .day-selector input:checked + label { background-color: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        #app-container { 
            display: none; flex-direction: column;
            height: 100%; width: 100%;
        }
        main { flex-grow: 1; overflow-y: auto; }
        .container { padding: 20px; }
        
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo img { height: 40px; width: 40px; object-fit: cover; }
        .logo-text { font-size: 1.2em; font-weight: 700; color: var(--text-primary); }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .header-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .lang-dropdown { display: none; position: absolute; top: 40px; right: 0; background-color: var(--surface); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid var(--border-color); overflow: hidden; z-index: 110; }
        .lang-dropdown button { display: block; width: 100%; text-align: left; padding: 10px 15px; background: none; border: none; color: var(--text-primary); cursor: pointer; }
        .lang-dropdown button:hover { background-color: var(--bg); }
        .profile img { height: 40px; width: 40px; border-radius: 50%; border: 2px solid var(--accent-blue); object-fit: cover; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .kpi-card { background-color: var(--surface); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); }
        body.dark-mode .kpi-card { box-shadow: none; }
        .kpi-title { display: flex; align-items: center; gap: 8px; font-size: 0.9em; color: var(--text-secondary); margin: 0 0 10px; }
        .kpi-value { font-size: 1.8em; font-weight: 700; margin: 0; }
        
        .section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .item-list { display: flex; flex-direction: column; gap: 15px; }
        
        .client-card, .report-item-card { background-color: var(--surface); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border-color); transition: transform 0.2s, box-shadow 0.2s; }
        .client-card, .report-item-card.clickable { cursor: pointer; }
        .client-card:hover, .report-item-card.clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }

        .collector-card {
            background-color: var(--surface); border-radius: 12px; padding: 12px;
            display: flex; align-items: center; gap: 15px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .collector-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }
        .item-avatar img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .collector-card-main { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .collector-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .item-info { flex-grow: 1; min-width: 0; }
        .item-name { font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-subtext { font-size: 0.9em; color: var(--text-secondary); margin-top: 2px; }
        .item-details { text-align: right; }
        .item-detail-value { font-weight: 600; font-size: 1.1em; white-space: nowrap; flex-shrink: 0; }
        .item-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .item-status-tag, .tracking-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75em; font-weight: 600; padding: 4px 8px; border-radius: 12px; }
        .tracking-tag.available { background-color: #3b82f620; color: var(--accent-blue); }
        .tracking-tag.unavailable { background-color: #64748b20; color: var(--text-secondary); }

        .bottom-nav { flex-shrink: 0; background-color: var(--surface); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-secondary); text-decoration: none; font-size: 0.8em; padding: 5px 15px; cursor: pointer; }
        .nav-item.active { color: var(--accent-blue); }
        
        .modal-view, .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; }
        .modal-view { background-color: var(--bg); transform: translateX(100%); transition: transform 0.3s ease-in-out; display: flex; flex-direction: column; }
        .modal-view.active { transform: translateX(0); }
        .modal-overlay { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: var(--surface); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }

        .modal-header { display: flex; align-items: center; padding: 15px 20px; background-color: var(--surface); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .modal-header button { background: none; border: none; color: var(--text-primary); cursor: pointer; margin-right: 15px; }
        .modal-title { font-size: 1.2em; font-weight: 600; flex-grow: 1; }
        .modal-content-wrapper { flex-grow: 1; overflow-y: auto; }
        .action-buttons { background-color: var(--surface); border-top: 1px solid var(--border-color); padding: 15px 20px; display: flex; gap: 15px; margin-top: auto; position: sticky; bottom: 0; flex-shrink: 0; }
        .action-buttons button { flex-grow: 1; padding: 15px; font-size: 1em; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--accent-blue); color: white; }
        .btn-secondary { background-color: transparent; color: var(--accent-blue); border: 2px solid var(--accent-blue); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .action-buttons button:disabled { background-color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }

        .fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; background-color: var(--accent-blue); color: white; border-radius: 50%; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 160; }
        .view { display: none; }
        .view.active { display: block; }
        .search-bar-wrapper { position: relative; margin-bottom: 20px; }
        .search-bar-wrapper input { width: 100%; padding: 12px 12px 12px 40px; font-size: 1em; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-primary); }
        .search-bar-wrapper .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .toast { background-color: #333; color: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 0.9em; opacity: 0; transform: translateY(-20px); transition: opacity 0.3s, transform 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.toast-error { background-color: var(--danger-color); }

        .status-pending { color: var(--warning-color); } .status-paid { color: var(--accent-green); } .status-late { color: var(--danger-color); }

        .profile-pic-wrapper { position: relative; cursor: pointer; display: inline-block; }
        .profile-pic-wrapper::after { content: '✎'; position: absolute; bottom: 5px; right: 5px; background-color: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        #profile-view-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-blue); object-fit: cover; }
        
        #cropper-container { height: calc(100% - 150px); }
        #cropper-container img { max-width: 100%; height: auto; }
        
        .collector-detail-header { display: flex; align-items: center; gap: 15px; background-color: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .collector-detail-header img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
        .collector-detail-info { flex-grow: 1; }
        .collector-detail-info .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.9em; font-weight: 500; }
        .collector-detail-info .status-indicator.online::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green); }
        .collector-detail-info .status-indicator.offline::before { content: ''; display: block; width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-secondary); }
        .last-seen-info { font-size: 0.8em; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .header-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 4px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;}
        .header-btn:hover { background-color: var(--bg); color: var(--accent-blue); }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background-color: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;}
        .info-grid div { display: flex; flex-direction: column; }
        .info-grid label { font-size: 0.8em; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .info-grid p { margin: 0; font-weight: 600; word-break: break-all; }
        .document-item { display: flex; align-items: center; gap: 10px; background-color: var(--surface); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); text-decoration: none; color: var(--text-primary); transition: background-color 0.2s; }
        .document-item:hover { background-color: var(--bg); }
        .document-item span { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .payment-history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--surface); border-radius: 8px; border: 1px solid var(--border-color); }

        .report-filters { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .report-filters .form-group { flex-grow: 1; margin-bottom: 0; }
        .filter-buttons { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;}
        .filter-btn { padding: 8px 16px; border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-secondary); border-radius: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background-color: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        body.dark-mode .leaflet-popup-content-wrapper { background-color: var(--surface); color: var(--text-primary); }
        .leaflet-popup-content { margin: 0; width: 250px; }
        .map-popup-card { font-family: 'Inter', sans-serif; }
        .popup-header { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border-color); }
        .popup-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); }
        .popup-info { flex-grow: 1; }
        .popup-info .popup-name { font-size: 1.05em; font-weight: 600; color: var(--text-primary); }
        .popup-info .item-status-tag { margin-top: 4px; padding: 3px 8px; font-size: 0.7em; display: inline-flex; }
        .popup-stats { display: grid; grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; }
        .popup-stats div { display: flex; flex-direction: column; text-align: center; }
        .popup-stats .stat-label { font-size: 0.75em; color: var(--text-secondary); margin-bottom: 2px; text-transform: uppercase; font-weight: 500; }
        .popup-stats .stat-value { font-size: 1.1em; font-weight: 600; color: var(--text-primary); }
        .popup-actions { padding: 8px 12px; border-top: 1px solid var(--border-color); text-align: center; }
        .popup-action-link { text-decoration: none; color: var(--accent-blue); font-weight: 600; font-size: 0.9em; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .popup-action-link i { width: 14px; height: 14px; }
        
        .progress-card { text-align: center; }
        .progress-circle { position: relative; width: 120px; height: 120px; margin: 0 auto 15px; }
        .progress-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-circle circle { fill: none; stroke-width: 10; }
        .progress-circle .bg-circle { stroke: var(--border-color); }
        .progress-circle .progress-bar { stroke: var(--accent-blue); stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
        .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5em; font-weight: 700; }
        
        /* --- Settings View Styles --- */
        .settings-section {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .settings-logo-preview {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .settings-logo-preview img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .toggle-switch .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .toggle-switch .switch input { display: none; }
        .toggle-switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }
        .toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        .toggle-switch input:checked + .slider { background-color: var(--accent-blue); }
        .toggle-switch input:checked + .slider:before { transform: translateX(22px); }
        .reputation-bar-container { width: 100%; background-color: var(--border-color); border-radius: 8px; height: 16px; overflow: hidden; margin-bottom: 10px; }

#community-view {

/* --- Creador de Publicaciones --- */
#community-view .community-post-creator {
    background-color: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border-color);
    margin-bottom: 25px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}
body.dark-mode #community-view .community-post-creator { box-shadow: none; }

#community-view .community-post-creator textarea {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text-primary);
    min-height: 60px;
    resize: vertical;
    font-size: 1.1em;
    outline: none;
    padding: 0;
    margin-bottom: 10px;
}
#community-view .community-post-creator-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
}
#community-view .community-post-image-preview {
    display: block; /* Oculto por JS si no hay imagen */
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    border-radius: 8px;
    margin-top: 10px;
    border: 1px solid var(--border-color);
}


/* --- Tarjetas de Publicación Individuales --- */
#community-view .post-card {
    background-color: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border-color);
    margin-bottom: 25px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    overflow: hidden;
}
body.dark-mode #community-view .post-card { box-shadow: none; }

#community-view .post-card .post-header {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    gap: 12px;
}
/* Selector CLAVE aún más específico para la imagen de perfil */
#community-view .post-card .post-header img.post-header-img {
    width: 40px !important;
    min-width: 40px !important; /* Añadido para evitar encogimiento */
    height: 40px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    border: 1px solid var(--border-color);
    flex-shrink: 0;
    display: block; /* Añadido por si acaso */
}
#community-view .post-card .post-header .post-header-info {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    gap: 2px;
    min-width: 0; /* Añadido para asegurar que el texto se ajuste */
}
#community-view .post-card .post-header .post-header-info .post-admin-name {
    font-weight: 600;
    font-size: 0.95em;
    color: var(--text-primary);
    white-space: nowrap; /* Evita que el nombre se rompa */
    overflow: hidden; /* Oculta el exceso */
    text-overflow: ellipsis; /* Añade puntos suspensivos */
}
#community-view .post-card .post-header .post-header-info .post-admin-date {
    font-size: 0.8em;
    color: var(--text-secondary);
}



/* Imagen de la publicación */
#community-view .post-card img.post-image {
    display: block;
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg);
}

/* Texto de la publicación */
#community-view .post-card .post-text-content {
    padding: 15px;
    font-size: 1em;
    line-height: 1.6;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Acciones de la publicación */
#community-view .post-card .post-actions {
    display: flex;
    justify-content: flex-start;
    gap: 25px;
    padding: 12px 15px;
    border-top: 1px solid var(--border-color);
}
#community-view .post-card .post-actions .action-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 0.9em;
    padding: 5px 0;
    border-radius: 6px;
    transition: color 0.2s ease;
}
#community-view .post-card .post-actions .action-btn:hover {
    color: var(--accent-blue);
}
#community-view .post-card .post-actions .action-btn i {
    width: 22px;
    height: 22px;
    stroke-width: 2;
}
#community-view .post-card .post-actions .action-btn span {
    line-height: 1;
}

/* Estilo para el botón de "Me Gusta" activo */
#community-view .post-card .post-actions .action-btn.active {
    color: var(--accent-blue);
    font-weight: 700;
}
#community-view .post-card .post-actions .action-btn.active i {
    fill: var(--accent-blue);
}

/* Sección de Comentarios (Contenedor) */
#community-view .post-comments-section {
    padding: 0 15px 15px 15px;
    background-color: var(--bg);
    border-top: 1px solid var(--border-color);
    max-height: 400px;
    overflow-y: auto;
}

/* Cada comentario individual */
#community-view .comment-item {
    display: flex;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-color);
}
#community-view .comment-item:last-child {
    border-bottom: none;
}
#community-view .comment-item img.comment-author-pic {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}
#community-view .comment-item .comment-content {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    background-color: var(--surface);
    border-radius: 8px;
    padding: 8px 12px;
}
#community-view .comment-item .comment-author-name {
    font-weight: 600;
    font-size: 0.85em;
    color: var(--text-primary);
    margin-bottom: 3px;
}
#community-view .comment-item .comment-text {
    font-size: 0.9em;
    color: var(--text-primary);
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Área para escribir un nuevo comentario */
#community-view .post-comment-input-area {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 15px;
    border-top: 1px solid var(--border-color);
}
#community-view .post-comment-input-area img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
}
#community-view .post-comment-input-area input {
    flex-grow: 1;
    border: 1px solid var(--border-color);
    background-color: var(--bg);
    border-radius: 20px;
    padding: 8px 15px;
    font-size: 0.9em;
    color: var(--text-primary);
    outline: none;
}
#community-view .post-comment-input-area input:focus {
    border-color: var(--accent-blue);
}
#community-view .post-comment-input-area .submit-comment-btn {
    background: none;
    border: none;
    color: var(--accent-blue);
    cursor: pointer;
    padding: 5px;
}

/* Botón para eliminar publicación */
#community-view .post-card .post-header {
    position: relative; /* Necesario para posicionar el botón */
}
#community-view .post-card .post-delete-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#community-view .post-card .post-delete-btn:hover {
    background-color: var(--bg);
    color: var(--danger-color);
}

#collector-verification-results .verification-card {

    flex-direction: column;
    gap: 8px;

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : ''}`;
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }

        function showView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            const navItem = document.querySelector(`.nav-item[data-view="${viewName}"]`);
            if (navItem) navItem.classList.add('active');

            const viewEl = document.getElementById(`${viewName}-view`);
            if (viewEl) viewEl.classList.add('active');

            const addCollectorFab = document.getElementById('addCollectorBtn');
            if(addCollectorFab) {
                addCollectorFab.style.display = viewName === 'dashboard' ? 'flex' : 'none';
            }

            if (viewName === 'profile') {

            updateSettingsForm(globalSettings); // Carga los ajustes en el formulario
            }

            if (viewName === 'map') {
                setTimeout(() => {
                    initMap();
                    updateCollectorMarkers(); 
                }, 50);
            }
            if (viewName === 'reports') {

            }

            }

        }

        function formatTimestamp(timestamp) {
            if (!timestamp || !timestamp.seconds) return '';
            const date = timestamp.toDate();
            return date.toLocaleTimeString(currentLang === 'pt' ? 'pt-BR' : 'es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        const nationalHolidays = [ '01/01', '21/04', '01/05', '07/09', '12/10', '02/11', '15/11', '25/12' ];

        function calculateLatePaymentDays(loan) {
            if (!loan || (loan.paid >= loan.totalLoan)) return 0;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let lastRelevantDate;
            if (loan.history && loan.history.length > 0) {
                const sortedHistory = [...loan.history]
                    .filter(h => h.date?.seconds && h.status !== 'pending_verification')
                    .sort((a, b) => b.date.seconds - a.date.seconds);
                if (sortedHistory.length > 0) lastRelevantDate = new Date(sortedHistory[0].date.seconds * 1000);
            }
            if (!lastRelevantDate) {
                if (loan.startDate?.seconds) {
                    lastRelevantDate = new Date(loan.startDate.seconds * 1000);
                } else {
                    return 0;
                }
            }
            
            lastRelevantDate.setHours(0, 0, 0, 0);
            if (lastRelevantDate >= today) return 0;

            let workingDaysToPay = 0;
            let checkDate = new Date(lastRelevantDate);
            while (checkDate < today) {
                checkDate.setDate(checkDate.getDate() + 1);
                const dayOfWeek = checkDate.getDay();
                const formattedDate = `${String(checkDate.getDate()).padStart(2, '0')}/${String(checkDate.getMonth() + 1).padStart(2, '0')}`;
                const isHoliday = nationalHolidays.includes(formattedDate);
                const isPaymentDay = (loan.paymentDays || []).includes(dayOfWeek);
                if (!isHoliday && isPaymentDay) {
                    workingDaysToPay++;
                }
            }
            return workingDaysToPay > 0 ? workingDaysToPay : 0;
        }

        function calculateClientStatus(loan) {
            if (loan.totalLoan && loan.totalLoan > 0 && (loan.paid || 0) >= loan.totalLoan) {
                return 'finished';
            }
            
            const today = new Date(); today.setHours(0, 0, 0, 0);
            
            let lastPaymentDate;
            if (loan.history && loan.history.length > 0) {
                const sortedHistory = [...loan.history].filter(h => h.date?.seconds).sort((a, b) => b.date.seconds - a.date.seconds);
                if (sortedHistory.length > 0) lastPaymentDate = new Date(sortedHistory[0].date.seconds * 1000);
            } 
            if (!lastPaymentDate && loan.startDate?.seconds) {
                lastPaymentDate = new Date(loan.startDate.seconds * 1000);
            }

            if (!lastPaymentDate) return 'pending';
            lastPaymentDate.setHours(0, 0, 0, 0);
            
            let workingDaysToPay = 0;
            let checkDate = new Date(lastPaymentDate);

            if (checkDate >= today) return 'paid';

            const frequency = loan.paymentFrequency || 'daily';

            while(checkDate < today) {
                checkDate.setDate(checkDate.getDate() + 1);
                const dayOfWeek = checkDate.getDay();
                const dayOfMonth = checkDate.getDate();
                const formattedDate = `${String(checkDate.getDate()).padStart(2, '0')}/${String(checkDate.getMonth() + 1).padStart(2, '0')}`;
                const isHoliday = nationalHolidays.includes(formattedDate);
                
                let isPaymentDay = false;
                if (frequency === 'daily') {
                    isPaymentDay = (loan.paymentDays || []).includes(dayOfWeek);
                } else if (frequency === 'weekly') {
                    isPaymentDay = (loan.paymentDays || [])[0] === dayOfWeek;
                } else if (frequency === 'monthly') {
                    isPaymentDay = (loan.paymentDays || [])[0] === dayOfMonth;
                }
                
                if (!isHoliday && isPaymentDay) workingDaysToPay++;
            }
            
            if (workingDaysToPay > 1) return 'late';
            if (workingDaysToPay === 1) return 'pending';
            return 'paid';
        }

        function calculateCollectorStatus(collectorId) {
            const collectorClients = allClients.filter(c => c.collectorId === collectorId);
            if (collectorClients.length === 0) {
                return { textKey: 'inOrder', color: 'var(--accent-green)', icon: 'check-circle' };
            }

async function submitNewPost() {
    const submitBtn = document.getElementById('submit-post-btn');
    const textInput = document.getElementById('post-text-input');
    const fileInput = document.getElementById('post-image-input');
    const preview = document.getElementById('post-image-preview');

    const text = textInput.value.trim();
    const file = fileInput.files[0];

    if (!text && !file) {
        showToast("Escreva algo ou adicione uma imagem.", true);
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i>`;
    lucide.createIcons({ nodes: [submitBtn.querySelector('i')] });

    try {
        let imageUrl = '';
        if (file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Cloudinary post image upload failed');
            const data = await response.json();
            imageUrl = data.secure_url;
        }

        // Obtenemos la foto de perfil actual del admin desde el DOM
        const adminProfilePic = document.querySelector('#header-profile-link img')?.src || '';

        const postData = {
            adminId: currentAdmin.id, // <--- AÑADE ESTA LÍNEA
            adminName: currentAdmin.name,
            adminProfilePic: currentAdmin.profilePic,
            text: text,
            imageUrl: imageUrl,
            createdAt: serverTimestamp(),
            likes: 0,
            commentsCount: 0,
            likedBy: []
        };

        await addDoc(collection(db, 'communityPosts'), postData);

        // Limpiar formulario
        textInput.value = '';
        fileInput.value = '';
        preview.src = '';
        preview.style.display = 'none';

    } catch (error) {
        console.error("Error al publicar:", error);
        showToast("Erro ao publicar o post.", true);
    } finally {
        submitBtn.disabled = true; // Sigue deshabilitado porque el texto está vacío
        submitBtn.innerHTML = `<i data-lucide="send"></i> Publicar`;
        lucide.createIcons({ nodes: [submitBtn.querySelector('i')] });
    }
}

async function handlePostLike(postId) {
    const postRef = doc(db, 'communityPosts', postId);
    const post = allCommunityPosts.find(p => p.id === postId);
    if (!post) return;

    const adminId = currentAdmin.id;
    let newLikedBy = post.likedBy || [];
    const likeBtn = document.querySelector(`.post-card[data-post-id="${postId}"] .action-btn[data-action="like"]`);
    let newLikesCount;

    if (newLikedBy.includes(adminId)) {
        // Ya le dio like -> Quitar like
        newLikedBy = newLikedBy.filter(id => id !== adminId);
        newLikesCount = increment(-1);
        likeBtn?.classList.remove('active');
    } else {
        // No le ha dado like -> Añadir like
        newLikedBy.push(adminId);
        newLikesCount = increment(1);
        likeBtn?.classList.add('active');
    }

    // Actualización visual optimista (asume que funcionará)
    const span = likeBtn.querySelector('span');
    const currentLikes = parseInt(span.textContent) || 0;
    span.textContent = currentLikes + (newLikedBy.includes(adminId) ? 1 : -1);

    try {
        await updateDoc(postRef, {
            likes: newLikesCount,
            likedBy: newLikedBy
        });
    } catch (error) {
        console.error("Error al actualizar like:", error);
        showToast("Erro ao dar like.", true);
        // Revertir el cambio visual en caso de error
        span.textContent = post.likes || 0;
        if (newLikedBy.includes(adminId)) likeBtn.classList.remove('active');
        else likeBtn.classList.add('active');
    }
}

async function verifyCollectorInSystem(collectorIdToExclude = null) {
    const nameInput = document.getElementById('collector-name');
    const docInput = document.getElementById('collector-document');
    const phoneInput = document.getElementById('collector-phone');
    const whatsappInput = document.getElementById('collector-whatsapp');
    const resultsContainer = document.getElementById('collector-verification-results');

    const name = nameInput?.value.trim().toLowerCase();
    const documentNumber = docInput?.value.trim();
    const phone = phoneInput?.value.replace(/\D/g, ''); // Limpia no numéricos
    const whatsapp = whatsappInput?.value.replace(/\D/g, ''); // Limpia no numéricos

    // No buscar si los campos clave están vacíos
    if (!name && !documentNumber && !phone && !whatsapp) {
        resultsContainer.style.display = 'none';
        return;
    }

    resultsContainer.style.display = 'block';
    resultsContainer.innerHTML = `
        <div class="verification-card verification-loading">
            <i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i>
            <span>Verificando no sistema...</span>
        </div>`;
    lucide.createIcons({ nodes: resultsContainer.querySelectorAll('[data-lucide]') });

    try {
        // Firestore no soporta queries 'OR' complejas directamente.
        // Haremos varias queries pequeñas y uniremos los resultados.
        let potentialConflicts = [];
        const checkedIds = new Set(); // Para evitar duplicados si coinciden varios campos

        // Query por Nombre (más genérica, puede traer falsos positivos)
        // Se podría hacer más específica si es necesario
        if (name) {
            // No podemos hacer query por 'includes', así que traemos todos y filtramos
            // En una app real, esto sería ineficiente y necesitaría un backend o Algolia/Elasticsearch
        }

        // Query por Número de Documento (si existe)
        if (documentNumber) {
            const docQuery = query(collection(db, "collectors"), where("documentNumber", "==", documentNumber));
            const docSnapshot = await getDocs(docQuery);
            docSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'documentNumber', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Query por Teléfono (si existe)
        if (phone) {
            const phoneQuery = query(collection(db, "collectors"), where("phone", "==", phone));
            const phoneSnapshot = await getDocs(phoneQuery);
            phoneSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'phone', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Query por WhatsApp (si existe)
        if (whatsapp) {
            const whatsappQuery = query(collection(db, "collectors"), where("whatsapp", "==", whatsapp));
            const whatsappSnapshot = await getDocs(whatsappQuery);
            whatsappSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'whatsapp', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Simulación de búsqueda por nombre (Filtrado manual, ineficiente para muchos datos)
        if (name) {
            const allCollectorsSnapshot = await getDocs(collection(db, "collectors"));
            allCollectorsSnapshot.forEach(doc => {
                const collectorData = doc.data();
                if (collectorData.name && collectorData.name.toLowerCase().includes(name)) {
                    if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                        const reports = doc.data().reports;
                        const hasReports = Array.isArray(reports) && reports.length > 0;
                        const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                        potentialConflicts.push({ 
                            id: doc.id, 
                            data: doc.data(), 
                            matchedField: '...', // Mantén el campo original aquí
                            hasReports: hasReports,
                            lastReportReason: lastReport ? lastReport.reason : null 
                        });
                         checkedIds.add(doc.id);
                    }
                }
            });
        }


        renderCollectorVerificationResults(potentialConflicts);

    } catch (error) {
        console.error("Erro ao verificar cobrador:", error);
        resultsContainer.innerHTML = `<div class="verification-card verification-conflict">Erro ao verificar. Tente novamente.</div>`;
    }
}

function renderCollectorVerificationResults(conflicts) {
    const resultsContainer = document.getElementById('collector-verification-results');
    if (!resultsContainer) return;

    if (conflicts.length === 0) {
        resultsContainer.innerHTML = `
            <div class="verification-card verification-clean">
                <i data-lucide="check-circle" style="width: 32px; height: 32px; margin-bottom: 8px;"></i>
                <p style="font-weight: 600; margin: 0;">Cobrador Limpo</p>
                <p style="color: var(--text-secondary); font-size: 0.9em; margin: 5px 0 0;">Nenhuma coincidência encontrada no sistema.</p>
            </div>`;
    } else {
        const conflictsListHtml = conflicts.map(conflict =>
            `<li>
    <strong>${conflict.data.name || 'Nome não disponível'} (${conflict.id})</strong> - Coincidência: <strong>${conflict.matchedField}</strong>.

        async function generatePDFReport(collectorId, period) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const lang = currentLang;

            const collector = allCollectors.find(c => c.id === collectorId);
            if (!collector) return;

            const now = new Date();
            let startDate;
            if (period === '24h') startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            else if (period === '48h') startDate = new Date(now.getTime() - 48 * 60 * 60 * 1000);
            else if (period === 'week') startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            else if (period === 'month') startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            
            const clients = allClients.filter(c => c.collectorId === collectorId);
            const payments = clients.flatMap(c => (c.history || []).map(h => ({...h, clientName: c.name})))
                                 .filter(p => p.date?.seconds && new Date(p.date.seconds * 1000) >= startDate)
                                 .sort((a,b) => a.date.seconds - b.date.seconds);
            const totalCollected = payments.reduce((sum,p) => sum + p.amount, 0);

            doc.setFontSize(18);
            doc.text(`Relatório de Cobrança`, 105, 20, { align: 'center' });
            
            doc.autoTable({
                startY: 30,
                head: [['Cliente', 'Valor', 'Hora']],
                body: payments.map(p => [
                    p.clientName, 
                    money(p.amount), 
                    new Date(p.date.seconds * 1000).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                ]),
                foot: [['Total', money(totalCollected), '']],
                theme: 'striped',
                headStyles: { fillColor: [111, 66, 193] }
            });

            doc.save(`relatorio-${collectorId}-${period}.pdf`);
        }

        // Suma historial aprobado

                totalPaidGlobal += (h.amount || 0);

        totalLateFeesGlobal += (loan.lateFeesAccumulated || 0);

        if (loan.status === 'pending' || loan.status === 'late') {
            let isPaymentDay = false;

             if (frequency === 'daily') {

                 // Suma el valor original de la cuota, no el total del préstamo

            }
        }
    });

            reader.onload = (e) => {
                image.src = e.target.result;
                cropper = new Cropper(image, { aspectRatio: 1, viewMode: 1, background: false });
            };
            reader.readAsDataURL(file);

            document.getElementById('closeCropperModal').addEventListener('click', () => cropperModal.classList.remove('active'));
            document.getElementById('cancelCropBtn').addEventListener('click', () => cropperModal.classList.remove('active'));
            document.getElementById('confirmCropBtn').addEventListener('click', () => {
                cropper.getCroppedCanvas({ width: 256, height: 256, imageSmoothingQuality: 'high' }).toBlob((blob) => {
                    handleProfilePictureChange(blob);
                    cropperModal.classList.remove('active');
                }, 'image/jpeg');
            });
        }

        async function handleProfilePictureChange(blob) {
            if (!blob) return;
            const profileImageView = document.getElementById('profile-view-img');
            const headerImageView = document.querySelector('.profile img');

            const localUrl = URL.createObjectURL(blob);
            profileImageView.src = localUrl;
            headerImageView.src = localUrl;
            
            try {
                const formData = new FormData();
                formData.append('file', blob);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Cloudinary upload failed');
                const data = await response.json();
                const downloadURL = data.secure_url;
                
                await setDoc(doc(db, 'admins', 'admin'), { profilePictureUrl: downloadURL }, { merge: true });
                showToast('Foto de perfil atualizada!');
            } catch (error) {
                console.error("Erro ao atualizar foto de perfil: ", error);
                showToast('Falha ao atualizar a foto de perfil.', true);
            }
        }
        
        function applyLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        function applyTheme(theme) {

            if (themeToggle) {

        function updateSettingsForm(settings) {
    // Aborta si la vista de perfil (que ahora contiene los ajustes) no está renderizada
    if (!document.getElementById('settings-company-name')) return; 

    document.getElementById('settings-company-name').value = settings.companyName || '';
    document.getElementById('settings-logo-preview').src = settings.companyLogo || DEFAULT_LOGO_URL;
    document.getElementById('settings-default-interest').value = settings.defaultInterest || 20;
    document.getElementById('settings-gps-toggle').checked = settings.requireGps || false;

    // Deshabilita el botón de guardar hasta que se haga un cambio
    const saveBtn = document.getElementById('save-settings-btn');
    if (saveBtn) saveBtn.disabled = true;
}

        function loadGlobalSettings(settings) {
            const companyName = settings.companyName || 'LUMIX Finanças';
            const companyLogo = settings.companyLogo || DEFAULT_LOGO_URL;
            
            const elements = {
                headerLogoText: document.getElementById('header-logo-text'),
                headerLogo: document.getElementById('header-logo'),
                splashLogo: document.getElementById('splash-logo'),
                loginLogo: document.getElementById('login-logo'),
                installBannerLogo: document.getElementById('install-banner-logo') // Añadido
            };

            if (elements.headerLogoText) elements.headerLogoText.textContent = companyName;
            if (elements.headerLogo) elements.headerLogo.src = companyLogo;
            if (elements.splashLogo) elements.splashLogo.src = companyLogo;
            if (elements.loginLogo) elements.loginLogo.src = companyLogo;
            if (elements.installBannerLogo) elements.installBannerLogo.src = companyLogo; // Añadido
        }

        async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('username').value; // Ahora es un email
    const pass = document.getElementById('password').value;

    try {
        // ¡AQUÍ ESTÁ LA MAGIA!
        // Intentamos iniciar sesión con Firebase Auth
        await signInWithEmailAndPassword(auth, email, pass);

        // No necesitamos llamar a showMainApp() aquí.
        // El 'listener' del Paso 5 se encargará automáticamente.

    } catch (error) {
    // Este es el catch correcto para el LOGIN
    console.error("Erro de login:", error.code);
    if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
        showToast('Email ou senha inválidos.', true);
    } else if (error.code === 'auth/invalid-email') {
        showToast('Formato de email inválido.', true);
    } else {
        showToast('Erro ao tentar fazer login.', true);
    }
}
}

        
        function init() {
    document.body.classList.add('dark-mode');

    // Lógica del Banner de Instalación PWA (se queda igual)
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBanner = document.getElementById('install-banner');
        if (installBanner) {
            installBanner.style.display = 'block';
            applyLanguage(currentLang); // Aplica el idioma al nuevo contenido
        }
    });
    const installBtn = document.getElementById('install-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
            }
        });
    }
    const closeInstallBtn = document.getElementById('close-install-banner');
    if (closeInstallBtn) {
        closeInstallBtn.addEventListener('click', () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
        });
    }

    // Lógica de Global Settings (se queda igual)
    onSnapshot(doc(db, 'config', 'global'), (docSnap) => {
        if (docSnap.exists()) {
            globalSettings = docSnap.data(); 
            loadGlobalSettings(globalSettings); 
            updateSettingsForm(globalSettings); 
        } else {
            loadGlobalSettings({}); 
        }
    });

    // --- ¡AQUÍ ESTÁ EL GRAN CAMBIO! ---
    // Quitamos el setTimeout y usamos onAuthStateChanged.
    // Esto escucha si el usuario está logueado o no CADA VEZ que se carga la app.
    const splash = document.getElementById('splash-screen');

    onAuthStateChanged(auth, (user) => {
        // Ocultamos el splash AHORA
        splash.style.opacity = '0';
        setTimeout(() => {
            splash.style.display = 'none';
        }, 500);

        if (user) {
            // ¡El usuario SÍ está logueado! (Es el admin)
            // Ocultamos el login y mostramos la app
            document.getElementById('login-view').style.display = 'none';
            showMainApp(); // <-- ¡Llamamos a la app principal!
        } else {
            // El usuario NO está logueado
            // Mostramos la pantalla de login
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
            // Añadimos el listener para el formulario de login
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        }
    });
    // --- FIN DEL GRAN CAMBIO ---
}


        init();
    </script>
