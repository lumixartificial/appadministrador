    <style>
        /* === ESTILOS FUTURISTAS LUMIX NEON === */
    /* === ESTILOS ELEGANTES LUMIX (TEMA LILA SUAVE) === */
    :root {
        --bg: #f8fafc;       /* Fondo claro muy suave */
        --surface: #ffffff;  /* Blanco puro */
        --text-primary: #334155;   /* Gris oscuro suave para texto */
        --text-secondary: #64748b; /* Gris medio */
        
        /* Nueva Paleta Lila/Violeta */
        --accent-green: #10b981;   /* Verde Esmeralda (Éxito) */
        --accent-blue: #8b5cf6;    /* LILA/VIOLETA PRINCIPAL (Antes era Cyan) */
        --accent-blue-darker: #7c3aed; /* Violeta más oscuro para hover */
        --accent-purple: #a78bfa;  /* Lila pastel secundario */
        --accent-purple-darker: #8b5cf6;
        
        --warning-color: #f59e0b;  /* Ámbar (Alerta) */
        --danger-color: #ef4444;   /* Rojo suave (Error) */
        
        --border-color: #e2e8f0;
        --card-bg: #ffffff;
        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); /* Sombra suave natural */
    }

    body.dark-mode {
        --bg: #0f172a;       /* Slate 900: Un azul grisáceo oscuro elegante (No negro total) */
        --surface: #1e293b;  /* Slate 800: Un tono más claro para las tarjetas */
        --text-primary: #f1f5f9;   /* Blanco humo */
        --text-secondary: #94a3b8; /* Gris azulado claro */
        --border-color: rgba(255, 255, 255, 0.08); /* Bordes muy sutiles */
        
        /* Paleta Oscura "Soft" (Sin Neón) */
        --accent-green: #34d399;   /* Verde Menta suave */
        --accent-blue: #a78bfa;    /* LILA PASTEL (Principal en modo oscuro) */
        --accent-blue-darker: #8b5cf6;
        --accent-purple: #c084fc;  /* Lavanda */
        
        --warning-color: #fbbf24;  /* Ámbar pastel */
        --danger-color: #f87171;   /* Rojo Coral suave */
        
        /* Tarjetas mates y limpias */
        --card-bg: #1e293b; 
        --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    /* --- SOLUCIÓN MÓVIL: CUADRÍCULA INTELIGENTE --- */
    .kpi-grid { 
        display: grid; 
        /* En pantallas chicas (móvil), cada tarjeta ocupará todo el ancho. 
           En PC, si caben más de 280px, se pondrán al lado. */
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
        gap: 20px; 
        margin-bottom: 30px; 
    }

    /* --- TARJETAS FUTURISTAS --- */
    .kpi-card { 
        background: var(--card-bg); 
        padding: 25px; 
        border-radius: 16px; 
        box-shadow: var(--card-shadow); 
        border: 1px solid var(--border-color); 
        backdrop-filter: blur(10px); /* Efecto Blur */
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
        position: relative;
        overflow: hidden;
    }
    
    /* Efecto Hover (Levitar y Brillar) */
    .kpi-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .kpi-title { 
        display: flex; 
        align-items: center; 
        gap: 10px; 
        font-size: 0.85em; 
        text-transform: uppercase; 
        letter-spacing: 1px; /* Letras espaciadas estilo tech */
        font-weight: 700;
        color: var(--text-secondary); 
        margin: 0 0 15px; 
        opacity: 0.9;
    }
    
    .kpi-value { 
        font-size: 2em; /* Números más grandes */
        font-weight: 800; 
        margin: 0; 
        letter-spacing: -0.5px;
        text-shadow: 0 0 20px rgba(0,0,0,0.2); /* Sutil resplandor en texto */
    }

    /* ESTILOS RESTANTES NECESARIOS */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
    
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.9; } }
    @keyframes subtle-glow { 0%, 100% { filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.7)); } 50% { filter: drop-shadow(0 0 16px rgba(57, 255, 20, 0.7)); } }

    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; transition: opacity 0.5s ease-out; }
    #splash-screen img { width: 150px; height: 150px; animation: pulse 2.5s infinite ease-in-out; }

    #login-view { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; background-color: var(--bg); }
    .login-card { background-color: transparent; box-shadow: none; border: none; width: 100%; max-width: 400px; text-align: center; }
    .login-card .logo { display: flex; justify-content: center; }
    .login-card .logo img { width: 140px; height: 140px; margin-bottom: 30px; animation: subtle-glow 5s ease-in-out infinite; }
    .login-card h2 { margin-bottom: 10px; font-size: 1.8em; font-weight: 700; color: var(--text-primary); }
    .login-card p { margin-bottom: 40px; color: var(--text-secondary); }
    .login-card .form-group { text-align: left; margin-bottom: 20px; }
    .login-card .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary); }
    .login-card .form-group input { width: 100%; padding: 15px; font-size: 1em; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: var(--text-primary); transition: border-color 0.2s, box-shadow 0.2s; }
    .login-card .form-group input:focus { border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    .login-card .btn-primary { width: 100%; padding: 15px; font-size: 1.1em; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background-color: var(--accent-blue); color: white; transition: background-color 0.2s; }
    .login-card .btn-primary:hover { background-color: var(--accent-blue-darker); }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; font-size: 1em; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-primary); }
    .form-group input[readonly] { background-color: var(--bg); opacity: 0.7; cursor: not-allowed; }
    .form-group .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .day-selector { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 20px; }
    .day-selector label { padding: 10px; flex-grow: 1; font-weight: 600; font-size: 0.9em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background-color: var(--surface); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; }
    .day-selector input { display: none; }
    .day-selector input:checked + label { background-color: var(--accent-blue); color: white; border-color: var(--accent-blue); }

    #app-container { display: none; flex-direction: column; height: 100%; width: 100%; }
    main { flex-grow: 1; overflow-y: auto; }
    .container { padding: 20px; }
    
    .main-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { height: 40px; width: 40px; object-fit: cover; }
    .logo-text { font-size: 1.2em; font-weight: 700; color: var(--text-primary); }
    .header-controls { display: flex; align-items: center; gap: 10px; }
    .header-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .lang-dropdown { display: none; position: absolute; top: 40px; right: 0; background-color: var(--surface); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid var(--border-color); overflow: hidden; z-index: 110; }
    .lang-dropdown button { display: block; width: 100%; text-align: left; padding: 10px 15px; background: none; border: none; color: var(--text-primary); cursor: pointer; }
    .lang-dropdown button:hover { background-color: var(--bg); }
    .profile img { height: 40px; width: 40px; border-radius: 50%; border: 2px solid var(--accent-blue); object-fit: cover; }
    
    .section-title { font-size: 1.3em; font-weight: 600; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    .item-list { display: flex; flex-direction: column; gap: 15px; }
    
    .client-card, .report-item-card { background-color: var(--surface); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border-color); transition: transform 0.2s, box-shadow 0.2s; }
    .client-card, .report-item-card.clickable { cursor: pointer; }
    .client-card:hover, .report-item-card.clickable:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }

    .collector-card { background-color: var(--surface); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border-color); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .collector-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }
    .item-avatar img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .collector-card-main { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .collector-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .item-info { flex-grow: 1; min-width: 0; }
    .item-name { font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-subtext { font-size: 0.9em; color: var(--text-secondary); margin-top: 2px; }
    .item-details { text-align: right; }
    .item-detail-value { font-weight: 600; font-size: 1.1em; white-space: nowrap; flex-shrink: 0; }
    .item-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .item-status-tag, .tracking-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75em; font-weight: 600; padding: 4px 8px; border-radius: 12px; }
    .tracking-tag.available { background-color: #3b82f620; color: var(--accent-blue); }
    .tracking-tag.unavailable { background-color: #64748b20; color: var(--text-secondary); }

    .nav-item { position: relative; }
    .notification-badge { position: absolute; top: 2px; right: 8px; background-color: var(--danger-color); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7em; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); transform: scale(0); transition: transform 0.2s; }
    .notification-badge.visible { transform: scale(1); }

    .bottom-nav { flex-shrink: 0; background-color: var(--surface); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-secondary); text-decoration: none; font-size: 0.8em; padding: 5px 15px; cursor: pointer; }
    .nav-item.active { color: var(--accent-blue); }
    
     /* --- CORRECCIÓN DE CAPAS (Z-INDEX) --- */
    
    /* Base para ambos */
    .modal-view, .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

    /* 1. Paneles Deslizantes (Perfil Cobrador/Cliente) -> Nivel 9990 */
    .modal-view { 
        z-index: 9990; 
        background-color: var(--bg); 
        transform: translateX(100%); 
        transition: transform 0.3s ease-in-out; 
        display: flex; 
        flex-direction: column; 
    }
    .modal-view.active { transform: translateX(0); }

    /* 2. Cuadros Flotantes (Retirada, Alertas) -> Nivel 10000 (SIEMPRE ENCIMA) */
    .modal-overlay { 
        z-index: 10000 !important; 
        background-color: rgba(0,0,0,0.6); 
        backdrop-filter: blur(4px); 
        display: none; 
        justify-content: center; 
        align-items: center; 
    }
    .modal-overlay.active { display: flex; }
    .modal-content { background-color: var(--surface); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }
    .modal-header { display: flex; align-items: center; padding: 15px 20px; background-color: var(--surface); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .modal-header button { background: none; border: none; color: var(--text-primary); cursor: pointer; margin-right: 15px; }
    .modal-title { font-size: 1.2em; font-weight: 600; flex-grow: 1; }
    .modal-content-wrapper { flex-grow: 1; overflow-y: auto; }
     /* CORRECCIÓN: BOTONES SIEMPRE VISIBLES Y CLICKABLES */
    .action-buttons { 
        background-color: var(--surface); 
        border-top: 1px solid var(--border-color); 
        padding: 15px 20px; 
        display: flex; 
        gap: 15px; 
        margin-top: auto; 
        position: sticky; 
        bottom: 0; 
        flex-shrink: 0;
        z-index: 1000; /* PRIORIDAD MÁXIMA: Evita que la lista los tape */
        box-shadow: 0 -5px 20px rgba(0,0,0,0.1); /* Sombra para separar visualmente */
        
        /* Habilitar deslizamiento */
        overflow-x: auto; 
        white-space: nowrap;
        -webkit-overflow-scrolling: touch; 
        scrollbar-width: none; 
    }
    
    .action-buttons::-webkit-scrollbar { display: none; }

    .action-buttons button { 
        flex-grow: 1; 
        flex-shrink: 0; 
        min-width: fit-content; 
        padding: 15px; 
        font-size: 1em; 
        font-weight: 600; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px; 
        transition: transform 0.1s ease, background-color 0.2s; /* Animación suave */
    }

    /* EFECTO DE CLIC: EL BOTÓN BAJA */
    .action-buttons button:active {
        transform: translateY(3px) scale(0.98); 
    }
    
    /* Ocultar barra de scroll en Chrome/Safari */
    .action-buttons::-webkit-scrollbar { display: none; }

    .action-buttons button { 
        flex-grow: 1; 
        flex-shrink: 0; /* IMPIDE que se aplasten */
        min-width: fit-content; /* ASEGURA que el texto quepa entero */
        padding: 15px; 
        font-size: 1em; 
        font-weight: 600; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px; 
    }

    /* COLORES (Se mantienen) */
    .btn-primary { background-color: var(--accent-blue); color: white; }
    .btn-secondary { background-color: transparent; color: var(--accent-blue); border: 2px solid var(--accent-blue); }
    .btn-danger { background-color: var(--danger-color); color: white; }
    .action-buttons button:disabled { background-color: var(--text-secondary); cursor: not-allowed; opacity: 0.7; }
    .fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; background-color: var(--accent-blue); color: white; border-radius: 50%; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 160; }
    .view { display: none; }
    .view.active { display: block; }
    .search-bar-wrapper { position: relative; margin-bottom: 20px; }
    .search-bar-wrapper input { width: 100%; padding: 12px 12px 12px 40px; font-size: 1em; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--surface); color: var(--text-primary); }
    .search-bar-wrapper .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
     #toast-container { 
        position: fixed; 
        top: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        z-index: 20000 !important; /* <--- CAMBIO AQUÍ: Nivel súper alto */
        pointer-events: none; /* Para que puedas hacer clic debajo si el mensaje estorba */
    }
    .toast { background-color: #333; color: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 0.9em; opacity: 0; transform: translateY(-20px); transition: opacity 0.3s, transform 0.3s; }
    .toast.show { opacity: 1; transform: translateY(0); }

            function checkAndRunGlobalUpdate() {
            if (collectorsReady && clientsReady && expensesReady && settlementsReady && capitalInjectionsReady) {
                console.log("[ADMIN-APP] Datos listos. Actualizando todo...");
                
                calculatedCollectorMetrics.clear(); 
                
                let sumGlobalDistributed = 0;
                let sumGlobalPatrimonio = 0;
                let sumGlobalCapitalOnHand = 0; 

                allCollectors.forEach(collector => {
                    const metrics = calculateCollectorMetrics(
                        collector.id, collector, allClients, allExpenses, allSettlements, allCapitalInjections
                    );
                    calculatedCollectorMetrics.set(collector.id, metrics);

                    sumGlobalDistributed += (metrics.totalDistributedCapital || 0);
                    sumGlobalPatrimonio += (metrics.totalPatrimonio || 0);
                    sumGlobalCapitalOnHand += (metrics.capitalOnHand || 0); 
                });

                calculatedGlobalMetrics = calculateGlobalMetrics(
                    allCollectors, allClients, allExpenses, allSettlements, allCapitalInjections
                );
                
                calculatedGlobalMetrics.sumGlobalDistributed = sumGlobalDistributed;
                calculatedGlobalMetrics.sumGlobalPatrimonio = sumGlobalPatrimonio;
                calculatedGlobalMetrics.sumGlobalCapitalOnHand = sumGlobalCapitalOnHand; 
                
                updateDashboard();
                updateProfileView();
                updateAdminNotificationsView();
                
                // --- NUEVO: ACTUALIZAR EL MAPA TAMBIÉN ---
                // Esto asegura que en cuanto carguen los clientes, aparezcan en el mapa
                if (mapInstance) {
                    updateCollectorMarkers();
                }
                // -----------------------------------------
                
                if (document.getElementById('reports-view') && document.getElementById('reports-view').classList.contains('active')) {
                    updateReportsView();
                }
            } 
        }



               function calculateGlobalMetrics(collectors, clients, expenses, settlements, capitalInjections) {
            let totalStartingCapital = 0;
            let totalPaidFromHistory = 0;
            let totalPrincipalFromLoans = 0;
            let totalLateFeesGlobal = 0;
            let totalMicroInsuranceGlobal = 0; 
            let expectedToday = 0;
            const today = new Date();
            const dayOfWeek = today.getDay();
            const dayOfMonth = today.getDate();

            collectors.forEach(c => {
                totalStartingCapital += (c.startingCapital || 0);
            });

            clients.forEach(client => {
                (client.loans || []).forEach(loan => {
                    const insuranceVal = parseFloat(loan.microInsurance);
                    if (!isNaN(insuranceVal)) {
                        totalMicroInsuranceGlobal += insuranceVal;
                    }

                    let principal = 0;
                    if (loan.principalAmount) {
                        principal = loan.principalAmount;
                    } else if (loan.totalLoan && client.interestRate) { 
                        principal = (loan.totalLoan / (1 + (client.interestRate / 100)));
                    }
                    totalPrincipalFromLoans += principal;

                    (loan.history || []).forEach(h => {
                         if (h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                            totalPaidFromHistory += (h.amount || 0);
                        }
                    });

                    totalLateFeesGlobal += (loan.lateFeesAccumulated || 0);

                    if (loan.status === 'pending' || loan.status === 'late') {
                        let isPaymentDay = false;
                        const frequency = loan.paymentFrequency || 'daily';
                        if (frequency === 'daily') isPaymentDay = (loan.paymentDays || []).includes(dayOfWeek);
                        else if (frequency === 'weekly') isPaymentDay = (loan.paymentDays || [])[0] === dayOfWeek;
                        else if (frequency === 'monthly') isPaymentDay = (loan.paymentDays || [])[0] === dayOfMonth;

                        if (isPaymentDay) {
                            expectedToday += (loan.originalInstallmentAmount || 0);
                        }
                    }
                });
            });

            const totalExpensesGlobal = expenses.reduce((sum, expense) => sum + (expense.value || 0), 0);
            
            // Filtramos retiros de capital (para el balance general)
            const totalSettlementsGlobal = settlements
                .filter(s => s.status === 'approved' && s.type !== 'insurance')
                .reduce((sum, s) => sum + (s.amount || 0), 0);
            
            const totalInjectionsGlobal = capitalInjections.filter(i => i.status === 'approved').reduce((sum, i) => sum + (i.amount || 0), 0);
            
            // --- CORRECCIÓN MAESTRA: SINCRONIZACIÓN DE SEGURO ---
            // Ahora calculamos los retiros de seguro usando 'settlements' (lo visible), 
            // igual que hacen los perfiles individuales. Así garantizamos que sumen igual.
            const totalInsuranceWithdrawn = settlements
                .filter(s => s.status === 'approved' && s.type === 'insurance')
                .reduce((sum, s) => sum + (s.amount || 0), 0);
            
            // Disponible Global
            const availableInsuranceFund = Math.max(0, totalMicroInsuranceGlobal - totalInsuranceWithdrawn);

            // Fórmulas Contables
            const totalCapital = totalStartingCapital + totalInjectionsGlobal + totalPaidFromHistory - totalPrincipalFromLoans - totalExpensesGlobal - totalSettlementsGlobal + totalLateFeesGlobal;
            
            const fieldValue = (totalPrincipalFromLoans + totalLateFeesGlobal) - totalPaidFromHistory;
            const grossProfitBeforeExpenses = (totalPaidFromHistory + totalLateFeesGlobal) - totalPrincipalFromLoans;
            const grossProfit = grossProfitBeforeExpenses - totalExpensesGlobal; 
            
            const activeClientsCount = clients.filter(c => (c.loans || []).some(l => l.status !== 'finished')).length;
            
            return {
                totalCapital,
                activeCollectorsCount: collectors.length,
                activeClientsCount,
                totalStartingCapital, 
                expectedToday,
                fieldValue,
                grossProfit,
                totalExpensesGlobal,
                totalSettlementsGlobal,
                totalInjectionsGlobal,
                totalMicroInsuranceGlobal, 
                totalInsuranceWithdrawn,   
                availableInsuranceFund     
            };
        }

              function calculateCollectorMetrics(collectorId, collector, allClients, allExpenses, allSettlements, allCapitalInjections) {
            
            const collectorClients = allClients.filter(c => c.collectorId === collectorId);
            const collectorExpenses = allExpenses.filter(e => e.collectorId === collectorId);
            
            // 1. RETIROS DE CAPITAL (Para restar de la Caja en Manos)
            const collectorSettlementsCapital = allSettlements.filter(s => 
                s.collectorId === collectorId && 
                s.status === 'approved' && 
                s.type !== 'insurance' 
            );

            // 2. RETIROS DE SEGURO (Para restar de la Tarjeta de Seguro de este cobrador)
            const collectorSettlementsInsurance = allSettlements.filter(s => 
                s.collectorId === collectorId && 
                s.status === 'approved' && 
                s.type === 'insurance' 
            );
            // Sumamos cuánto ha retirado este cobrador de seguro
            const totalInsuranceWithdrawn = collectorSettlementsInsurance.reduce((sum, s) => sum + (s.amount || 0), 0);

            const collectorInjections = allCapitalInjections.filter(i => i.collectorId === collectorId && i.status === 'approved');

            let totalPaid = 0; 
            let totalPrincipal = 0; 
            let totalDistributedCapital_Outstanding = 0; 
            let totalLateFees = 0;
            let dailyCollected = 0, weeklyCollected = 0, monthlyCollected = 0;
            let expectedToday = 0;
            // Acumulador de Seguro (Bruto generado por sus clientes)
            let collectorTotalInsuranceGenerated = 0; 

            const now = new Date();
            const todayStart = new Date(new Date().setHours(0, 0, 0, 0));
            const weekStart = new Date(todayStart);
            weekStart.setDate(weekStart.getDate() - weekStart.getDay());
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            let activeClientsCount = 0;
            const lateClientIds = new Set(); 

            collectorClients.forEach(c => { 
                let isClientActive = false; 
                (c.loans || []).forEach(loan => {
                    const loanDetails = calculateLoanDetails(loan);
                    const currentStatus = loanDetails.status;

                    if (!loan.migrationDate) {
                        if (loan.principalAmount) {
                            totalPrincipal += loan.principalAmount;
                        } else if (loan.totalLoan && c.interestRate) {
                            totalPrincipal += (loan.totalLoan / (1 + (c.interestRate / 100)));
                        }
                    }

                    // Sumamos lo generado (Bruto)
                    collectorTotalInsuranceGenerated += (parseFloat(loan.microInsurance) || 0);
                    // Calculamos la meta: Solo sumamos la cuota si HOY es día de pago para este cliente
                    const todayDate = new Date();
                    const dayW = todayDate.getDay();
                    const dayM = todayDate.getDate();
                    const pDays = loan.paymentDays || [];
                    const freq = loan.paymentFrequency || 'daily';
                    let isToday = false;

                    if (freq === 'daily') isToday = pDays.includes(dayW);
                    else if (freq === 'weekly') isToday = pDays[0] === dayW;
                    else if (freq === 'monthly') isToday = pDays[0] === dayM;

                    if (isToday && loanDetails.status !== 'finished') {
                        expectedToday += (parseFloat(loan.originalInstallmentAmount) || 0);
                    }


                    (loan.history || []).forEach(h => {
                        if (h.date?.seconds && h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                            const paymentAmount = h.amount || 0;
                            totalPaid += paymentAmount; 
                            const paymentDate = new Date(h.date.seconds * 1000);
                            if (paymentDate >= todayStart) dailyCollected += paymentAmount;
                            if (paymentDate >= weekStart) weeklyCollected += paymentAmount;
                            if (paymentDate >= monthStart) monthlyCollected += paymentAmount;
                        }
                    });
                    
                    if (currentStatus !== 'finished') {
                        const totalPaidForThisLoan = (loan.history || [])
                            .filter(h => h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed')
                            .reduce((sum, h) => sum + (h.amount || 0), 0);
                        const outstandingBalance = (loan.totalLoan || 0) - totalPaidForThisLoan;
                        totalDistributedCapital_Outstanding += outstandingBalance;
                        isClientActive = true; 
                    }

                    totalLateFees += (loanDetails.lateFeesAccumulated || 0);
                    if (currentStatus === 'late') {
                        lateClientIds.add(c.id); 
                    }
                });
                if (isClientActive) {
                    activeClientsCount++;
                }
            });

            const totalExpenses = collectorExpenses.reduce((sum, e) => sum + (e.value || 0), 0);
            const totalSettledCapital = collectorSettlementsCapital.reduce((sum, s) => sum + (s.amount || 0), 0);
            const totalInjected = collectorInjections.reduce((sum, i) => sum + (i.amount || 0), 0);

            const currentStartingCapital = (collector && collector.startingCapitalOnHand !== undefined) 
                ? collector.startingCapitalOnHand 
                : (collector && collector.startingCapital) || 0; 
            
            const capitalOnHand = currentStartingCapital + totalInjected + totalPaid - totalPrincipal - totalExpenses - totalSettledCapital;
            const totalPatrimonio = capitalOnHand + totalDistributedCapital_Outstanding;

            const totalClientsCount = collectorClients.length;
            const lateClientsCount = lateClientIds.size;
            
            // --- CÁLCULO FINAL: Seguro Neto del Cobrador ---
            const collectorNetInsurance = Math.max(0, collectorTotalInsuranceGenerated - totalInsuranceWithdrawn);

            let statusKey = 'inOrder';
            let statusColor = 'var(--accent-green)';
            let statusIcon = 'check-circle';
            const countForReputation = activeClientsCount > 0 ? activeClientsCount : 0;
            if (countForReputation > 0) {
                const latePercentage = (lateClientsCount / countForReputation) * 100;
                if (latePercentage > 20) {
                    statusKey = 'attention'; statusColor = 'var(--danger-color)'; statusIcon = 'alert-octagon';
                } else if (latePercentage > 0) {
                     statusKey = 'attention'; statusColor = 'var(--warning-color)'; statusIcon = 'alert-triangle';
                }
            }

            return {
                capitalOnHand, 
                expectedToday,
                totalDistributedCapital: totalDistributedCapital_Outstanding,
                totalPatrimonio, 
                collectorTotalInsurance: collectorNetInsurance, // <--- AHORA RESTA SUS PROPIOS RETIROS
                totalClientsCount, 
                activeClientsCount, 
                lateClientsCount, 
                dailyCollected,
                weeklyCollected,
                monthlyCollected,
                totalPaid,
                totalPrincipal,
                totalLateFees,
                totalExpenses,
                totalSettled: totalSettledCapital,
                totalInjected,
                status: {
                    textKey: statusKey,
                    color: statusColor,
                    icon: statusIcon
                }
            };
        }

        function showToast(message, type = 'normal') {
            const toast = document.createElement('div');
            
            // Estilos base
            let cssClass = 'toast';
            let bgColor = '#333'; // Gris (Default)
            let textColor = '#fff';
            let iconHtml = '';

            // --- SELECCIÓN DE COLOR ---
            if (type === true || type === 'error') {
                cssClass += ' toast-error';
                bgColor = '#ef4444'; // Rojo
            } 
            else if (type === 'success') { // Verde
                cssClass += ' toast-success';
                bgColor = '#10b981'; 
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            } 
            else if (type === 'purple') { // Lila/Morado
                bgColor = '#8b5cf6'; 
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`;
            }
            else if (type === 'yellow') { // Amarillo
                bgColor = '#f59e0b';
                textColor = '#000000'; // Letra negra para contraste
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
            }
            else if (type === 'blue') { // Azul (NUEVO para Idioma)
                bgColor = '#3b82f6';
                iconHtml = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>`;
            }
            
            toast.className = cssClass;
            // Aplicamos estilos directos para asegurar visibilidad
            toast.style.backgroundColor = bgColor;
            toast.style.color = textColor;
            toast.style.fontWeight = '600';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            
            if (iconHtml) {
                toast.innerHTML = `<span style="display:flex; align-items:center;">${iconHtml} ${message}</span>`;
            } else {
                toast.textContent = message;
            }

            const container = document.getElementById('toast-container');
            if (container) {
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 500);
                }, 3500);
            }
        }


        
         function showConfirmationModal(title, message, confirmText = 'Confirmar', confirmClass = 'btn-danger', customColor = null, textColor = 'white') {
            return new Promise((resolve) => {
                const modal = document.getElementById('reportOptionsModal');
                if (!modal) {
                    console.error("Modal no encontrado.");
                    resolve(false); 
                    return;
                }

                // Color por defecto
                let mainColor = 'var(--accent-blue)';
                if (confirmClass.includes('btn-danger')) mainColor = 'var(--danger-color)';
                
                // Si se pasa un color personalizado (ej: amarillo), lo usamos
                if (customColor) mainColor = customColor;

                // Estilo del botón
                let btnStyle = '';
                if (customColor) {
                    btnStyle = `background-color: ${customColor}; border-color: ${customColor}; color: ${textColor};`;
                }

                modal.innerHTML = `
                <div class="modal-content" style="max-width: 450px; text-align: center;">
                    <i data-lucide="alert-triangle" style="width: 48px; height: 48px; color: ${mainColor}; margin-bottom: 15px;"></i>
                    <h3 style="font-size: 1.25em; font-weight: 600; margin-top: 0; margin-bottom: 10px;">${title}</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5;">${message}</p>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button id="confirm-cancel" class="btn-secondary" style="background-color: var(--surface); border-color: var(--border-color); color: var(--text-secondary);">Cancelar</button>
                        <button id="confirm-accept" class="${confirmClass}" style="${btnStyle}">${confirmText}</button>
                    </div>
                </div>
                `;
                
                lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });
                modal.classList.add('active');

                const btnCancel = modal.querySelector('#confirm-cancel');
                const btnAccept = modal.querySelector('#confirm-accept');

                const close = (result) => {
                    modal.classList.remove('active');
                    resolve(result); 
                };

                btnCancel.addEventListener('click', (e) => { e.stopPropagation(); close(false); });
                btnAccept.addEventListener('click', (e) => { e.stopPropagation(); close(true); });
                modal.addEventListener('click', (e) => { if (e.target.id === 'reportOptionsModal') close(false); }, { once: true });
            });
        }







        function showBlockedView(message) {
    console.error("Acceso bloqueado:", message);
    // Ocultamos todas las vistas principales
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-container').style.display = 'none';

    // Creamos y mostramos el mensaje de bloqueo (si no existe ya)
    let blockedView = document.getElementById('blocked-view');
    if (!blockedView) {
        blockedView = document.createElement('div');
        blockedView.id = 'blocked-view';
        // Usamos estilos en línea para asegurar que funcione
        blockedView.style.cssText = 'display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; text-align: center; background-color: var(--bg);';
        document.body.appendChild(blockedView);
    }

    // El HTML de la pantalla de bloqueo
    blockedView.innerHTML = `
        <i data-lucide="shield-off" style="width: 64px; height: 64px; color: var(--danger-color); margin-bottom: 20px;"></i>
        <h2 style="color: var(--text-primary); margin-bottom: 10px;">Acesso Negado</h2>
        <p style="color: var(--text-secondary); max-width: 400px; line-height: 1.5;">${message}</p>
        <button id="logout-blocked-btn" class="btn-primary" style="margin-top: 30px; background-color: var(--danger-color); border: none;">Sair (Log Out)</button>
    `;
    lucide.createIcons({ nodes: [blockedView.querySelector('i')] });

    // Añadimos un listener al nuevo botón de logout
    const logoutBtn = document.getElementById('logout-blocked-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch(err => console.error("Error en logout forzado:", err));
        });
    }
}

/**
 * Envía una notificación INTERNA y PUSH a un CLIENTE específico.
 */
async function sendNotificationToClient(clientId, title, body, type, icon = 'info') {
    if (!clientId || !currentCompanyId) {
        console.error(`[ADMIN->CLIENTE] Error: Faltan IDs para enviar notificación.`);
        return;
    }
    try {
        const clientRef = doc(db, 'companies', currentCompanyId, 'clients', clientId);

        // 1. Notificación INTERNA (para la app del cliente)
        const internalNotif = {
            title: title, body: body, icon: icon, read: false,
            timestamp: new Date(), id: `${type}_${Date.now()}`
        };
        await updateDoc(clientRef, { notifications: arrayUnion(internalNotif) });
        console.log(`[ADMIN->CLIENTE] Notificación INTERNA para cliente [${clientId}] creada.`);

        // 2. Ticket PUSH (para la Cloud Function del cliente)
        const ticketRef = collection(db, 'companies', currentCompanyId, 'clients', clientId, 'pushNotificationTickets');
        await addDoc(ticketRef, {
            title: title, body: body, type: type, icon: icon,
            url: `https://lumix-financas-app.web.app/client/index.html?page=notifications`,
            createdAt: serverTimestamp()
        });
        console.log(`[ADMIN->CLIENTE] Ticket PUSH para cliente [${clientId}] enviado.`);
    } catch (error) {
        console.error(`[ADMIN->CLIENTE] Error al enviar notificación al cliente [${clientId}]:`, error);
    }
}

/**
 * Envía una notificación INTERNA y PUSH a un COBRADOR específico.
 */
async function sendNotificationToCollector(collectorId, title, body, type, icon = 'info', clientId = null) {
    if (!collectorId) {
        console.error(`[ADMIN->COBRADOR] Error: Falta collectorId.`);
        return;
    }
    try {
        // 1. Notificación INTERNA (para la app del cobrador)
        // (Nota: la colección 'collectors' está en la raíz)
        const notificationsCollectionRef = collection(db, 'collectors', collectorId, 'notifications');
        const notificationData = {
            title: title, body: body,
            from: 'Administrador', // El remitente es el Admin
            clientId: clientId || '', // Pasa el clientId si está disponible
            timestamp: serverTimestamp(),
            read: false, type: type, icon: icon,
            profilePictureUrl: currentCompanyData?.plan?.companyLogo || DEFAULT_LOGO_URL // Usa el logo de la empresa
        };
        await addDoc(notificationsCollectionRef, notificationData);
        console.log(`[ADMIN->COBRADOR] Notificación INTERNA para cobrador [${collectorId}] creada.`);

        // 2. Ticket PUSH (para la Cloud Function del cobrador)
        const collectorTicketRef = collection(db, 'collectors', collectorId, 'pushNotificationTickets');
        const ticketData = {
            title: title, body: body, type: type, icon: icon,
            url: clientId ? `https://lumix-financas-app.web.app/collector/index.html?page=client-details&clientId=${clientId}` : 'https://lumix-financas-app.web.app/collector/index.html?page=notifications',
            senderAdminId: auth.currentUser.uid,
            createdAt: serverTimestamp()
        };
        await addDoc(collectorTicketRef, ticketData);
        console.log(`[ADMIN->COBRADOR] Ticket PUSH para cobrador [${collectorId}] enviado.`);
    } catch (error) {
        console.error(`[ADMIN->COBRADOR] Error al enviar notificación al cobrador [${collectorId}]:`, error);
    }
}

        function formatTimestamp(timestamp) {
            if (!timestamp || !timestamp.seconds) return '';
            const date = timestamp.toDate();
            return date.toLocaleTimeString(currentLang === 'pt' ? 'pt-BR' : 'es-ES', { hour: '2-digit', minute: '2-digit' });
        }

        const nationalHolidays = [ '01/01', '21/04', '01/05', '07/09', '12/10', '02/11', '15/11', '25/12' ];

        
        function calculateLoanDetails(loan) {
           let details = {
               lateDays: 0,
               lateFeesAccumulated: 0,
               fixedFineApplied: 0, 
               hasFixedFine: false, 
               status: 'pending', 
               nextDueDate: null, 
               amountDueToday: 0 
           };

           // 1. Filtrar pagos válidos y ordenarlos
           let validPayments = (loan.history || []).filter(h => 
               h.status !== 'pending_verification' && 
               h.status !== 'rejected' && 
               h.status !== 'postponed'
           );
           
           validPayments.sort((a, b) => {
               const dateA = a.date?.seconds ? new Date(a.date.seconds * 1000) : new Date(a.date);
               const dateB = b.date?.seconds ? new Date(b.date.seconds * 1000) : new Date(b.date);
               return dateA - dateB;
           });

           // 2. Totales Básicos
           const currentTotalPaidGlobal = validPayments.reduce((sum, h) => sum + (parseFloat(h.amount) || 0), 0);
           const totalOriginalDebt = parseFloat(loan.totalLoan) || 0;

           // Estado forzado si ya estaba finalizado (Legacy)
           if (loan.status === 'finished') {
               details.status = 'finished';
               return details;
           }

           // 3. Configurar Fechas (Normalización estricta a medianoche)
           const today = new Date();
           today.setHours(0, 0, 0, 0); 
           
           let startDateObj = null;
           if (loan.startDate) {
               if (loan.startDate.seconds) startDateObj = new Date(loan.startDate.seconds * 1000);
               else if (loan.startDate instanceof Date) startDateObj = loan.startDate;
               else if (typeof loan.startDate === 'string') startDateObj = new Date(loan.startDate);
           }

           if (!startDateObj || isNaN(startDateObj.getTime())) return details;
           
           // Inicio del bucle: Día siguiente al inicio
           startDateObj.setHours(0, 0, 0, 0);
           let checkDate = new Date(startDateObj); 
           checkDate.setDate(checkDate.getDate() + 1); 
           
           let accumulatedLateDays = 0;
           let accumulatedLateFees = 0; 
           const dailyLateRate = (loan.lateFeeRate || 0) / 100;
           const installmentAmount = parseFloat(loan.originalInstallmentAmount) || parseFloat(loan.amount) || 0;
           let installmentsDueCount = 0; 
           
           // Límite de seguridad para el bucle
           let stopDate = new Date(today);
           stopDate.setDate(stopDate.getDate() + 60); 

           if (checkDate > stopDate) return details;

           // 4. Bucle Histórico (Calcula qué debió pagarse día a día)
           while (checkDate <= stopDate) {
               const dayOfWeek = checkDate.getDay();
               const dayOfMonth = checkDate.getDate();
               const isHoliday = false; 
               const frequency = loan.paymentFrequency || 'daily';
               let isPaymentDay = false;
               
               const pDays = (loan.paymentDays && loan.paymentDays.length > 0) ? loan.paymentDays : [1, 2, 3, 4, 5, 6];
               
               if (frequency === 'daily') isPaymentDay = pDays.some(d => String(d) === String(dayOfWeek));
               else if (frequency === 'weekly') isPaymentDay = pDays.length > 0 && String(pDays[0]) === String(dayOfWeek);
               else if (frequency === 'monthly') isPaymentDay = pDays.length > 0 && String(pDays[0]) === String(dayOfMonth);
               else if (frequency === 'biweekly') {
                   // LÓGICA QUINCENAL CORREGIDA (Usa Math.floor siempre para consistencia)
                   if (pDays.length > 0 && String(pDays[0]) === String(dayOfWeek)) {
                        const diffTime = checkDate.getTime() - startDateObj.getTime();
                        // 1 día = 86400000 ms. Usamos Math.round para evitar errores de horario de verano
                        const diffDays = Math.round(diffTime / 86400000);
                        const weekNumber = Math.floor(diffDays / 7);
                        // Paga en semanas pares (0, 2, 4...) después del inicio
                        if (weekNumber % 2 === 0) isPaymentDay = true;
                   }
               }

               if (isPaymentDay && !isHoliday) {
                   const endOfCheckDate = new Date(checkDate);
                   endOfCheckDate.setHours(23, 59, 59, 999);

                   const paidByThisDate = validPayments.reduce((sum, h) => {
                       if (h.method === 'migration') return sum + (parseFloat(h.amount) || 0);
                       let pDate = h.date?.seconds ? new Date(h.date.seconds * 1000) : new Date(h.date);
                       if (pDate <= endOfCheckDate) {
                           return sum + (parseFloat(h.amount) || 0);
                       }
                       return sum;
                   }, 0);

                   // A) Días Pasados (Atraso)
                   if (checkDate.getTime() < today.getTime()) {
                       installmentsDueCount++; 
                       const expectedPaidByThisDate = installmentsDueCount * installmentAmount;
                       const outstandingDueAmount = Math.max(0, expectedPaidByThisDate - paidByThisDate);

                       // Tolerancia de 0.9 para centavos
                       if (outstandingDueAmount > 0.9) { 
                           accumulatedLateDays++; 
                           if (dailyLateRate > 0) accumulatedLateFees += (outstandingDueAmount * dailyLateRate);
                       }
                   } 
                   // B) El Día de HOY (Cobro actual)
                   else if (checkDate.getTime() === today.getTime()) {
                       const expectedTotalIncludingToday = (installmentsDueCount + 1) * installmentAmount;
                       
                       // [CORRECCIÓN CRÍTICA] Cálculo de saldo restante real
                       // Si ya pagó una parte, solo mostramos la diferencia.
                       if (currentTotalPaidGlobal < expectedTotalIncludingToday - 0.1) {
                           const gap = expectedTotalIncludingToday - currentTotalPaidGlobal;
                           // El cobro de hoy es el gap, pero nunca más que una cuota completa (salvo que sea la última)
                           details.amountDueToday = gap; 
                       }
                       
                       if (!details.nextDueDate) details.nextDueDate = new Date(checkDate);
                   } 
                   // C) Futuro
                   else if (checkDate > today && !details.nextDueDate) {
                       details.nextDueDate = new Date(checkDate);
                   }
               }
               
               if (details.nextDueDate && checkDate > today) break;
               checkDate.setDate(checkDate.getDate() + 1);
           }
           
           // Cálculo de Días de Atraso Totales
           const totalExpectedUpToYesterday = installmentsDueCount * installmentAmount;
           const currentGap = totalExpectedUpToYesterday - currentTotalPaidGlobal;

           if (currentGap > 0.5 && installmentAmount > 0) {
               details.lateDays = Math.ceil(currentGap / installmentAmount);
           } else {
               details.lateDays = 0;
           }
           
           // Cálculo de Multa Fija
           const fixedFineAmount = parseFloat(loan.lateFeeAmount) || 0;
           let appliedFixedFine = 0;
           
           if (accumulatedLateDays >= 5 && fixedFineAmount > 0) {
               appliedFixedFine = fixedFineAmount;
               details.fixedFineApplied = fixedFineAmount; 
               details.hasFixedFine = true; 
           }

           // --- LÓGICA DE FINALIZACIÓN Y ESTADO ---
           
           // 1. ¿Pagó el Capital Original?
           const isCapitalPaid = currentTotalPaidGlobal >= totalOriginalDebt - 0.5; // Tolerancia 50 centavos

           if (isCapitalPaid) {
               // Si pagó el capital, la mora diaria deja de correr. Solo queda la multa fija si aplica.
               details.lateFeesAccumulated = appliedFixedFine;
               
               const totalDebtWithFixedFine = totalOriginalDebt + appliedFixedFine;

               if (currentTotalPaidGlobal >= totalDebtWithFixedFine - 0.5) {
                   // Pagó Capital + Multa Fija -> FINALIZADO
                   details.status = 'finished';
               } else {
                   // Pagó Capital pero debe la Multa Fija -> ATRASADO
                   details.status = 'late';
               }
           } else {
               // Aún debe capital -> Sumamos intereses diarios + Multa Fija
               details.lateFeesAccumulated = accumulatedLateFees + appliedFixedFine;
               details.status = (details.lateDays > 0) ? 'late' : 'pending';
               
               // Verificación de seguridad por si la deuda total era menor a lo esperado
               const totalDebtFull = totalOriginalDebt + details.lateFeesAccumulated;
               if (currentTotalPaidGlobal >= totalDebtFull - 0.5) {
                   details.status = 'finished';
               }
           }
           
           return details;
       }

        

        function calculateCollectorStatus(collectorId) {
            // Ahora simplemente LEE los datos pre-calculados del mapa.
            const metrics = calculatedCollectorMetrics.get(collectorId);
            
            if (!metrics || !metrics.status) {
                // Fallback por si los datos aún no están listos
                return { textKey: 'inOrder', color: 'var(--accent-green)', icon: 'check-circle' };
            }
            
            // Devuelve el objeto de estado que la función maestra ya calculó
            return metrics.status; 
        }

async function handlePostLike(postId) {
    const postRef = doc(db, 'communityPosts', postId);
    const post = allCommunityPosts.find(p => p.id === postId);
    if (!post) return;

    const adminId = currentAdmin.id;
    let newLikedBy = post.likedBy || [];
    const likeBtn = document.querySelector(`.post-card[data-post-id="${postId}"] .action-btn[data-action="like"]`);
    let newLikesCount;

    if (newLikedBy.includes(adminId)) {
        // Ya le dio like -> Quitar like
        newLikedBy = newLikedBy.filter(id => id !== adminId);
        newLikesCount = increment(-1);
        likeBtn?.classList.remove('active');
    } else {
        // No le ha dado like -> Añadir like
        newLikedBy.push(adminId);
        newLikesCount = increment(1);
        likeBtn?.classList.add('active');
    }

    // Actualización visual optimista (asume que funcionará)
    const span = likeBtn.querySelector('span');
    const currentLikes = parseInt(span.textContent) || 0;
    span.textContent = currentLikes + (newLikedBy.includes(adminId) ? 1 : -1);

    try {
        await updateDoc(postRef, {
            likes: newLikesCount,
            likedBy: newLikedBy
        });
    } catch (error) {
        console.error("Error al actualizar like:", error);
        showToast("Erro ao dar like.", true);
        // Revertir el cambio visual en caso de error
        span.textContent = post.likes || 0;
        if (newLikedBy.includes(adminId)) likeBtn.classList.remove('active');
        else likeBtn.classList.add('active');
    }
}

async function loadCommentsForPost(postId) {
    const container = document.getElementById(`comments-for-${postId}`);
    container.innerHTML = `<p style="padding: 10px 0; text-align: center; color: var(--text-secondary);">Carregando comentários...</p>`;

    const commentsQuery = query(collection(db, 'communityPosts', postId, 'comments'), orderBy('createdAt', 'asc'));

    onSnapshot(commentsQuery, (snapshot) => {

            container.innerHTML = `<p style="padding: 10px 0; text-align: center; color: var(--text-secondary);">Nenhum comentário.</p>`;

        }

        container.innerHTML = snapshot.docs.map(doc => {

            const placeholder = `https://placehold.co/64x64/0f172a/FFFFFF?text=${(comment.adminName || 'A').charAt(0)}`;

            return `

        }).join('');

async function verifyCollectorInSystem(collectorIdToExclude = null) {
    const nameInput = document.getElementById('collector-name');
    const docInput = document.getElementById('collector-document');
    const phoneInput = document.getElementById('collector-phone');
    const whatsappInput = document.getElementById('collector-whatsapp');
    const resultsContainer = document.getElementById('collector-verification-results');

    const name = nameInput?.value.trim().toLowerCase();
    const documentNumber = docInput?.value.trim();
    const phone = phoneInput?.value.replace(/\D/g, ''); // Limpia no numéricos
    const whatsapp = whatsappInput?.value.replace(/\D/g, ''); // Limpia no numéricos

    // No buscar si los campos clave están vacíos
    if (!name && !documentNumber && !phone && !whatsapp) {
        resultsContainer.style.display = 'none';
        return;
    }

    resultsContainer.style.display = 'block';
    resultsContainer.innerHTML = `
        <div class="verification-card verification-loading">
            <i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i>
            <span>Verificando no sistema...</span>
        </div>`;
    lucide.createIcons({ nodes: resultsContainer.querySelectorAll('[data-lucide]') });

    try {
        // Firestore no soporta queries 'OR' complejas directamente.
        // Haremos varias queries pequeñas y uniremos los resultados.
        let potentialConflicts = [];
        const checkedIds = new Set(); // Para evitar duplicados si coinciden varios campos

        // Query por Nombre (más genérica, puede traer falsos positivos)
        // Se podría hacer más específica si es necesario
        if (name) {
            // No podemos hacer query por 'includes', así que traemos todos y filtramos
            // En una app real, esto sería ineficiente y necesitaría un backend o Algolia/Elasticsearch
        }

        // Query por Número de Documento (si existe)
        if (documentNumber) {
            const docQuery = query(collection(db, "collectors"), where("documentNumber", "==", documentNumber));
            const docSnapshot = await getDocs(docQuery);
            docSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'documentNumber', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Query por Teléfono (si existe)
        if (phone) {
            const phoneQuery = query(collection(db, "collectors"), where("phone", "==", phone));
            const phoneSnapshot = await getDocs(phoneQuery);
            phoneSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'phone', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Query por WhatsApp (si existe)
        if (whatsapp) {
            const whatsappQuery = query(collection(db, "collectors"), where("whatsapp", "==", whatsapp));
            const whatsappSnapshot = await getDocs(whatsappQuery);
            whatsappSnapshot.forEach(doc => {
                if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                    const reports = doc.data().reports;
                    const hasReports = Array.isArray(reports) && reports.length > 0;
                    const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                    potentialConflicts.push({ 
                        id: doc.id, 
                        data: doc.data(), 
                        matchedField: 'whatsapp', // Mantén el campo original aquí
                        hasReports: hasReports,
                        lastReportReason: lastReport ? lastReport.reason : null 
                    });
                    checkedIds.add(doc.id);
                }
            });
        }

        // Simulación de búsqueda por nombre (Filtrado manual, ineficiente para muchos datos)
        if (name) {
            const allCollectorsSnapshot = await getDocs(collection(db, "collectors"));
            allCollectorsSnapshot.forEach(doc => {
                const collectorData = doc.data();
                if (collectorData.name && collectorData.name.toLowerCase().includes(name)) {
                    if (doc.id !== collectorIdToExclude && !checkedIds.has(doc.id)) {
                        const reports = doc.data().reports;
                        const hasReports = Array.isArray(reports) && reports.length > 0;
                        const lastReport = hasReports ? reports[reports.length - 1] : null; // Obtiene el último reporte
                        potentialConflicts.push({ 
                            id: doc.id, 
                            data: doc.data(), 
                            matchedField: '...', // Mantén el campo original aquí
                            hasReports: hasReports,
                            lastReportReason: lastReport ? lastReport.reason : null 
                        });
                         checkedIds.add(doc.id);
                    }
                }
            });
        }


        renderCollectorVerificationResults(potentialConflicts);

    } catch (error) {
        console.error("Erro ao verificar cobrador:", error);
        resultsContainer.innerHTML = `<div class="verification-card verification-conflict">Erro ao verificar. Tente novamente.</div>`;
    }
}

function renderCollectorVerificationResults(conflicts) {
    const resultsContainer = document.getElementById('collector-verification-results');
    if (!resultsContainer) return;

    if (conflicts.length === 0) {
        resultsContainer.innerHTML = `
            <div class="verification-card verification-clean">
                <i data-lucide="check-circle" style="width: 32px; height: 32px; margin-bottom: 8px;"></i>
                <p style="font-weight: 600; margin: 0;">Cobrador Limpo</p>
                <p style="color: var(--text-secondary); font-size: 0.9em; margin: 5px 0 0;">Nenhuma coincidência encontrada no sistema.</p>
            </div>`;
    } else {
        const conflictsListHtml = conflicts.map(conflict =>
            `<li>
    <strong>${conflict.data.name || 'Nome não disponível'} (${conflict.id})</strong> - Coincidência: <strong>${conflict.matchedField}</strong>.
    ${conflict.hasReports ? `<span class="report-reason">(Reportado: ${conflict.lastReportReason || 'Motivo não especificado'})</span>` : ''}
    </li>`
        ).join('');

        const hasAnyReported = conflicts.some(c => c.hasReports);

        resultsContainer.innerHTML = `
            <div class="verification-card verification-conflict ${hasAnyReported ? 'reported' : ''}">
                <div class="conflict-title">
                    <i data-lucide="alert-triangle"></i>
                    <span>Atenção: Possíveis Coincidências Encontradas!</span>
                </div>
                <p style="color: var(--text-secondary); font-size: 0.9em; margin-bottom: 15px;">Verifique os seguintes registros antes de continuar. Podem indicar um cobrador duplicado ou já existente:</p>
                <ul>
                    ${conflictsListHtml}
                </ul>
                <p style="color: var(--text-secondary); font-size: 0.8em; margin-top: 15px;"><i>Recomendamos confirmar a identidade antes de salvar.</i></p>
            </div>`;
    }
    lucide.createIcons({ nodes: resultsContainer.querySelectorAll('[data-lucide]') });
}
