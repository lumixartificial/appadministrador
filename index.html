            if (!dateEndInput.value) dateEndInput.value = today.toISOString().split('T')[0];
            // -----------------------------------------------------------

            resultsContainer.innerHTML = `<div class="loading" style="padding: 80px; text-align: center;"><i data-lucide="aperture" style="animation: spin 3s linear infinite; width: 60px; height: 60px; color: #00f2ff;"></i><p style="margin-top:20px; color: #00f2ff; font-family: monospace; letter-spacing: 3px; font-size: 1.2em;">${t.calculatingFlow}</p></div>`;
            lucide.createIcons({nodes: resultsContainer.querySelectorAll('[data-lucide]')});
            generateBtn.disabled = true;

            const selectedCollectorId = collectorFilter.value;
            
            // Corrección de fechas para cubrir todo el día (00:00 a 23:59)
            const startParts = dateStartInput.value.split('-');
            const endParts = dateEndInput.value.split('-');
            
            const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2], 0, 0, 0, 0);
            const endDate = new Date(endParts[0], endParts[1] - 1, endParts[2], 23, 59, 59, 999);

            // 2. Filtrado de Datos (Modo "Tiempo Real" Aggresivo)
            const filteredPayments = [];
            const filteredNewLoans = [];
            let valInitial = 0;

            // A. Capital Inicial
            allCollectors.forEach(c => {
                if (selectedCollectorId === 'all' || c.id === selectedCollectorId) {
                    const initCap = (c.startingCapitalOnHand !== undefined) ? Number(c.startingCapitalOnHand) : (Number(c.startingCapital) || 0);
                    valInitial += initCap;
                }
            });

            // B. Clientes (Pagos y Préstamos)
            allClients.forEach(client => {
                if (selectedCollectorId === 'all' || client.collectorId === selectedCollectorId) {
                    (client.loans || []).forEach((loan) => {
                        // Pagos
                        (loan.history || []).forEach(h => {
                            if (h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                                let pd = new Date(); 
                                if (h.date && h.date.seconds) {
                                    pd = new Date(h.date.seconds * 1000);
                                }
                                if (pd >= startDate && pd <= endDate) {
                                    filteredPayments.push({ ...h, clientName: client.name });
                                }
                            }
                        });
                        
                        // Préstamos Nuevos
                        let ld = new Date();
                        const hasValidDate = loan.startDate && loan.startDate.seconds;
                        if (hasValidDate) {
                            ld = new Date(loan.startDate.seconds * 1000);
                        }
                        
                        if ((hasValidDate || !loan.migrationDate) && ld >= startDate && ld <= endDate && !loan.migrationDate) {
                            filteredNewLoans.push({ ...loan, clientName: client.name });
                        }
                    });
                }
            });

            // C. Gastos
            const filteredExpenses = allExpenses.filter(e => {
                if (selectedCollectorId !== 'all' && e.collectorId !== selectedCollectorId) return false;
                
                let d = new Date(); 
                if (e.date && e.date.seconds) {
                    d = new Date(e.date.seconds * 1000);
                }
                
                return d >= startDate && d <= endDate;
            });

            // D. Aportes
            const filteredInjections = allCapitalInjections.filter(i => {
                if (selectedCollectorId !== 'all' && i.collectorId !== selectedCollectorId) return false;
                if (i.status !== 'approved') return false;
                
                let d = new Date();
                if (i.date && i.date.seconds) {
                    d = new Date(i.date.seconds * 1000);
                }
                return d >= startDate && d <= endDate;
            });

            // E. Retiros
            const filteredSettlements = allSettlements.filter(s => {
                if (selectedCollectorId !== 'all' && s.collectorId !== selectedCollectorId) return false;
                if (s.status === 'rejected') return false;
                
                let d = new Date();
                if (s.date && s.date.seconds) {
                    d = new Date(s.date.seconds * 1000);
                }
                return d >= startDate && d <= endDate;
            });

            // 3. Cálculos
            const valCollected = filteredPayments.reduce((s, i) => s + (Number(i.amount)||0), 0);
            const valInjected = filteredInjections.reduce((s, i) => s + (Number(i.amount)||0), 0);
            const valDeployed = filteredNewLoans.reduce((s, l) => {
                let principal = Number(l.principalAmount);
                if (!principal && l.totalLoan) {
                     principal = Number(l.totalLoan) / 1.2; 
                }
                return s + (principal || 0);
            }, 0);
            const valSettled = filteredSettlements.reduce((s, i) => s + (Number(i.amount)||0), 0);

            const expensesByCategory = {};
            let valExpensesTotal = 0;
            filteredExpenses.forEach(e => {
                const cat = e.category || 'other';
                const val = Number(e.value) || 0;
                expensesByCategory[cat] = (expensesByCategory[cat] || 0) + val;
                valExpensesTotal += val;
            });

            const valInflows = valCollected + valInjected;
            const totalInflow = valInitial + valInflows;
            const totalOutflow = valExpensesTotal + valDeployed + valSettled;
            const netBalance = totalInflow - totalOutflow;

            // 4. Preparar Datos Gráfico
            const chartLabels = [];
            const chartData = [];
            const chartColors = [];
            
            const neonColors = {
                'initial': '#94a3b8', 'inflows': '#00ff9d', 'salary': '#facc15', 'fuel': '#f97316', 'rent': '#ec4899',
                'mechanics': '#ef4444', 'food': '#8b5cf6', 'other': '#64748b', 'loans': '#00f2ff',
                'settlements': '#a855f7', 'balance': '#3b82f6'
            };

            if (valInitial > 0) { chartLabels.push(t.initialCapitalLabel.toUpperCase()); chartData.push(valInitial); chartColors.push(neonColors['initial']); }
            if (valInflows > 0) { chartLabels.push(t.inflowLabel.toUpperCase()); chartData.push(valInflows); chartColors.push(neonColors['inflows']); }
            Object.keys(expensesByCategory).forEach(cat => {
                if (expensesByCategory[cat] > 0) {
                    chartLabels.push((t[cat] || cat).toUpperCase());
                    chartData.push(expensesByCategory[cat]);
                    chartColors.push(neonColors[cat] || '#ffffff');
                }
            });
            if (valDeployed > 0) { chartLabels.push(t.newLoans.toUpperCase()); chartData.push(valDeployed); chartColors.push(neonColors['loans']); }
            if (valSettled > 0) { chartLabels.push(t.settlements.toUpperCase()); chartData.push(valSettled); chartColors.push(neonColors['settlements']); }
            if (netBalance > 0) { chartLabels.push(t.cashBalance.toUpperCase()); chartData.push(netBalance); chartColors.push(neonColors['balance']); }

            if (chartData.length === 0) { chartLabels.push(t.noData); chartData.push(1); chartColors.push('#1e293b'); }

            // 5. Diagnóstico
            let diagColor = netBalance >= 0 ? "#00ff9d" : "#ff0055";
            let diagTitle = netBalance >= 0 ? t.diagProfitTitle : t.diagDeficitTitle;
            let balanceText = netBalance >= 0 ? t.netBalancePos : t.netBalanceNeg;
            let balanceValueColor = netBalance >= 0 ? "#00ff9d" : "#ff0055"; 

            let diagMsg = "";
            if (netBalance >= 0) {
                diagMsg = t.diagProfitMsg;
            } else {
                 if (valDeployed > valCollected) {
                    diagTitle = t.diagExpansionTitle;
                    diagMsg = t.diagExpansionMsg;
                    diagColor = "#bd00ff";
                 } else if (valExpensesTotal > (valCollected * 0.4)) {
                    diagTitle = t.diagAlertTitle;
                    diagMsg = t.diagAlertMsg;
                    diagColor = "#ff0055";
                 } else {
                    diagTitle = t.diagDeficitTitle;
                    diagMsg = t.diagDeficitMsg;
                    diagColor = "#ffae00";
                 }
            }

            let maxExpenseEntry = Object.entries(expensesByCategory).sort((a,b) => b[1]-a[1])[0];
            let maxExpenseMsg = maxExpenseEntry && maxExpenseEntry[1] > 0 
                ? `${t.maxExpenseLabel} ${(t[maxExpenseEntry[0]] || maxExpenseEntry[0]).toUpperCase()} (${money(maxExpenseEntry[1])})` 
                : t.noSignificantExpense;

            // 6. Construcción HTML
            resultsContainer.innerHTML = `
                <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                    <button id="download-graphic-pdf-btn" class="btn-secondary" style="background-color: var(--surface); color: var(--accent-blue); border-color: var(--accent-blue); padding: 8px 16px; font-size: 0.9em; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="file-down"></i> ${t.downloadGraphicPDF}
                    </button>
                </div>

                <div style="
                    background: linear-gradient(135deg, #020617 0%, #0f172a 100%); 
                    border: 1px solid #1e293b; 
                    border-radius: 24px; 
                    padding: 30px; 
                    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 40px;
                    position: relative;
                    overflow: hidden;
                ">
                    <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: ${diagColor}; filter: blur(150px); opacity: 0.15; pointer-events: none;"></div>

                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
                        <div style="margin-bottom: 20px; color: #64748b; font-size: 0.8em; letter-spacing: 2px; font-weight: 700; text-align: center; width: 100%;">
                            ${t.distributionTitle}
                        </div>

                        <div style="position: relative; height: 320px; width: 320px;">
                            <canvas id="ultra-chart"></canvas>
                            <div style="
                                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                                text-align: center; width: 165px; height: 165px; border-radius: 50%;
                                display: flex; flex-direction: column; justify-content: center;
                                background: radial-gradient(circle, rgba(2,6,23,0.95) 0%, rgba(15,23,42,0.9) 100%);
                                border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(0,0,0,0.5);
                                pointer-events: none; z-index: 5;
                            ">
                                <p style="font-size: 0.65em; color: #94a3b8; margin: 0; letter-spacing: 1px;">${t.capitalGiro}</p>
                                <p style="font-size: 1.05em; color: #fff; font-weight: 700; margin: 2px 0;">${money(totalInflow)}</p>
                                <div style="width: 80%; height: 1px; background: #334155; margin: 6px auto;"></div>
                                <p style="font-size: 0.65em; color: #94a3b8; margin: 0; letter-spacing: 1px;">${t.totalOutflow}</p>
                                <p style="font-size: 1.05em; color: #ef4444; font-weight: 700; margin: 2px 0;">-${money(totalOutflow)}</p>
                                 <div style="margin-top: 8px; padding: 4px 10px; background: ${diagColor}20; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 1px solid ${diagColor}40;">
                                    <span style="font-size: 0.55em; font-weight: 700; color: ${diagColor}; margin-bottom: 1px; letter-spacing: 0.5px;">${t.chartCenterBalance}</span>
                                    <span style="color: ${diagColor}; font-size: 0.95em; font-weight: 800;">${netBalance >= 0 ? '+' : ''}${money(netBalance)}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; justify-content: center; gap: 20px;">
                        <div style="background: rgba(255,255,255,0.03); border-left: 4px solid ${diagColor}; padding: 20px; border-radius: 0 12px 12px 0;">
                            <h3 style="margin: 0 0 5px; color: ${diagColor}; font-size: 1.2em; text-shadow: 0 0 10px ${diagColor}40;">${diagTitle}</h3>
                            <p style="margin: 0; color: #cbd5e1; font-size: 0.95em;">${diagMsg}</p>
                            <p style="margin: 10px 0 0; color: #94a3b8; font-size: 0.85em; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">${maxExpenseMsg}</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding-right: 10px;">
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; padding: 8px 12px; background: ${balanceValueColor}10; border-radius: 8px; border: 1px solid ${balanceValueColor}30;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 12px; height: 12px; background: ${balanceValueColor}; border-radius: 3px; box-shadow: 0 0 8px ${balanceValueColor};"></div>
                                    <span style="color: #fff; font-weight: 700;">${balanceText}</span>
                                </div>
                                <span style="color: ${balanceValueColor}; font-weight: 700; font-family: monospace;">${money(netBalance)}</span>
                            </div>

                            ${chartLabels.map((label, i) => {
                                if (label === t.noData || label === t.cashBalance.toUpperCase()) return '';
                                const val = chartData[i];
                                const percent = totalInflow > 0 ? Math.round((val / totalInflow) * 100) : 0;
                                return `
                                <div style="padding: 0 5px;">
                                    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; margin-bottom: 4px;">
                                        <div style="display: flex; align-items: center; gap: 12px;">
                                            <div style="width: 12px; height: 12px; background: ${chartColors[i]}; border-radius: 3px; box-shadow: 0 0 8px ${chartColors[i]};"></div>
                                            <span style="color: #94a3b8; font-weight: 500;">${label}</span>
                                        </div>
                                        <div style="text-align: right;">
                                            <span style="color: #fff; font-weight: 700; font-family: monospace;">${money(val)}</span>
                                            <span style="color: #64748b; font-size: 0.85em; margin-left: 5px;">(${percent}%)</span>
                                        </div>
                                    </div>
                                    <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px;">
                                        <div style="width: ${percent}%; height: 100%; background: ${chartColors[i]}; border-radius: 2px;"></div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <details class="kpi-card" style="background: var(--surface); border: 1px solid var(--border-color);">
                        <summary style="cursor: pointer; font-weight: 600; color: var(--text-secondary); padding: 15px; display: flex; align-items: center; gap: 10px;">
                            <i data-lucide="list"></i> ${t.viewFullList}
                        </summary>
                        <div id="report-details-lists" style="margin-top: 0; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 10px;">
                             ${valInitial > 0 ? `<div class="payment-history-item" style="padding: 10px; background-color: var(--bg); border: 1px dashed var(--text-secondary);"><span style="font-weight: 600;">${t.initialCapitalLabel}</span><span style="font-weight: 700; color: var(--text-primary);">${money(valInitial)}</span></div>` : ''}
                             ${generateDetailListHTML(t.inflowLabel, 'arrow-up-circle', '#00ff9d', [...filteredPayments, ...filteredInjections], (item) => `<span>${item.clientName || 'Aporte'}</span><span style="color:var(--accent-green); font-weight:700;">${money(item.amount)}</span>`)}
                             ${generateDetailListHTML(t.outflowLoansLabel, 'briefcase', '#00f2ff', filteredNewLoans, (l) => `<span>${l.clientName}</span><span style="color:#3b82f6; font-weight:700;">${money(l.principalAmount || l.totalLoan/1.2)}</span>`)}
                             ${generateDetailListHTML(t.outflowExpensesLabel, 'shopping-cart', '#ff0055', filteredExpenses, (e) => `<span>${t[e.category]||e.category} ${(!e.date || !e.date.seconds) ? '(Pendente)' : ''}</span><span style="color:var(--danger-color); font-weight:700;">${money(e.value)}</span>`)}
                             ${generateDetailListHTML(t.outflowSettlementsLabel, 'archive', '#a855f7', filteredSettlements, (s) => `<span>${t.withdrawal}</span><span style="color:#a855f7; font-weight:700;">${money(s.amount)}</span>`)}
                        </div>
                    </details>
                </div>
            `;

            const ctx = document.getElementById('ultra-chart').getContext('2d');
            
            if (reportChartInstance) {
                reportChartInstance.destroy();
                reportChartInstance = null;
            }

            const externalTooltipHandler = (context) => {
                const {chart, tooltip} = context;
                let tooltipEl = document.getElementById('chartjs-tooltip');

                if (!tooltipEl) {
                    tooltipEl = document.createElement('div');
                    tooltipEl.id = 'chartjs-tooltip';
                    tooltipEl.style.background = 'rgba(2, 6, 23, 0.98)';
                    tooltipEl.style.borderRadius = '8px';
                    tooltipEl.style.color = 'white';
                    tooltipEl.style.opacity = 1;
                    tooltipEl.style.pointerEvents = 'none';
                    tooltipEl.style.position = 'absolute';
                    tooltipEl.style.transition = 'all .1s ease';
                    tooltipEl.style.border = '1px solid rgba(255,255,255,0.2)';
                    tooltipEl.style.boxShadow = '0 4px 20px rgba(0,0,0,0.5)';
                    tooltipEl.style.zIndex = '1000';
                    tooltipEl.style.padding = '10px';
                    tooltipEl.style.fontFamily = 'monospace';
                    const table = document.createElement('table');
                    table.style.margin = '0px';
                    tooltipEl.appendChild(table);
                    document.body.appendChild(tooltipEl);
                }

                if (tooltip.opacity === 0) {
                    tooltipEl.style.opacity = 0;
                    return;
                }

                if (tooltip.body) {
                    const bodyLines = tooltip.body.map(b => b.lines);
                    const tableBody = document.createElement('tbody');
                    bodyLines.forEach((body, i) => {
                        const colors = tooltip.labelColors[i];
                        const span = document.createElement('span');
                        span.style.background = colors.backgroundColor;
                        span.style.borderColor = colors.borderColor;
                        span.style.borderWidth = '2px';
                        span.style.marginRight = '10px';
                        span.style.height = '10px';
                        span.style.width = '10px';
                        span.style.display = 'inline-block';
                        span.style.borderRadius = '2px';

                        const tr = document.createElement('tr');
                        const td = document.createElement('td');
                        const text = body[0]; 
                        const parts = text.split(':');
                        const label = parts[0];
                        const val = parts.slice(1).join(':');

                        td.innerHTML = '';
                        td.appendChild(span);
                        td.appendChild(document.createTextNode(label));
                        const valSpan = document.createElement('span');
                        valSpan.innerText = val;
                        valSpan.style.fontWeight = 'bold';
                        valSpan.style.marginLeft = '8px';
                        valSpan.style.color = colors.backgroundColor;
                        td.appendChild(valSpan);
                        tr.appendChild(td);
                        tableBody.appendChild(tr);
                    });
                    const tableRoot = tooltipEl.querySelector('table');
                    while (tableRoot.firstChild) { tableRoot.firstChild.remove(); }
                    tableRoot.appendChild(tableBody);
                }

                const canvasRect = chart.canvas.getBoundingClientRect();
                const tooltipRect = tooltipEl.getBoundingClientRect();
                const windowWidth = window.innerWidth;
                
                let left = canvasRect.left + window.scrollX + tooltip.caretX;
                let top = canvasRect.top + window.scrollY + tooltip.caretY;

                left -= (tooltipRect.width / 2);
                if (left + tooltipRect.width > windowWidth - 10) left = windowWidth - tooltipRect.width - 10;
                if (left < 10) left = 10;

                top -= (tooltipRect.height + 15);
                if (top < window.scrollY + 60) top = canvasRect.top + window.scrollY + tooltip.caretY + 30;

                tooltipEl.style.opacity = 1;
                tooltipEl.style.left = left + 'px';
                tooltipEl.style.top = top + 'px';
            };

            reportChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: chartColors,
                        borderWidth: 0,
                        hoverOffset: 15,
                        borderRadius: 3,
                        spacing: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%', 
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: false, 
                            external: externalTooltipHandler, 
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ${money(context.raw)}`;
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1500,
                        easing: 'easeOutQuart'
                    }
                }
            });

            const downloadBtn = document.getElementById('download-graphic-pdf-btn');
            const newDownloadBtn = downloadBtn.cloneNode(true);
            downloadBtn.parentNode.replaceChild(newDownloadBtn, downloadBtn);
            
            if (newDownloadBtn) {
                newDownloadBtn.addEventListener('click', () => {
                    const collectorName = selectedCollectorId === 'all' 
                        ? t.all 
                        : allCollectors.find(c => c.id === selectedCollectorId)?.name || 'N/A';
                    
                    const reportPayload = {
                        period: { start: startDate, end: endDate },
                        collector: collectorName,
                        financials: {
                            initial: valInitial,
                            inflow: valInflows,
                            totalIn: totalInflow,
                            expenses: valExpensesTotal,
                            loans: valDeployed,
                            settlements: valSettled,
                            totalOut: totalOutflow,
                            balance: netBalance
                        },
                        breakdown: expensesByCategory
                    };
                    
                    exportFinancialAnalysisPDF(reportPayload);
                });
            }

            generateBtn.disabled = false;
            lucide.createIcons({nodes: resultsContainer.querySelectorAll('[data-lucide]')});
            applyLanguage(currentLang);
        }




        // Função auxiliar para gerar as listas detalhadas
        function generateDetailListHTML(title, icon, iconColor, items, renderItem) {
            if (items.length === 0) {
                return `
                <details class="kpi-card" style="cursor: default;">
                    <summary style="font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="${icon}" style="color: ${iconColor}; width: 18px; height: 18px;"></i>
                        ${title} (0)
                    </summary>
                    <div class="item-list" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        <p class="no-items">Nenhuma transação neste período.</p>
                    </div>
                </details>`;
            }

            return `
            <details class="kpi-card" style="cursor: pointer;">
                <summary style="font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="${icon}" style="color: ${iconColor}; width: 18px; height: 18px;"></i>
                    ${title} (${items.length})
                </summary>
                <div class="item-list" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                    ${items.map(item => `
                        <div class="payment-history-item" style="padding: 10px; cursor: default; background-color: var(--bg);">
                            <span style="font-size: 0.9em;">${renderItem(item)}</span>
                        </div>
                    `).join('')}
                </div>
            </details>`;
        }




        function showReportOptionsModal(collectorId) {
             const modal = document.getElementById('reportOptionsModal');
             modal.classList.add('active');
             
             // Usamos textos básicos si no hay traducción específica para el título
             const t = translations[currentLang];
             const title = t.selectPeriod || 'Selecione o Período';

             modal.innerHTML = `
                <div class="modal-content">
                    <button class="close-modal-btn" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; color: var(--text-secondary);">&times;</button>
                    <h3>${title}</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                        <button class="btn-secondary" data-report-period="24h">${t.last24h}</button>
                        <button class="btn-secondary" data-report-period="48h">${t.last48h}</button>
                        <button class="btn-secondary" data-report-period="week">${t.lastWeek}</button>
                        <button class="btn-secondary" data-report-period="month">${t.lastMonth}</button>
                    </div>
                </div>
             `;
             
             // Listener para cerrar
             modal.querySelector('.close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

             // Listeners para los botones de período
             modal.querySelectorAll('[data-report-period]').forEach(btn => {
                btn.addEventListener('click', () => {
                    // Llama a la función de reporte normal (de texto)
                    generatePDFReport(collectorId, btn.dataset.reportPeriod);
                    modal.classList.remove('active');
                });
             });
        }
        
        
        async function generatePDFReport(collectorId, period) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const lang = currentLang;
            const now = new Date();
            
            // --- 1. DEFINICIÓN DEL PERÍODO Y FILTROS ---
            const collector = allCollectors.find(c => c.id === collectorId);
            if (!collector) {
                showToast("Cobrador não encontrado.", true);
                return;
            }

            let startDate;
            let periodLabel = 'Período Completo';
            if (period === '24h') {
                startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                periodLabel = 'Últimas 24 Horas';
            } else if (period === '48h') {
                startDate = new Date(now.getTime() - 48 * 60 * 60 * 1000);
                periodLabel = 'Últimas 48 Horas';
            } else if (period === 'week') {
                startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                periodLabel = 'Última Semana';
            } else if (period === 'month') {
                startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000); 
                periodLabel = 'Últimos 30 Dias';
            }

            // --- 2. OBTENER CAPITAL TOTAL EM MÃOS (DATO ACTUAL) ---
            const collectorMetrics = calculatedCollectorMetrics.get(collectorId) || { capitalOnHand: 0 };
            const capitalOnHand = collectorMetrics.capitalOnHand; 

            // --- 3. RECOPILACIÓN DE DATOS FILTRADOS POR EL PERÍODO ---

            // A. Pagos Recibidos (Entradas)
            const periodPaymentsList = [];
            let periodTotalCash = 0;
            let periodTotalDigital = 0;

            // Filtramos clientes de ESTE cobrador
            const collectorClients = allClients.filter(c => c.collectorId === collectorId);

            collectorClients.forEach(client => {
                (client.loans || []).forEach((loan, loanIndex) => { 
                    (loan.history || []).forEach(h => {
                        // Filtro de validez y fecha
                        if (h.date?.seconds && h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                            const paymentDate = new Date(h.date.seconds * 1000);
                            
                            if (!startDate || paymentDate >= startDate) {
                                const amount = h.amount || 0;
                                periodPaymentsList.push({
                                    clientName: client.name,
                                    amount: amount,
                                    time: paymentDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                                    date: paymentDate.toLocaleDateString('pt-BR'),
                                    method: h.method || 'dinheiro',
                                    loanIndex: loanIndex + 1
                                });

                                if (h.method === 'dinheiro') periodTotalCash += amount;
                                else periodTotalDigital += amount;
                            }
                        }
                    });
                });
            });
            const periodTotalCollected = periodTotalCash + periodTotalDigital;
            periodPaymentsList.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime() || a.time.localeCompare(b.time));

            // B. Nuevos Préstamos / Refinanciamientos (Salidas de Capital) - ¡CRÍTICO!
            const periodNewLoans = [];
            collectorClients.forEach(client => {
                (client.loans || []).forEach((loan, index) => {
                    if (loan.startDate?.seconds) {
                        const loanDate = new Date(loan.startDate.seconds * 1000);
                        
                        // Si la fecha de inicio cae dentro del período seleccionado
                        if (!startDate || loanDate >= startDate) {
                            // Ignoramos migraciones antiguas
                            if (!loan.migrationDate) {
                                let principal = loan.principalAmount;
                                if (!principal && loan.totalLoan) {
                                     const rate = client.interestRate || 20;
                                     principal = loan.totalLoan / (1 + (rate/100));
                                }
                                
                                periodNewLoans.push({
                                    clientName: client.name,
                                    amount: principal || 0,
                                    time: loanDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                                    date: loanDate.toLocaleDateString('pt-BR'),
                                    loanIndex: index + 1
                                });
                            }
                        }
                    }
                });
            });
            const totalLoansOutflow = periodNewLoans.reduce((sum, l) => sum + l.amount, 0);
            periodNewLoans.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());

            // C. Gastos (Salidas)
            const periodExpenses = allExpenses.filter(e => {
                if (e.collectorId !== collectorId) return false;
                if (!e.date?.seconds) return false;
                const d = new Date(e.date.seconds * 1000);
                return !startDate || d >= startDate;
            });
            const totalExpenses = periodExpenses.reduce((sum, e) => sum + e.value, 0);
            periodExpenses.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

            // D. Liquidaciones (Salidas al Admin)
            const periodSettlements = allSettlements.filter(s => {
                if (s.collectorId !== collectorId) return false;
                if (!s.date?.seconds) return false;
                // Solo aprobadas o pendientes (normalmente aprobadas restan caja)
                if (s.status === 'rejected') return false; 
                const d = new Date(s.date.seconds * 1000);
                return !startDate || d >= startDate;
            });
            const totalSettlements = periodSettlements.reduce((sum, s) => sum + s.amount, 0);
            periodSettlements.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));
            
            // E. Aportes de Capital (Entradas del Admin)
            const periodInjections = allCapitalInjections.filter(i => {
                if (i.collectorId !== collectorId) return false;
                if (!i.date?.seconds) return false;
                if (i.status !== 'approved') return false;
                const d = new Date(i.date.seconds * 1000);
                return !startDate || d >= startDate;
            });
            const totalInjections = periodInjections.reduce((sum, i) => sum + i.amount, 0);
            periodInjections.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

            // F. CÁLCULO FINAL DE FLUJO DE CAJA (NET BALANCE DEL PERÍODO)
            // Neto = (Entradas: Pagos + Aportes) - (Salidas: Gastos + Liquidaciones + Nuevos Préstamos)
            const netBalance = (periodTotalCollected + totalInjections) - (totalExpenses + totalSettlements + totalLoansOutflow);

            // Verificación si no hay nada que reportar
            if (periodTotalCollected === 0 && totalExpenses === 0 && totalSettlements === 0 && totalInjections === 0 && totalLoansOutflow === 0) {
                showToast("Nenhuma atividade registrada neste período.", true);
                return;
            }

            // --- 4. GENERAR PDF ---
            const pageMargin = 15;
            const pageWidth = doc.internal.pageSize.getWidth();
            const center = pageWidth / 2;
            let y = 0;

            // A. Encabezado
            y = 25;
            doc.setFontSize(16);
            doc.setFont(undefined, 'bold');
            doc.text(currentCompanyData?.name || 'Relatório de Cobrança', center, y, { align: 'center' });
            y += 7;
            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(100);
            doc.text(`Relatório do Cobrador - ${periodLabel}`, center, y, { align: 'center' });

            // B. Información del Cobrador
            y += 15;
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('COBRADOR:', pageMargin, y);
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.setFont(undefined, 'bold');
            doc.text(collector.name || 'N/A', pageMargin + 25, y); 

            // C. Resumen Contábil
            y += 15;
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text('Resumo Contábil do Período', pageMargin, y);
            y += 5;
            doc.setLineWidth(0.5);
            doc.setDrawColor(200);
            doc.line(pageMargin, y, pageWidth - pageMargin, y);

            const addSummaryLine = (label, value, color = '#000000') => {
                y += 8;
                doc.setFontSize(11);
                doc.setFont(undefined, 'normal');
                doc.setTextColor(100);
                doc.text(label, pageMargin + 5, y);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(color);
                doc.text(money(value), pageWidth - pageMargin - 5, y, { align: 'right' });
            };

            addSummaryLine(`(+) Total Recebido:`, periodTotalCollected, '#28a745');
            addSummaryLine(`    ... em Dinheiro:`, periodTotalCash, '#6c757d');
            addSummaryLine(`    ... em Digital/Recibo:`, periodTotalDigital, '#6c757d');
            addSummaryLine(`(+) Aportes de Capital:`, totalInjections, '#28a745');
            
            // Nuevas líneas de salida
            addSummaryLine(`(-) Empréstimos Realizados:`, totalLoansOutflow, '#dc3545'); 
            addSummaryLine(`(-) Gastos Totais:`, totalExpenses, '#dc3545');
            addSummaryLine(`(-) Liquidações Enviadas:`, totalSettlements, '#dc3545');

            y += 3;
            doc.setLineWidth(0.2);
            doc.line(pageMargin + 5, y, pageWidth - pageMargin - 5, y); 
            
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(netBalance >= 0 ? '#6f42c1' : '#dc3545');
            doc.text('SALDO LÍQUIDO DO PERÍODO:', pageMargin + 5, y + 8);
            doc.text(money(netBalance), pageWidth - pageMargin - 5, y + 8, { align: 'right' });
            
            y += 8; // Espacio extra
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(capitalOnHand >= 0 ? '#000000' : '#dc3545');
            doc.text('CAPITAL TOTAL EM MÃOS (Atual):', pageMargin + 5, y + 8);
            doc.text(money(capitalOnHand), pageWidth - pageMargin - 5, y + 8, { align: 'right' });

            y += 20;

            // D. Secciones de Detalles (con paginación inteligente)
            const checkPageBreak = () => {
                if (y > 270) { 
                    doc.addPage();
                    y = 20;
                }
            };

            const addSectionHeader = (title) => {
                checkPageBreak();
                y += 5;
                doc.setFontSize(14);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(0);
                doc.text(title, pageMargin, y);
                y += 5;
                doc.setLineWidth(0.5);
                doc.setDrawColor(200);
                doc.line(pageMargin, y, pageWidth - pageMargin, y);
                y += 8;
            };

            const addTableHeaders = (headers) => {
                 doc.setFontSize(9);
                 doc.setTextColor(100);
                 headers.forEach(header => {
                     doc.text(header.label, header.x, y, { align: header.align || 'left' });
                 });
                 y += 5;
            };

            // D.1. Pagos Recibidos
            if (periodPaymentsList.length > 0) {
                addSectionHeader('Detalhe dos Pagamentos Recebidos');
                addTableHeaders([
                    { label: 'Data/Hora', x: pageMargin + 5 },
                    { label: 'Cliente (Empréstimo)', x: pageMargin + 40 },
                    { label: 'Método', x: pageMargin + 130 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                
                periodPaymentsList.forEach(p => {
                    checkPageBreak();
                    doc.setFontSize(10);
                    doc.setTextColor(0);
                    doc.text(`${p.date} ${p.time}`, pageMargin + 5, y);
                    doc.text(doc.splitTextToSize(`${p.clientName} (E ${p.loanIndex})`, 80), pageMargin + 40, y);
                    doc.text(p.method, pageMargin + 130, y);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor('#28a745');
                    doc.text(money(p.amount), pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }

            // D.2. Nuevos Préstamos (Salidas)
            if (periodNewLoans.length > 0) {
                addSectionHeader('Detalhe dos Empréstimos Realizados (Saídas)');
                addTableHeaders([
                    { label: 'Data/Hora', x: pageMargin + 5 },
                    { label: 'Cliente (Novo Empréstimo)', x: pageMargin + 40 },
                    { label: 'Tipo', x: pageMargin + 130 },
                    { label: 'Valor Entregue', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                
                periodNewLoans.forEach(l => {
                    checkPageBreak();
                    doc.setFontSize(10);
                    doc.setTextColor(0);
                    doc.text(`${l.date} ${l.time}`, pageMargin + 5, y);
                    doc.text(doc.splitTextToSize(`${l.clientName} (E ${l.loanIndex})`, 80), pageMargin + 40, y);
                    doc.text("Novo / Refin.", pageMargin + 130, y);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor('#dc3545'); // Rojo para salidas
                    doc.text(`-${money(l.amount)}`, pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }

            // D.3. Gastos
            if (periodExpenses.length > 0) {
                addSectionHeader('Detalhe dos Gastos');
                addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Categoria', x: pageMargin + 40 },
                    { label: 'Obs.', x: pageMargin + 80 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);

                periodExpenses.forEach(e => {
                    checkPageBreak();
                    const date = new Date(e.date.seconds * 1000).toLocaleDateString('pt-BR');
                    const category = translations[lang][e.category] || e.category;
                    doc.setFontSize(10);
                    doc.setTextColor(0);
                    doc.text(date, pageMargin + 5, y);
                    doc.text(category, pageMargin + 40, y);
                    doc.text(doc.splitTextToSize(e.observations || '-', 50), pageMargin + 80, y);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor('#dc3545');
                    doc.text(`-${money(e.value)}`, pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }

            // D.4. Liquidaciones
            if (periodSettlements.length > 0) {
                addSectionHeader('Detalhe das Liquidações Enviadas');
                addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Status', x: pageMargin + 70 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);

                periodSettlements.forEach(s => {
                    checkPageBreak();
                    const date = new Date(s.date.seconds * 1000).toLocaleDateString('pt-BR');
                    doc.setFontSize(10);
                    doc.setTextColor(0);
                    doc.text(date, pageMargin + 5, y);
                    doc.text(s.status || 'Pendente', pageMargin + 70, y);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor('#dc3545');
                    doc.text(`-${money(s.amount)}`, pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }
            
            // D.5. Aportes de Capital
            if (periodInjections.length > 0) {
                addSectionHeader('Detalhe dos Aportes de Capital Recebidos');
                 addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Status', x: pageMargin + 70 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }

                periodInjections.forEach(i => {

        // --- [INICIO MODIFICACIÓN: FUNCIÓN DE AYUDA PARA FECHAS] ---
        /**
         * Formatea un timestamp de Firebase (u otros formatos) a una fecha simple (DD/MM/YYYY)
         */
        function formatSimpleDate(timestamp) {
            let date;

            // 1. Manejar nulo o indefinido
            if (!timestamp) return '--';

            // 2. Manejar formato Timestamp de Firebase (ej: { seconds: ..., nanoseconds: ... })
            if (timestamp.seconds && typeof timestamp.toDate === 'function') {
                date = timestamp.toDate();
            
            // 3. Manejar si ya es un objeto Date de JavaScript
            } else if (timestamp instanceof Date) {
                date = timestamp;
            
            // 4. Manejar si es un string (ej: "2025-11-01T10:00:00Z")
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            
            // 5. Si no es ninguno de los anteriores, no sabemos qué es
            } else {
                console.warn("Formato de data desconhecido:", timestamp);
                return '--';
            }

            // 6. Validar que la fecha resultante sea válida
            if (isNaN(date.getTime())) {
                console.error("Data inválida após conversão:", timestamp);
                return 'Data Inválida';
            }
            
            // 7. Formatear la fecha válida
            try {
                return date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (e) {
                console.error("Error al formatear data:", e);
                return 'Erro Formato';
            }
        }

            const activeOrLastFinishedLoans = displayableLoans.length > 0 ? displayableLoans : (client.loans && client.loans.length > 0 ? [client.loans[client.loans.length - 1]] : []);
            
            const currentLoanIndex = (loanIndex >= 0 && client.loans && loanIndex < client.loans.length && (client.loans[loanIndex].status !== 'finished' || activeOrLastFinishedLoans.some(l => client.loans[loanIndex] === l)))

    switch(payment.status) {

        case 'postponed': statusText = 'Adiado'; statusClass = 'status-paid'; break;

    }

    const canDelete = (payment.status === 'approved' || (!payment.status && payment.date));

            </button>
        </div>
    `;

    history.pushState({ modal: 'paymentDetailModal' }, 'Payment Details', '#payment-detail');
    modal.classList.add('active');
    
    try {
        lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });
    } catch (iconError) {
        console.warn("Lucide icons failed to render in paymentDetailModal:", iconError);
    }
    // --- [FIN DE LA CORRECCIÓN 2/2] ---

    // --- Listeners del Modal ---
    modal.querySelector('#closePaymentDetailModal').addEventListener('click', () => window.history.back());


    const deleteBtn = modal.querySelector('#delete-payment-btn');
    if (canDelete) {
        deleteBtn.addEventListener('click', async () => {
            
            // --- (CORRECCIÓN INICIO) 2. Muestra la confirmación ANTES de hacer nada ---
            const confirmed = await showConfirmationModal(
                'Confirmar Exclusão',
                'Você está prestes a excluir este pagamento. Esta ação é IRREVERSÍVEL e irá reverter a contabilidade (o saldo do cliente e o capital do cobrador serão recalculados). Deseja continuar?',
                'Sim, Excluir Pagamento',
                'btn-danger'
            );

            if (!confirmed) return; // Si el admin cancela, no hacemos nada.
            // --- (CORRECCIÓN FIN) 2. ---

            // Mostrar estado de carga en el botón
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Excluindo...`;
            lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });

            try {
                const clientRef = doc(db, 'companies', currentCompanyId, "clients", clientId);
                
                // --- (CORRECCIÓN INICIO) 3. Busca el cliente FRESCO OTRA VEZ ---
                //    Esto garantiza que estamos editando los datos más actuales de 'allClients'.
                const latestClientData = allClients.find(c => c.id === clientId);
                if (!latestClientData) throw new Error("Cliente desapareceu durante a operação.");

                // 4. Hacemos la copia profunda de los datos FRESCOS.
                const updatedLoans = JSON.parse(JSON.stringify(latestClientData.loans));
                // --- (CORRECCIÓN FIN) 3 y 4 ---

                const loanToUpdate = updatedLoans[loanIndex];

                if (!loanToUpdate || !loanToUpdate.history || !loanToUpdate.history[historyIndex]) {
                    throw new Error("Referência de pagamento inválida ao tentar excluir.");
                }

                // Elimina el pago del array de historial
                const deletedPayment = loanToUpdate.history.splice(historyIndex, 1);
                console.log("Pagamento excluído do array local:", deletedPayment);

                // Actualiza el documento del cliente en Firestore
                await updateDoc(clientRef, {
                    loans: updatedLoans
                });

                showToast('Pagamento excluído com sucesso! A contabilidade será recalculada.', false);

                window.history.back(); 
                
                // Forzamos el recálculo global (esto revertirá la contabilidad)
                checkAndRunGlobalUpdate();
                
                // Refrescamos la vista de detalles del cliente si sigue abierta
                if (document.getElementById('clientDetailModal').classList.contains('active')) {
                     showClientDetails(clientId, loanIndex);
                }

            } catch (error) {
                console.error("Erro ao excluir pagamento:", error);
                showToast(`Falha ao excluir pagamento: ${error.message}`, true);
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = `<i data-lucide="trash-2"></i> Excluir Pagamento`;
                lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });
            }
        });
    }
}

function updateAdminNotificationsView() {
    const container = document.getElementById('admin-notifications-list');
    const badge = document.getElementById('admin-notification-badge');
    if (!badge) return; 

    let notifications = [];

    // 1. Buscar Pagos Pendientes de Verificación
    allClients.forEach(client => {
        (client.loans || []).forEach((loan, loanIndex) => {
            (loan.history || []).forEach((payment, historyIndex) => {
                if (payment && payment.status === 'pending_verification') {
                    notifications.push({
                        type: 'payment',
                        date: payment.date,
                        clientId: client.id,
                        clientName: client.name,
                        profilePictureUrl: client.profilePictureUrl,
                        amount: payment.amount,
                        loanIndex: loanIndex,
                        historyIndex: historyIndex,
                        textKey: 'paymentVerification'
                    });
                }
            });
        });
    });

    // 2. Buscar Liquidaciones Pendientes
    allSettlements.forEach(settlement => {
        if (settlement && settlement.status === 'pending_verification') {
            const collector = allCollectors.find(c => c.id === settlement.collectorId);
            notifications.push({
                type: 'settlement',
                date: settlement.date,
                collectorId: settlement.collectorId,
                collectorName: settlement.collectorName || collector?.name || 'Desconhecido',
                profilePictureUrl: collector?.profilePictureUrl,
                amount: settlement.amount,
                settlementId: settlement.id,
                textKey: 'settlementVerification' 
            });
        }
    });

    // 3. Buscar Solicitudes de Refinanciamiento
    allClients.forEach(client => {
        if (client.refinanceRequest && client.refinanceRequest.status === 'pending') {
             notifications.push({
                type: 'refinance',
                date: client.refinanceRequest.requestDate,
                clientId: client.id,
                clientName: client.name,
                profilePictureUrl: client.profilePictureUrl,
                amount: client.refinanceRequest.amount,
                textKey: 'refinanceRequest'
            });
        }
    });
    
    notifications.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));

    badge.textContent = notifications.length;
    badge.style.display = notifications.length > 0 ? 'flex' : 'none';
    badge.classList.toggle('visible', notifications.length > 0);

    const viewIsActive = document.getElementById('notifications-view')?.classList.contains('active');
    if (container && viewIsActive) {
        console.log("[ADMIN-APP] Renderizando lista de notificaciones...");
        
        const t = translations[currentLang];
        
        if (notifications.length === 0) {
            // CORRECCIÓN CLAVE: Añadido data-lang-key="noNotifications"
            container.innerHTML = `<p class="no-items" style="text-align: center; padding: 20px; color: var(--text-secondary);" data-lang-key="noNotifications">${t.noNotifications}</p>`;
            return;
        }

        container.innerHTML = notifications.map(n => {
            const name = n.clientName || n.collectorName || 'N/A';
            const nameInitial = (name).charAt(0).toUpperCase();
            const placeholderUrl = `https://placehold.co/80x80/6f42c1/FFFFFF?text=${nameInitial}`;
            const photoUrl = n.profilePictureUrl || placeholderUrl;
            
            let subtitle = '';
            
            if (n.type === 'payment') {
                subtitle = `${t.notifPaymentMsg} <strong>${money(n.amount)}</strong>. ${t.notifVerifyMsg}`;
            } else if (n.type === 'settlement') {
                subtitle = `${t.notifSettlementMsg} <strong>${money(n.amount)}</strong>. ${t.notifApproveMsg}`;
            } else if (n.type === 'refinance') {
                subtitle = `${t.notifRefinanceMsg} <strong>${money(n.amount)}</strong>. ${t.notifIdentityMsg}`;
            }

            return `
            <div class="client-card" data-type="${n.type}" data-client-id="${n.clientId || ''}" data-collector-id="${n.collectorId || ''}" data-loan-index="${n.loanIndex || 0}" data-history-index="${n.historyIndex || 0}" data-settlement-id="${n.settlementId || ''}" style="cursor: pointer;">
                <img src="${photoUrl}" alt="Foto" class="item-avatar" style="width: 48px; height: 48px;">
                <div class="item-info">
                    <h4 class="item-name">${name}</h4>
                    <p class="item-subtext" style="font-size: 0.9em;">${subtitle}</p>
                </div>
                <i data-lucide="chevron-right" style="color: var(--text-secondary); flex-shrink: 0;"></i>
            </div>`;
        }).join('');
        
        lucide.createIcons({nodes: container.querySelectorAll('[data-lucide]')});
    } else {
         console.log("[ADMIN-APP] Badge de notificaciones actualizado en segundo plano.");
    }
}

            // --- GUARDAR COBRADOR ---
            formModal.querySelector('#saveCollectorBtn').addEventListener('click', async (e) => {
                const saveBtn = e.currentTarget;

                saveBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> <span>Salvando...</span>`;
                lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });

                const documentFile = document.getElementById('collector-document-pic')?.files[0];

                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return; 
                }
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; 
                
                if (!username || !name || isNaN(capitalOnHand) || (!isEditMode && !password)) {
                    showToast(translations[currentLang].fillFields, true);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return;

                 if (!emailRegex.test(email)) {
                    showToast("Nome de usuário inválido para email.", true);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return;
                }
                
                try {
                    let profilePicUrl = collector.profilePictureUrl || ''; 
                    let documentPicUrl = collector.documentPictureUrl || ''; 

                    if (markProfileForRemoval) profilePicUrl = '';
                    if (markDocumentForRemoval) documentPicUrl = '';

                    if (profileFile) {
                        showToast("Subindo foto de perfil...", false);
                        const profileStorageRef = ref(storage, `companies/${currentCompanyId}/collectors/${username}/profile.jpg`);

                        profilePicUrl = await getDownloadURL(profileStorageRef);
                    }

                    if (documentFile) {
                        showToast("Subindo foto de documento...", false);
                        const documentStorageRef = ref(storage, `companies/${currentCompanyId}/collectors/${username}/document.jpg`);
                        await uploadBytes(documentStorageRef, documentFile);
                        documentPicUrl = await getDownloadURL(documentStorageRef);
                    }

                    const collectorData = {
                        companyId: currentCompanyId, 
                        username: username,
                        name,
                        routeName: routeName, // <-- GUARDAR DATO
                        email: email,
                        documentNumber: document.getElementById('collector-document').value.trim(),
                        address: document.getElementById('collector-address').value,
                        phone: document.getElementById('collector-phone').value,
                        whatsapp: document.getElementById('collector-whatsapp').value,
                        operatingCurrency: document.getElementById('collector-currency').value, 
                        
                        startingCapitalOnHand: capitalOnHand,
                        startingDistributedCapital: 0,
                        startingCapital: 0,
                        
                        profilePictureUrl: profilePicUrl,
                        documentPictureUrl: documentPicUrl
                    };
                    
                    if (isEditMode) {

                    } else {

                        const idToken = await auth.currentUser.getIdToken(true);

                        const dataToSend = { collectorEmail: email, collectorPassword: password, collectorData: collectorData };
                        const functionUrl = "https://us-central1-lumix-financas-app.cloudfunctions.net/createCollector";

                        });

        /**
         * INSTRUCCIÓN 2: Copia esta función COMPLETAMENTE NUEVA y pégala
         * en tu <script type="module"> (por ejemplo, después de la
         * función 'showCollectorFormModal' que acabas de reemplazar).
         */
        async function handleDeleteCollector(collectorId, collectorName) {
            const modal = document.getElementById('collectorFormModal');
            const detailView = document.getElementById('collectorDetailView');
            
            // 1. Mostrar confirmación
            const confirmed = await showConfirmationModal(
                'Eliminar Cobrador?',
                `¡ATENCIÓN! Estás a punto de eliminar permanentemente a ${collectorName} (${collectorId}). ESTA ACCIÓN TAMBIÉN ELIMINARÁ A TODOS LOS CLIENTES Y DATOS asociados a este cobrador. Esta acción no se puede deshacer.`,
                'Sim, Eliminar Permanentemente',
                'btn-danger'
            );

            if (!confirmed) {
                console.log("Eliminación cancelada por el usuario.");
                return;
            }

            // 2. Mostrar estado de carga (reutilizando el modal de overlay)
            const overlay = document.getElementById('reportOptionsModal');
            overlay.innerHTML = `
                <div class="modal-content" style="max-width: 350px; text-align: center;">
                    <i data-lucide="loader-circle" style="width: 48px; height: 48px; animation: spin 1s linear infinite; margin-bottom: 15px; color: var(--danger-color);"></i>
                    <h3 style="font-size: 1.25em; font-weight: 600;">Eliminando Cobrador...</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 0;">Por favor espere, esto puede tardar un momento...</p>
                </div>
            `;
            lucide.createIcons({ nodes: overlay.querySelectorAll('[data-lucide]') });
            overlay.classList.add('active');

            try {
                // 3. Eliminar todos los clientes de este cobrador
                console.log(`Buscando clientes para eliminar del cobrador: ${collectorId}`);
                const clientsQuery = query(
                    collection(db, 'companies', currentCompanyId, 'clients'),
                    where('collectorId', '==', collectorId)
                );
                
                const clientsSnapshot = await getDocs(clientsQuery);
                const deleteClientPromises = [];
                
                clientsSnapshot.forEach(clientDoc => {
                    console.log(`Añadiendo cliente a la cola de eliminación: ${clientDoc.id}`);
                    deleteClientPromises.push(deleteDoc(doc(db, 'companies', currentCompanyId, 'clients', clientDoc.id)));
                });

                if (deleteClientPromises.length > 0) {
                    await Promise.all(deleteClientPromises);
                    console.log(`${deleteClientPromises.length} clientes eliminados.`);
                } else {
                    console.log("No se encontraron clientes para este cobrador.");
                }

                // 4. Eliminar el documento principal del cobrador
                console.log(`Eliminando documento principal del cobrador: ${collectorId}`);
                const collectorRef = doc(db, 'collectors', collectorId);
                await deleteDoc(collectorRef);
                
                // NOTA: La cuenta de autenticación (Auth) de Firebase no se elimina
                // desde el cliente. Esto requiere una Cloud Function.
                // El 'auth user' quedará huérfano.

                console.log("¡Eliminación completada!");
                showToast('Cobrador e todos os seus clientes foram eliminados com sucesso.');

                // 5. Cerrar todos los modales
                overlay.classList.remove('active');
                if (modal) modal.classList.remove('active');
                if (detailView) detailView.classList.remove('active');
                
                // El onSnapshot de 'allCollectors' se actualizará automáticamente.

            } catch (error) {
                console.error("Erro catastrófico ao eliminar cobrador:", error);
                showToast('Erro ao eliminar o cobrador. Verifique o console.', true);
                overlay.classList.remove('active');
            }
        }

            `;

        // No necesitamos llamar a showMainApp() aquí.
        // El 'listener' de onAuthStateChanged se encargará automáticamente.
        // El botón desaparecerá junto con la pantalla de login.

    } catch (error) {
        // Este es el catch correcto para el LOGIN
        console.error("Erro de login:", error.code);
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
            showToast('Email ou senha inválidos.', true);
        } else if (error.code === 'auth/invalid-email') {
            showToast('Formato de email inválido.', true);
        } else {
            showToast('Erro ao tentar fazer login.', true);
        }

        // --- [INICIO: RESTAURAR BOTÓN EN ERROR] ---
        // Si el login falla, restauramos el botón a su estado original
        if (loginButton) {
            loginButton.disabled = false;
            loginButton.innerHTML = originalButtonHTML; // Restaurar HTML original
        }
        // --- [FIN: RESTAURAR BOTÓN EN ERROR] ---
    }
}


        
        function init() {
    document.body.classList.add('dark-mode');

    // Lógica del Banner de Instalación PWA (se queda igual)
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBanner = document.getElementById('install-banner');
        if (installBanner) {
            installBanner.style.display = 'block';
            applyLanguage(currentLang); // Aplica el idioma al nuevo contenido
        }
    });
    const installBtn = document.getElementById('install-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
            }
        });
    }
    const closeInstallBtn = document.getElementById('close-install-banner');
    if (closeInstallBtn) {
        closeInstallBtn.addEventListener('click', () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
        });
    }

    // Lógica de Global Settings (se queda igual)
    

    // --- ¡AQUÍ ESTÁ EL GRAN CAMBIO! ---
    // Quitamos el setTimeout y usamos onAuthStateChanged.
    // Esto escucha si el usuario está logueado o no CADA VEZ que se carga la app.
    const splash = document.getElementById('splash-screen');

    
    onAuthStateChanged(auth, async (user) => {
    // Ocultamos el splash AHORA
    splash.style.opacity = '0';
    setTimeout(() => {
        splash.style.display = 'none';
    }, 500);

    if (user) {
        // ¡El usuario SÍ está logueado! (Es el admin)
        // Empezamos la verificación inteligente...

        // PASO 1 (TAREA 1): Verificar permisos (Custom Claims)
        try {
            console.log("Verificando permissões do admin...");
            // Pedimos los permisos "frescos" a Firebase
            const tokenResult = await user.getIdTokenResult(true); 
            const claims = tokenResult.claims;

            console.log("Claims (permissões) do usuário:", claims);

            // Verificamos si es un 'admin' y tiene un 'companyId'
            if (claims.role !== 'admin' || !claims.companyId) {
                const errorMsg = "Sua conta não tem permissões de administrador. Contate o suporte.";
                console.error(errorMsg, claims);
                showBlockedView(errorMsg); // Muestra pantalla de bloqueo
                await signOut(auth); // Deslogueamos al usuario no autorizado
                return; // Detenemos la ejecución
            }

            // ¡Éxito! Guardamos la "llave maestra"
            currentCompanyId = claims.companyId; 
            console.log("Admin verificado. Company ID:", currentCompanyId);

            // PASO 2 (TAREA 0): Verificar si la empresa está ACTIVA o SUSPENSA
            // Usamos la 'llave maestra' (currentCompanyId) para leer el documento de la empresa
            const companyRef = doc(db, 'companies', currentCompanyId);
            const companySnap = await getDoc(companyRef); // <-- Usamos la herramienta que importamos

            if (!companySnap.exists()) {
                const errorMsg = `Erro crítico: A empresa com ID (${currentCompanyId}) não foi encontrada no banco de dados.`;
                console.error(errorMsg);
                showBlockedView(errorMsg);
                await signOut(auth);
                return;
            }

            // Guardamos los datos de la empresa (nombre, logo, status)
            currentCompanyData = companySnap.data(); 

            // ¡LA COMPROBACIÓN DE ESTADO!
            if (currentCompanyData.status === 'suspended') {
                const errorMsg = `A conta da sua empresa (${currentCompanyData.name}) está suspensa. Entre em contato com o suporte para reativar seu serviço.`;
                console.warn(errorMsg);
                showBlockedView(errorMsg); // Muestra bloqueo
                // No cerramos sesión, solo bloqueamos la app.
                return;
            }

            // ¡TODAS LAS VERIFICACIONES PASARON!
            console.log(`Acesso concedido para: ${currentCompanyData.name} (Status: ${currentCompanyData.status})`);
            document.getElementById('login-view').style.display = 'none';

            globalSettings = currentCompanyData; 
            loadGlobalSettings(globalSettings); 
            updateSettingsForm(globalSettings);


            // Ahora llamamos a la app principal
            showMainApp(); 

        } catch (error) {
            console.error("Erro crítico durante a verificação de acesso:", error);
            showBlockedView(`Ocorreu um erro ao verificar sua conta: ${error.message}`);
            await signOut(auth);
        }

    } else {
        // El usuario NO está logueado (esto no cambia)
        // Mostramos la pantalla de login
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('login-view').style.display = 'flex';
        // Añadimos el listener para el formulario de login
        const loginForm = document.getElementById('login-form');
        if (loginForm) { // Comprobamos si existe antes de añadir
            loginForm.addEventListener('submit', handleLogin);
        }
    }
});


    // --- FIN DEL GRAN CAMBIO ---
}


        init();
    </script>
