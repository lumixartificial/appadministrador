        async function generatePDFReport(collectorId, period) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const lang = currentLang;
            const now = new Date();
            const todayStr = now.toLocaleDateString('pt-BR');

            const collector = allCollectors.find(c => c.id === collectorId);
            if (!collector) {
                showToast("Cobrador não encontrado.", true);
                return;
            }

            // --- 1. CÁLCULO DEL PERÍODO (Sin cambios) ---
            let startDate;
            let periodLabel = 'Período Completo';
            if (period === '24h') {
                startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                periodLabel = 'Últimas 24 Horas';
            } else if (period === '48h') {
                startDate = new Date(now.getTime() - 48 * 60 * 60 * 1000);
                periodLabel = 'Últimas 48 Horas';
            } else if (period === 'week') {
                startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                periodLabel = 'Última Semana';
            } else if (period === 'month') {
                startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000); // 30 días atrás
                periodLabel = 'Últimos 30 Dias';
            }

            // --- 2. OBTENER CAPITAL TOTAL EM MÃOS (Refactorizado) ---
            // ¡Simplemente LEE el valor pre-calculado!
            const collectorMetrics = calculatedCollectorMetrics.get(collectorId) || { capitalOnHand: 0 };
            const capitalOnHand = collectorMetrics.capitalOnHand; // <-- Valor CORRECTO (sin mora)


            // --- 3. RECOPILAR DATOS DEL PERÍODO SELECCIONADO (Sin cambios) ---
            // (Esta lógica es específica del reporte y debe filtrar por fecha,
            // por lo que no puede usar los datos pre-calculados globales)
            
            // A. Pagos en el período
            const collectorClients = allClients.filter(c => c.collectorId === collectorId);
            let periodTotalCash = 0;
            let periodTotalDigital = 0;
            const periodPaymentsList = [];
            collectorClients.forEach(client => {
                (client.loans || []).forEach((loan, loanIndex) => {
                    (loan.history || []).forEach(h => {
                        if (h.date?.seconds && h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed') {
                            const paymentDate = new Date(h.date.seconds * 1000);
                            if (!startDate || paymentDate >= startDate) { // Filtra por fecha
                                const amount = h.amount || 0;
                                periodPaymentsList.push({
                                    clientName: client.name, amount,
                                    time: paymentDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
                                    date: paymentDate.toLocaleDateString('pt-BR'),
                                    method: h.method || 'dinheiro', loanIndex: loanIndex + 1
                                });
                                if (h.method === 'dinheiro') periodTotalCash += amount;
                                else periodTotalDigital += amount;
                            }
                        }
                    });
                });
            });
            const periodTotalCollected = periodTotalCash + periodTotalDigital;
            periodPaymentsList.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime() || a.time.localeCompare(b.time));

            // B. Gastos en el período
            const periodExpenses = allExpenses.filter(e => e.collectorId === collectorId && e.date?.seconds && (!startDate || new Date(e.date.seconds * 1000) >= startDate));
            const totalExpenses = periodExpenses.reduce((sum, e) => sum + e.value, 0);
            periodExpenses.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

            // C. Liquidaciones en el período
            const periodSettlements = allSettlements.filter(s => s.collectorId === collectorId && s.date?.seconds && (!startDate || new Date(s.date.seconds * 1000) >= startDate));
            const totalSettlements = periodSettlements.reduce((sum, s) => sum + s.amount, 0);
            periodSettlements.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

            // D. Aportes de Capital en el período
            const periodInjections = allCapitalInjections.filter(i => i.collectorId === collectorId && i.status === 'approved' && i.date?.seconds && (!startDate || new Date(i.date.seconds * 1000) >= startDate));
            const totalInjections = periodInjections.reduce((sum, i) => sum + i.amount, 0);
            periodInjections.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

            // E. Cálculo Final del Período (Sin cambios)
            const netBalance = periodTotalCollected + totalInjections - totalExpenses - totalSettlements;

            if (periodTotalCollected === 0 && totalExpenses === 0 && totalSettlements === 0 && totalInjections === 0) {
                showToast("Nenhuma atividade registrada para este cobrador no período selecionado.", true);
                return;
            }

            // --- 4. GENERAR PDF (Sin cambios) ---
            // (El resto de la función de generación de PDF no necesita cambios,
            // ya que ahora usa 'capitalOnHand' (que está 100% correcto)
            // y los datos filtrados por período (que son correctos para el reporte))
            const pageMargin = 15;
            const pageWidth = doc.internal.pageSize.getWidth();
            const center = pageWidth / 2;
            let y = 0;

            // A. Encabezado (Sin Logo)
            y = 25;
            doc.setFontSize(16);
            doc.setFont(undefined, 'bold');
            doc.text(currentCompanyData?.name || 'Relatório de Cobrança', center, y, { align: 'center' });
            y += 7;
            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(100);
            doc.text(`Relatório do Cobrador - ${periodLabel}`, center, y, { align: 'center' });

            // B. Información del Cobrador
            y += 15;
            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text('COBRADOR:', pageMargin, y);
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.setFont(undefined, 'bold');
            doc.text(collector.name || 'N/A', pageMargin + 25, y);

            // C. Resumen Contábil
            y += 15;
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text(`Resumo Contábil (${periodLabel})`, pageMargin, y);
            y += 5;
            doc.setLineWidth(0.5);
            doc.setDrawColor(200);
            doc.line(pageMargin, y, pageWidth - pageMargin, y);

            const addSummaryLine = (label, value, color = '#000000') => {
                y += 8;
                doc.setFontSize(11);
                doc.setFont(undefined, 'normal');
                doc.setTextColor(100);
                doc.text(label, pageMargin + 5, y);
                doc.setFont(undefined, 'bold');
                doc.setTextColor(color);
                doc.text(money(value), pageWidth - pageMargin - 5, y, { align: 'right' });
            };

            addSummaryLine(`(+) Total Recebido (${periodLabel}):`, periodTotalCollected, '#28a745');
            addSummaryLine(`    ... em Dinheiro:`, periodTotalCash, '#6c757d');
            addSummaryLine(`    ... em Digital/Recibo:`, periodTotalDigital, '#6c757d');
            addSummaryLine(`(+) Aportes de Capital (${periodLabel}):`, totalInjections, '#28a745');
            addSummaryLine(`(-) Gastos Totais (${periodLabel}):`, totalExpenses, '#dc3545');
            addSummaryLine(`(-) Liquidações Enviadas (${periodLabel}):`, totalSettlements, '#dc3545');

            y += 3;
            doc.setLineWidth(0.2);
            doc.line(pageMargin + 5, y, pageWidth - pageMargin - 5, y);
            
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(netBalance >= 0 ? '#6f42c1' : '#dc3545');
            doc.text(`SALDO LÍQUIDO (${periodLabel}):`, pageMargin + 5, y + 8);
            doc.text(money(netBalance), pageWidth - pageMargin - 5, y + 8, { align: 'right' });
            
            y += 8;
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(capitalOnHand >= 0 ? '#000000' : '#dc3545');
            doc.text('CAPITAL TOTAL EM MÃOS:', pageMargin + 5, y + 8);
            doc.text(money(capitalOnHand), pageWidth - pageMargin - 5, y + 8, { align: 'right' });

            y += 20;

            // D. Secciones de Detalles (con paginación)
            const checkPageBreak = () => {
                if (y > 270) { doc.addPage(); y = 20; }
            };

            const addSectionHeader = (title) => {
                checkPageBreak(); y += 5; doc.setFontSize(14); doc.setFont(undefined, 'bold'); doc.setTextColor(0);
                doc.text(title, pageMargin, y); y += 5; doc.setLineWidth(0.5); doc.setDrawColor(200);
                doc.line(pageMargin, y, pageWidth - pageMargin, y); y += 8;
            };

            const addTableHeaders = (headers) => {
                 doc.setFontSize(9); doc.setTextColor(100);
                 headers.forEach(header => doc.text(header.label, header.x, y, { align: header.align || 'left' }));
                 y += 5;
            };

            // D.1. Pagos Recibidos
            if (periodPaymentsList.length > 0) {
                addSectionHeader('Detalhe dos Pagamentos Recebidos');
                addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Cliente (Empréstimo)', x: pageMargin + 30 },
                    { label: 'Método', x: pageMargin + 130 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                periodPaymentsList.forEach(p => {
                    checkPageBreak();
                    doc.setFontSize(10); doc.setTextColor(0);
                    doc.text(`${p.date} ${p.time}`, pageMargin + 5, y);
                    doc.text(doc.splitTextToSize(`${p.clientName} (E ${p.loanIndex})`, 90), pageMargin + 30, y);
                    doc.text(p.method, pageMargin + 130, y);
                    doc.setFont(undefined, 'bold'); doc.setTextColor('#28a745');
                    doc.text(money(p.amount), pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }

            // D.2. Gastos
            if (periodExpenses.length > 0) {
                addSectionHeader('Detalhe dos Gastos');
                addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Categoria', x: pageMargin + 30 },
                    { label: 'Obs.', x: pageMargin + 75 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                periodExpenses.forEach(e => {
                    checkPageBreak();
                    const date = new Date(e.date.seconds * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short'});
                    const category = translations[lang][e.category] || e.category;
                    doc.setFontSize(10); doc.setTextColor(0);
                    doc.text(date, pageMargin + 5, y);
                    doc.text(category, pageMargin + 30, y);
                    doc.text(doc.splitTextToSize(e.observations || '-', 55), pageMargin + 75, y);
                    doc.setFont(undefined, 'bold'); doc.setTextColor('#dc3545');
                    doc.text(`-${money(e.value)}`, pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }

            // D.3. Liquidaciones
            if (periodSettlements.length > 0) {
                addSectionHeader('Detalhe das Liquidações Enviadas');
                addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Status', x: pageMargin + 70 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                periodSettlements.forEach(s => {
                    checkPageBreak();
                    const date = new Date(s.date.seconds * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short'});
                    doc.setFontSize(10); doc.setTextColor(0);
                    doc.text(date, pageMargin + 5, y);
                    doc.text(s.status || 'Pendente', pageMargin + 70, y);
                    doc.setFont(undefined, 'bold'); doc.setTextColor('#dc3545');
                    doc.text(`-${money(s.amount)}`, pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }
            
            // D.4. Aportes de Capital
            if (periodInjections.length > 0) {
                addSectionHeader('Detalhe dos Aportes de Capital Recebidos');
                 addTableHeaders([
                    { label: 'Data', x: pageMargin + 5 },
                    { label: 'Status', x: pageMargin + 70 },
                    { label: 'Valor', x: pageWidth - pageMargin - 5, align: 'right' }
                ]);
                periodInjections.forEach(i => {
                    checkPageBreak();
                    const date = new Date(i.date.seconds * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short'});
                    doc.setFontSize(10); doc.setTextColor(0);
                    doc.text(date, pageMargin + 5, y);
                    doc.text(i.status || 'Aprovado', pageMargin + 70, y);
                    doc.setFont(undefined, 'bold'); doc.setTextColor('#28a745');
                    doc.text(money(i.amount), pageWidth - pageMargin - 5, y, { align: 'right' });
                    y += 7;
                });
            }
            
            // E. Pie de página
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(9); doc.setTextColor(150);
                doc.text(`Gerado por LUMIX Finanças - Página ${i} de ${pageCount}`, center, 285, { align: 'center' });
            }

            // F. Guardar
            doc.save(`relatorio-${collectorId}-${period}.pdf`);
        }

            } = calculatedGlobalMetrics;

        // REEMPLAZA ESTA FUNCIÓN COMPLETA (BLOQUE 5)
function showClientDetails(clientId, loanIndex = 0) { // <-- Acepta un loanIndex
    const client = allClients.find(c => c.id === clientId);
    
    if (!client) {
        showToast('Erro: Cliente não encontrado.', true);
        return;
    }

    const detailModal = document.getElementById('clientDetailModal');
    
    // --- LÓGICA DE SELECCIÓN DE PRÉSTAMO ---
    // (Esta lógica es para las pestañas, similar a la app del cobrador)
    const displayableLoans = (client.loans || []).filter(l => l.status !== 'finished');
    const activeOrLastFinishedLoans = displayableLoans.length > 0 ? displayableLoans : (client.loans && client.loans.length > 0 ? [client.loans[client.loans.length - 1]] : []);
    
    const currentLoanIndex = (loanIndex >= 0 && client.loans && loanIndex < client.loans.length && (client.loans[loanIndex].status !== 'finished' || activeOrLastFinishedLoans.some(l => client.loans[loanIndex] === l)))
                   ? loanIndex
                   : (activeOrLastFinishedLoans.length > 0 ? client.loans.findIndex(l => l === activeOrLastFinishedLoans[0]) : 0);

    if (!client.loans || !client.loans[currentLoanIndex]) {
        console.error(`Cliente o préstamo con índice ${currentLoanIndex} no encontrado para ${clientId}`);
        showToast("Erro ao carregar detalhes do empréstimo.", true);
        return;
    }
    
    const loan = client.loans[currentLoanIndex];
    const hasMultipleDisplayable = activeOrLastFinishedLoans.length > 1;
    // --- FIN LÓGICA DE SELECCIÓN ---
    
    const paidAmount = (loan.history || [])
        .filter(h => h.status === 'approved' || (!h.status && h.date))
        .reduce((sum, h) => sum + (h.amount || 0), 0) + (loan.initialMigratedAmount || 0);

    const totalAmount = loan.totalLoan || 0;
    const remainingAmount = Math.max(0, totalAmount - paidAmount) + (loan.lateFeesAccumulated || 0);

    const loanDetails = calculateLoanDetails(loan);
    const currentStatus = loanDetails.status;
    const statusClass = `status-${currentStatus}`;
    const statusText = (translations[currentLang] && translations[currentLang][currentStatus]) || currentStatus;

    // --- [INICIO DE LA MODIFICACIÓN (BLOQUE 5.1)] ---
    const historyHtml = (loan.history && loan.history.length > 0) ? 
        [...loan.history].sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)).map((p) => {
            // 1. Obtenemos el índice original del array SIN ORDENAR
            const originalIndex = loan.history.indexOf(p);
            
            let dateStr = 'N/A';
            if (p.date?.seconds) {
                dateStr = new Date(p.date.seconds * 1000).toLocaleDateString();
            }

            // 2. Añadimos el data-history-index al div y la clase clicable
            return `
            <div class="payment-history-item" data-history-index="${originalIndex}">
                <span>${dateStr}</span>
                <strong>${money(p.amount)}</strong>
            </div>
            `
        }).join('') : '<p>Nenhum histórico de pagamento.</p>';
    // --- [FIN DE LA MODIFICACIÓN (BLOQUE 5.1)] ---
    
    const docsHtml = (client.documents && client.documents.length > 0) ?
        client.documents.map(doc => `
            <div class="document-list-item">
                <i data-lucide="file-text"></i>
                <a href="${doc.url}" target="_blank" rel="noopener noreferrer">${doc.name}</a>
            </div>
        `).join('') : '<p>Nenhum documento anexado.</p>';
    
    detailModal.innerHTML = `
        <header class="modal-header">
            <button id="closeClientDetail"><i data-lucide="arrow-left"></i></button>
            <span class="modal-title">${client.name}</span>
            <button id="editClientBtn" data-client-id="${client.id}" data-loan-index="${currentLoanIndex}"><i data-lucide="edit"></i></button>
        </header>
        
        ${hasMultipleDisplayable ? `
        <div class="loan-tabs-wrapper"> 
            <div class="loan-tabs-container" id="loan-tabs-container">
                ${client.loans.map((l, index) => {
                    const isRelevant = activeOrLastFinishedLoans.some(relevantLoan => client.loans[index] === relevantLoan);
                    if (isRelevant || index === currentLoanIndex) {
                        return `<button class="loan-tab ${index === currentLoanIndex ? 'active' : ''}" data-loan-index="${index}">
                                    Préstamo ${index + 1} ${l.status === 'finished' ? '(Finalizado)' : ''}
                                </button>`;
                    }
                    return '';
                }).join('')}
            </div>
        </div>` : ''}

        <div class="modal-content-wrapper container">
            <div class="kpi-card" style="text-align: center; margin-bottom: 20px;">
                <h3 class="kpi-title" style="justify-content: center;">Estado do Préstamo ${currentLoanIndex + 1}</h3>
                <span class="payment-status ${statusClass}" style="font-size: 1.2em; font-weight: 600; padding: 8px 20px;">
                    ${statusText}
                </span>

        async function showPaymentDetailModal(clientId, loanIndex, historyIndex) {
    const modal = document.getElementById('paymentDetailModal');
    
    // --- (CORRECCIÓN INICIO) ---
    // 1. Obtenemos el cliente FRESCO desde el array global CADA VEZ que se abre el modal
    const client = allClients.find(c => c.id === clientId);
    // --- (CORRECCIÓN FIN) ---

    // Validaciones
    if (!client || !client.loans || !client.loans[loanIndex] || !client.loans[loanIndex].history || !client.loans[loanIndex].history[historyIndex]) {
        showToast('Erro: Não foi possível encontrar os dados deste pagamento.', true);
        return;
    }

    const loan = client.loans[loanIndex];
    const payment = loan.history[historyIndex];

    const paymentDate = payment.date?.seconds ? new Date(payment.date.seconds * 1000) : null;
    const dateString = paymentDate ? paymentDate.toLocaleDateString(currentLang === 'pt' ? 'pt-BR' : 'es-ES') : 'N/A';
    const timeString = paymentDate ? paymentDate.toLocaleTimeString(currentLang === 'pt' ? 'pt-BR' : 'es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
    
    let receiptHtml = '';
    if (payment.receiptUrl) {
        receiptHtml = `<img src="${payment.receiptUrl}" alt="Comprovante" class="receipt-preview">`;
    } else {
        receiptHtml = `<p class="no-receipt">Nenhum comprovante anexado para este pagamento.</p>`;
    }

    // Determina el estado del pago
    let statusText, statusClass;
    switch(payment.status) {
        case 'pending_verification': statusText = 'Pendente'; statusClass = 'status-pending'; break;
        case 'rejected': statusText = 'Rejeitado'; statusClass = 'status-late'; break;
        case 'postponed': statusText = 'Adiado'; statusClass = 'status-paid'; break;
        default: statusText = 'Aprovado'; statusClass = 'status-paid';
    }

    const canDelete = (payment.status === 'approved' || (!payment.status && payment.date));

    modal.innerHTML = `
        <header class="modal-header">
            <button id="closePaymentDetailModal"><i data-lucide="arrow-left"></i></button>
            <span class="modal-title">Detalhes do Pagamento</span>
        </header>
        <div class="modal-content-wrapper container">
            <div class="kpi-card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <h3 class="kpi-title">Data</h3>
                        <p class="kpi-value" style="font-size: 1.2em;">${dateString} às ${timeString}</p>
                    </div>
                    <div>
                        <h3 class="kpi-title" style="justify-content: flex-end;">Status</h3>
                        <p class="kpi-value ${statusClass}" style="font-size: 1.2em;">${statusText}</p>
                    </div>
                </div>
                <div style="text-align: center;">
                    <h3 class="kpi-title" style="justify-content: center;">Valor Pago</h3>
                    <p class="kpi-value" style="font-size: 1.8em; color: var(--accent-green);">${money(payment.amount)}</p>
                </div>
            </div>
            
            <h3 class="section-title" style="border: none; margin-bottom: 10px;">Comprovante</h3>
            ${receiptHtml}
        </div>
        <div class="action-buttons">
            <button id="delete-payment-btn" class="btn-danger" ${canDelete ? '' : 'disabled'} title="${canDelete ? '' : 'Não é possível excluir pagamentos pendentes, rejeitados ou adiados.'}">
                <i data-lucide="trash-2"></i> Excluir Pagamento
            </button>
        </div>
    `;

    history.pushState({ modal: 'paymentDetailModal' }, 'Payment Details', '#payment-detail');
    modal.classList.add('active');
    
    try {
        lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });
    } catch (iconError) {
        console.warn("Lucide icons failed to render in paymentDetailModal:", iconError);
    }
    // --- [FIN DE LA CORRECCIÓN 2/2] ---

    // --- Listeners del Modal ---
    modal.querySelector('#closePaymentDetailModal').addEventListener('click', () => window.history.back());


    const deleteBtn = modal.querySelector('#delete-payment-btn');
    if (canDelete) {
        deleteBtn.addEventListener('click', async () => {
            
            // --- (CORRECCIÓN INICIO) 2. Muestra la confirmación ANTES de hacer nada ---
            const confirmed = await showConfirmationModal(
                'Confirmar Exclusão',
                'Você está prestes a excluir este pagamento. Esta ação é IRREVERSÍVEL e irá reverter a contabilidade (o saldo do cliente e o capital do cobrador serão recalculados). Deseja continuar?',
                'Sim, Excluir Pagamento',
                'btn-danger'
            );

            if (!confirmed) return; // Si el admin cancela, no hacemos nada.
            // --- (CORRECCIÓN FIN) 2. ---

            // Mostrar estado de carga en el botón
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Excluindo...`;
            lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });

            try {
                const clientRef = doc(db, 'companies', currentCompanyId, "clients", clientId);
                
                // --- (CORRECCIÓN INICIO) 3. Busca el cliente FRESCO OTRA VEZ ---
                //    Esto garantiza que estamos editando los datos más actuales de 'allClients'.
                const latestClientData = allClients.find(c => c.id === clientId);
                if (!latestClientData) throw new Error("Cliente desapareceu durante a operação.");

                // 4. Hacemos la copia profunda de los datos FRESCOS.
                const updatedLoans = JSON.parse(JSON.stringify(latestClientData.loans));
                // --- (CORRECCIÓN FIN) 3 y 4 ---

                const loanToUpdate = updatedLoans[loanIndex];

                if (!loanToUpdate || !loanToUpdate.history || !loanToUpdate.history[historyIndex]) {
                    throw new Error("Referência de pagamento inválida ao tentar excluir.");
                }

                // Elimina el pago del array de historial
                const deletedPayment = loanToUpdate.history.splice(historyIndex, 1);
                console.log("Pagamento excluído do array local:", deletedPayment);

                // Actualiza el documento del cliente en Firestore
                await updateDoc(clientRef, {
                    loans: updatedLoans
                });

                showToast('Pagamento excluído com sucesso! A contabilidade será recalculada.', false);

                window.history.back(); 
                
                // Forzamos el recálculo global (esto revertirá la contabilidad)
                checkAndRunGlobalUpdate();
                
                // Refrescamos la vista de detalles del cliente si sigue abierta
                if (document.getElementById('clientDetailModal').classList.contains('active')) {
                     showClientDetails(clientId, loanIndex);
                }

            } catch (error) {
                console.error("Erro ao excluir pagamento:", error);
                showToast(`Falha ao excluir pagamento: ${error.message}`, true);
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = `<i data-lucide="trash-2"></i> Excluir Pagamento`;
                lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });
            }
        });
    }
}

function updateAdminNotificationsView() {
    const container = document.getElementById('admin-notifications-list');
    const badge = document.getElementById('admin-notification-badge');
    if (!badge) return; // Si el badge no existe, la UI no está lista

    let notifications = [];

    // 1. Buscar Pagos Pendientes de Verificación (Lógica existente)
    allClients.forEach(client => {
        (client.loans || []).forEach((loan, loanIndex) => {
            (loan.history || []).forEach((payment, historyIndex) => {
                if (payment && payment.status === 'pending_verification') {
                    notifications.push({
                        type: 'payment',
                        date: payment.date,
                        clientId: client.id,
                        clientName: client.name,
                        profilePictureUrl: client.profilePictureUrl,
                        amount: payment.amount,
                        loanIndex: loanIndex,
                        historyIndex: historyIndex,
                        textKey: 'paymentVerification'
                    });
                }
            });
        });
    });

    // 2. Buscar Liquidaciones Pendientes (Lógica existente)
    allSettlements.forEach(settlement => {
        if (settlement && settlement.status === 'pending_verification') {
            const collector = allCollectors.find(c => c.id === settlement.collectorId);
            notifications.push({
                type: 'settlement',
                date: settlement.date,
                collectorId: settlement.collectorId,
                collectorName: settlement.collectorName || collector?.name || 'Desconhecido',
                profilePictureUrl: collector?.profilePictureUrl,
                amount: settlement.amount,
                settlementId: settlement.id,
                textKey: 'settlementVerification' 
            });
        }
    });

    // --- [INICIO DE LA MODIFICACIÓN] ---
    // 3. (NUEVO) Buscar Solicitudes de Refinanciamiento
    allClients.forEach(client => {
        if (client.refinanceRequest && client.refinanceRequest.status === 'pending') {
             notifications.push({
                type: 'refinance', // <-- Nuevo tipo
                date: client.refinanceRequest.requestDate,
                clientId: client.id,
                clientName: client.name,
                profilePictureUrl: client.profilePictureUrl,
                amount: client.refinanceRequest.amount,
                textKey: 'refinanceRequest'
            });
        }
    });
    // --- [FIN DE LA MODIFICACIÓN] ---
    
    // Ordenar por fecha (más reciente primero)
    notifications.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));

    // Actualizar el badge (SIEMPRE)
    badge.textContent = notifications.length;
    badge.style.display = notifications.length > 0 ? 'flex' : 'none';
    badge.classList.toggle('visible', notifications.length > 0);

    // Renderizar la lista (SOLO SI LA VISTA ESTÁ ACTIVA Y EL CONTENEDOR EXISTE)
    const viewIsActive = document.getElementById('notifications-view')?.classList.contains('active');
    if (container && viewIsActive) {
        console.log("[ADMIN-APP] Renderizando lista de notificaciones...");
        if (notifications.length === 0) {
            container.innerHTML = `<p class="no-items" style="text-align: center; padding: 20px; color: var(--text-secondary);">Nenhuma notificação pendente.</p>`;
            return;
        }

        container.innerHTML = notifications.map(n => {
            const name = n.clientName || n.collectorName || 'N/A';
            const nameInitial = (name).charAt(0).toUpperCase();
            const placeholderUrl = `https://placehold.co/80x80/6f42c1/FFFFFF?text=${nameInitial}`;
            const photoUrl = n.profilePictureUrl || placeholderUrl;
            
            let subtitle = '';
            if (n.type === 'payment') {
                subtitle = `Enviou um pagamento de <strong>${money(n.amount)}</strong>. Por favor, verifique.`;
            } else if (n.type === 'settlement') {
                subtitle = `Enviou uma liquidação de <strong>${money(n.amount)}</strong>. Por favor, aprove.`;
            } else if (n.type === 'refinance') {
                // --- [INICIO DE LA MODIFICACIÓN] ---
                subtitle = `Solicitou um refinanciamento de <strong>${money(n.amount)}</strong>. Verifique a identidade.`;
                // --- [FIN DE LA MODIFICACIÓN] ---
            }

            return `
            <div class="client-card" data-type="${n.type}" data-client-id="${n.clientId || ''}" data-collector-id="${n.collectorId || ''}" data-loan-index="${n.loanIndex || 0}" data-history-index="${n.historyIndex || 0}" data-settlement-id="${n.settlementId || ''}" style="cursor: pointer;">
                <img src="${photoUrl}" alt="Foto" class="item-avatar" style="width: 48px; height: 48px;">
                <div class="item-info">
                    <h4 class="item-name">${name}</h4>
                    <p class="item-subtext" style="font-size: 0.9em;">${subtitle}</p>
                </div>
                <i data-lucide="chevron-right" style="color: var(--text-secondary); flex-shrink: 0;"></i>
            </div>`;
        }).join('');
        
        lucide.createIcons({nodes: container.querySelectorAll('[data-lucide]')});
    } else {
         console.log("[ADMIN-APP] Badge de notificaciones actualizado en segundo plano.");
    }
}

            const profilePreview = formModal.querySelector('#profile-preview');
            const documentInput = formModal.querySelector('#collector-document-pic');
            const documentPreview = formModal.querySelector('#document-preview');

                });

            }
            if (isEditMode && collector.documentPictureUrl) {
                documentPreview.src = collector.documentPictureUrl;
            }
            // --- FIN NUEVO CÓDIGO PARA VISTA PREVIA DE IMAGEN ---



            // --- Lógica de Moeda ---

            ).join('');

            const updateCurrencySymbol = () => {

                const config = CURRENCY_CONFIGS[selectedCurrencyCode];
                if (config && capitalSymbolSpan) {
                    capitalSymbolSpan.textContent = `(${config.symbol})`;
                 }
            };

            updateCurrencySymbol(); 
            currencySelect.addEventListener('change', updateCurrencySymbol);
            // --- Fin Lógica de Moeda ---

            // --- Lógica de Verificación ---
            const fieldsToVerify = ['collector-name', 'collector-document', 'collector-phone', 'collector-whatsapp'];
            fieldsToVerify.forEach(fieldId => {
                const input = formModal.querySelector(`#${fieldId}`);
                if (input) {
                    input.addEventListener('blur', () => verifyCollectorInSystem(collectorId));
                }
            });

            if (isEditMode) {
                verifyCollectorInSystem(collectorId);
            }

            // --- [CAMBIO] Lógica de validación de Username y Email ---
            const usernameInput = formModal.querySelector('#collector-username');
            const emailInput = formModal.querySelector('#collector-email'); // <-- Esta variable ahora es null, la eliminamos
            const usernameMsg = formModal.querySelector('#username-validation-msg');
            const emailMsg = formModal.querySelector('#email-validation-msg'); // <-- Este elemento ya no existe

            // Si estamos en modo edición, marcamos como "válidos" por defecto
            if (isEditMode) {
                isUsernameGloballyAvailable = true;
                // isEmailFormatValid = true; // <-- Ya no es necesaria
                usernameMsg.style.display = 'none';
                // if(emailMsg) emailMsg.style.display = 'none'; // <-- Ya no es necesario
            }

            // 1. Listener para el Nombre de Usuario (Username)
            usernameInput.addEventListener('blur', async () => {
                if (isEditMode) return; // No verificar si estamos editando
                
                const username = usernameInput.value.trim();
                if (username.length < 4) {
                    usernameMsg.className = 'validation-message invalid';
                    usernameMsg.innerHTML = `<i data-lucide="x-circle"></i> Mínimo 4 caracteres.`;
                    isUsernameGloballyAvailable = false;
                    lucide.createIcons({nodes: [usernameMsg.querySelector('i')]});
                    return;
                }
                // [CAMBIO] Verificamos que no contenga @
                if (username.includes('@')) {
                    usernameMsg.className = 'validation-message invalid';
                    usernameMsg.innerHTML = `<i data-lucide="x-circle"></i> Não pode conter '@'.`;
                    isUsernameGloballyAvailable = false;
                    lucide.createIcons({nodes: [usernameMsg.querySelector('i')]});
                    return;
                }


                usernameMsg.className = 'validation-message checking';
                usernameMsg.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite; width: 14px; height: 14px;"></i> Verificando disponibilidade...`;
                lucide.createIcons({nodes: [usernameMsg.querySelector('i')]});

                try {
                    // Consulta GLOBAL (requiere reglas de seguridad abiertas para 'read' en 'collectors')
                    const collectorRef = doc(db, 'collectors', username);
                    const docSnap = await getDoc(collectorRef);
                    
                    if (docSnap.exists()) {
                        usernameMsg.className = 'validation-message invalid';
                        usernameMsg.innerHTML = `<i data-lucide="x-circle"></i> Usuário já existe no sistema.`;
                        isUsernameGloballyAvailable = false;
                    } else {
                        usernameMsg.className = 'validation-message valid';
                        usernameMsg.innerHTML = `<i data-lucide="check-circle"></i> Nome de usuário disponível!`;
                        isUsernameGloballyAvailable = true;
                    }
                } catch (error) {
                    console.error("Erro ao verificar username:", error);
                    usernameMsg.className = 'validation-message invalid';
                    usernameMsg.innerHTML = `<i data-lucide="alert-triangle"></i> Erro ao verificar.`;
                    isUsernameGloballyAvailable = false; // No permitir si hay error
                }
                lucide.createIcons({nodes: [usernameMsg.querySelector('i')]});
            });

            // 2. [CAMBIO] El listener para el Email fue ELIMINADO
            
            // --- Fin Lógica de Verificación ---

            lucide.createIcons({nodes: formModal.querySelectorAll('[data-lucide]')});
            applyLanguage(currentLang);
            
            formModal.querySelector('#closeCollectorForm').addEventListener('click', () => formModal.classList.remove('active'));
            
            
            
            // --- [CAMBIO] Lógica de Guardado ---
            formModal.querySelector('#saveCollectorBtn').addEventListener('click', async (e) => {
                const saveBtn = e.currentTarget;
                const originalBtnHTML = saveBtn.innerHTML;
                saveBtn.disabled = true;
                saveBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> <span>Salvando...</span>`;
                lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });

                // 2. Obtener todos los valores del formulario
                const profileFile = document.getElementById('collector-profile-pic')?.files[0];
                const documentFile = document.getElementById('collector-document-pic')?.files[0];
                const username = document.getElementById('collector-username').value.trim(); // Este es el ID del documento Y la base del email
                const name = document.getElementById('collector-name').value.trim();
                
                // [CAMBIO] El email se construye a partir del 'username' con el sufijo @gmail.com
                const email = `${username}@gmail.com`; 
                
                const password = document.getElementById('collector-password').value.trim();
                const capital = parseFloat(document.getElementById('collector-capital').value);


                if (!isEditMode && !isUsernameGloballyAvailable) {
                    showToast('Esse nome de usuário já está em uso ou não foi verificado.', true);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return; // Detiene el guardado
                }
                
                // [CAMBIO] Ya no validamos isEmailFormatValid

                // 3. Validación
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Mantenemos el regex para chequear el *resultado*
                
                // [CAMBIO] Verificamos el 'username' y 'password' (el email ya no viene del form)
                if (!username || !name || isNaN(capital) ||
                    (!isEditMode && !password)
                    // [CAMBIO] Las fotos ya no son obligatorias
                    // (!isEditMode && (!profileFile || !documentFile)) 
                ) {
                    showToast(translations[currentLang].fillFields, true);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return;
                }

                // [CAMBIO] Verificamos el 'email' construido
                 if (!emailRegex.test(email)) {
                    showToast("O nome de usuário não pode ser usado para criar um email válido (evite caracteres especiais ou espaços).", true);
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                    return;
                }
                
                // 4. Iniciar el bloque try...catch principal
                try {
                    // 5. Subir fotos y obtener URLs
                    let profilePicUrl = collector.profilePictureUrl || ''; // Mantiene la foto antigua si estamos editando
                    let documentPicUrl = collector.documentPictureUrl || ''; // Mantiene el doc antiguo si estamos editando

                    if (profileFile) {
                        showToast("Subindo foto de perfil...", false);
                        const profileStorageRef = ref(storage, `companies/${currentCompanyId}/collectors/${username}/profile.jpg`);
                        await uploadBytes(profileStorageRef, profileFile);
                        profilePicUrl = await getDownloadURL(profileStorageRef);
                    }

                    if (documentFile) {
                        showToast("Subindo foto de documento...", false);
                        const documentStorageRef = ref(storage, `companies/${currentCompanyId}/collectors/${username}/document.jpg`);
                        await uploadBytes(documentStorageRef, documentFile);
                        documentPicUrl = await getDownloadURL(documentStorageRef);
                    }

                    // 6. Definir el objeto de datos del cobrador UNA SOLA VEZ
                    const collectorData = {
                        companyId: currentCompanyId, 
                        username: username, // Este será el ID del documento
                        name,
                        email: email, // [CAMBIO] Guardamos el email construido en Firestore
                        documentNumber: document.getElementById('collector-document').value.trim(),
                        address: document.getElementById('collector-address').value,
                        phone: document.getElementById('collector-phone').value,
                        whatsapp: document.getElementById('collector-whatsapp').value,
                        operatingCurrency: document.getElementById('collector-currency').value, 
                        startingCapital: capital,
                        profilePictureUrl: profilePicUrl,
                        documentPictureUrl: documentPicUrl
                    };

                    // 7. Lógica de Edición o Creación
                    if (isEditMode) {
                        // --- MODO EDICIÓN ---
                        const { username: id, email: emailToUpdate, ...dataToUpdate } = collectorData; // Quitamos 'username' y 'email' de los datos a actualizar

                        if (password) {
                            console.warn("A atualização de senha no modo 'Editar' precisa de uma Cloud Function dedicada. A senha NÃO foi alterada.");
                            showToast("A senha não pode ser alterada no modo de edição.", true);
                        }
                        
                        await updateDoc(doc(db, "collectors", collectorId), dataToUpdate);
                        showToast(translations[currentLang].collectorUpdated);
                        formModal.classList.remove('active');

                    } else {
                        // --- MODO CREACIÓN ---
                        
                        if (!auth.currentUser) throw new Error("Admin não está autenticado.");
                        const idToken = await auth.currentUser.getIdToken(true);

                        const dataToSend = {
                            collectorEmail: email, // [CAMBIO] Usa el email construido
                            collectorPassword: password,
                            collectorData: collectorData
                        };

                        const functionUrl = "https://us-central1-lumix-financas-app.cloudfunctions.net/createCollector";

                        console.log("Chamando Cloud Function 'createCollector'...");
                        const response = await fetch(functionUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${idToken}`
                            },
                            body: JSON.stringify({ data: dataToSend })
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            const errorCode = errorData.error?.code;
                            const errorMessage = errorData.error?.message || `Error HTTP ${response.status}`;
                            
                            if (response.status === 409 && errorCode === 'auth/email-already-in-use') {
                                 throw new Error(`Erro: O email '${email}' (criado a partir do usuário) já está em uso.`);
                            } else if (response.status === 409 && errorCode === 'firestore/already-exists') {
                                 throw new Error(`Erro: O nome de usuário '${username}' já existe.`);
                            }
                            else {
                                throw new Error(errorMessage);
                            }
                        }

                        const result = await response.json();
                        console.log("Cloud Function 'createCollector' bem-sucedida:", result);

                        showToast(translations[currentLang].collectorAdded);
                        formModal.classList.remove('active');
                    }

                } catch (error) {
                    console.error("ERRO DETALHADO AO SALVAR COBRADOR: ", error);
                    let userMessage = error.message || translations[currentLang].errorSaving;

                    if (error.code) { 
                        switch (error.code) {
                            case 'storage/unauthorized':
                                userMessage = "Erro de Permissão: Verifique suas Regras do Storage.";
                                break;
                            case 'storage/retry-limit-exceeded':
                                 userMessage = "Erro de Conexão com Storage (Tente novamente)";
                                 break;
                            default:
                                userMessage = `Erro: ${error.message}`;
                        }
                    }
                    showToast(userMessage, true);

                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = originalBtnHTML;
                    lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
                }
            });

        }
        
        
        function showClientFormModal(clientId) {
            const client = allClients.find(c => c.id === clientId);
            if (!client) {
                showToast('Cliente não encontrado.', true);
                return;
            }

            const formModal = document.getElementById('clientFormModal');
            const collectorOptions = allCollectors.map(c =>
                `<option value="${c.id}" ${c.id === client.collectorId ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            const modalTitleKey = 'editClient';
            const saveButtonKey = 'saveChanges';

            formModal.innerHTML = `
                <header class="modal-header">
                    <button id="closeClientForm"><i data-lucide="arrow-left"></i></button>
                    <span class="modal-title" data-lang-key="${modalTitleKey}"></span>
                </header>
                <div class="modal-content-wrapper container">
                    <form id="client-form-edit">
                        <div class="form-group">
                            <label>Nome do Cliente</label>
                            <input type="text" id="client-name" required value="${client.name || ''}">
                        </div>
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="client-address" value="${client.address || ''}">
                        </div>
                         <div class="form-group grid-2">
                            <div>
                                <label>WhatsApp</label>
                                <input type="tel" id="client-whatsapp" value="${client.whatsapp || ''}">
                            </div>
                            <div>
                                <label>Telefone Opcional</label>
                                <input type="tel" id="client-phone" value="${client.phone || ''}">
                            </div>
                        </div>
                        <hr style="border: 1px solid var(--border-color); margin: 30px 0;">
                        <div class="form-group">
                            <label>Cobrador</label>
                            <select id="client-collector">${collectorOptions}</select>
                        </div>
                        <div class="form-group grid-2">
                            <div><label>Valor do Empréstimo</label><input type="number" id="client-loan-amount" required value="${(client.totalLoan && client.interestRate) ? (client.totalLoan / (1 + client.interestRate/100)).toFixed(2) : ''}"></div>
                            <div><label>Juros (%)</label><input type="number" id="client-interest" required value="${client.interestRate || '20'}"></div>
                        </div>
                        <div class="form-group"><label>Valor Total a Pagar</label><input type="text" id="client-total-to-pay" readonly></div>
                        <div class="form-group grid-2">
                             <div><label>Número de Parcelas</label><input type="number" id="client-installments" required value="${client.installments ? client.installments.split('/')[1] : ''}"></div>
                            <div><label>Valor da Parcela</label><input type="text" id="client-installment-value" readonly></div>
                        </div>
                         <div class="form-group">
                            <label>Dias de Pagamento</label>
                            <div class="day-selector">
                                ${['D','S','T','Q','Q','S','S'].map((day, i) => `<div><input type="checkbox" id="form-day-${i}" value="${i}"><label for="form-day-${i}">${day}</label></div>`).join('')}
                            </div>
                        </div>
                    </form>
                </div>
                <div class="action-buttons">
                    <button id="deleteClientBtn" class="btn-danger"><i data-lucide="trash"></i> <span data-lang-key="deleteClient"></span></button>
                    <button id="saveClientBtn" class="btn-primary"><i data-lucide="save"></i> <span data-lang-key="${saveButtonKey}"></span></button>
                </div>
            `;
            formModal.classList.add('active');
            lucide.createIcons({nodes: formModal.querySelectorAll('[data-lucide]')});
            applyLanguage(currentLang);

            (client.paymentDays || []).forEach(day => {
                const checkbox = formModal.querySelector(`#form-day-${day}`);
                if (checkbox) checkbox.checked = true;
            });

            const loanAmountInput = formModal.querySelector('#client-loan-amount');
            const interestInput = formModal.querySelector('#client-interest');
            const installmentsInput = formModal.querySelector('#client-installments');
            const totalToPayInput = formModal.querySelector('#client-total-to-pay');
            const installmentValueInput = formModal.querySelector('#client-installment-value');

            function calculateLoanDetails() {
                const loanAmount = parseFloat(loanAmountInput.value) || 0;
                const interest = parseFloat(interestInput.value) || 0;
                const installments = parseInt(installmentsInput.value) || 0;
                const totalToPay = loanAmount * (1 + (interest / 100));
                const installmentValue = installments > 0 ? totalToPay / installments : 0;
                totalToPayInput.value = money(totalToPay);
                installmentValueInput.value = money(installmentValue);
            }
            [loanAmountInput, interestInput, installmentsInput].forEach(input => input.addEventListener('input', calculateLoanDetails));
            calculateLoanDetails();
            
            formModal.querySelector('#closeClientForm').addEventListener('click', () => formModal.classList.remove('active'));
            
            formModal.querySelector('#saveClientBtn').addEventListener('click', async () => {
                 const loanAmount = parseFloat(loanAmountInput.value);
                 const interest = parseFloat(interestInput.value);
                 const installments = parseInt(installmentsInput.value);
                 const totalToPay = loanAmount * (1 + (interest / 100));
                 const installmentValue = installments > 0 ? totalToPay / installments : 0;
                 
                 const updatedData = {
                    name: document.getElementById('client-name').value,
                    address: document.getElementById('client-address').value,
                    whatsapp: document.getElementById('client-whatsapp').value,
                    phone: document.getElementById('client-phone').value,
                    collectorId: document.getElementById('client-collector').value,
                    totalLoan: totalToPay,
                    amount: installmentValue,
                    installments: `${client.installments.split('/')[0]}/${installments}`,
                    interestRate: interest,
                    paymentDays: Array.from(document.querySelectorAll('#clientFormModal .day-selector input:checked')).map(el => parseInt(el.value)),
                 };

                try {
                    await updateDoc(doc(db, 'companies', currentCompanyId, "clients", clientId), updatedData);
                    showToast(translations[currentLang].clientUpdated);
                    formModal.classList.remove('active');
                    document.getElementById('clientDetailModal').classList.remove('active');
                } catch(error) {
                    console.error("Error updating client:", error);
                    showToast("Error updating client.", true);
                }
            });

            formModal.querySelector('#deleteClientBtn').addEventListener('click', async () => {
                const deleteBtn = formModal.querySelector('#deleteClientBtn');
                if (deleteBtn.dataset.confirming !== 'true') {
                    deleteBtn.dataset.confirming = 'true';
                    deleteBtn.innerHTML = `<i data-lucide="alert-triangle"></i> ${translations[currentLang].delete}`;
                    lucide.createIcons({nodes: [deleteBtn.querySelector('i')]});
                    setTimeout(() => {
                        deleteBtn.dataset.confirming = 'false';
                        deleteBtn.innerHTML = `<i data-lucide="trash"></i> <span data-lang-key="deleteClient"></span>`;
                        applyLanguage(currentLang);
                        lucide.createIcons({nodes: [deleteBtn.querySelector('i')]});
                    }, 3000);
                    return;
                }

                try {
                    await deleteDoc(doc(db, 'companies', currentCompanyId, "clients", clientId));
                    showToast(translations[currentLang].clientDeleted);
                    formModal.classList.remove('active');
                    document.getElementById('clientDetailModal').classList.remove('active');
                    document.getElementById('collectorDetailView').classList.remove('active');
                } catch (error) {
                    console.error("Error deleting client: ", error);
                    showToast("Erro ao excluir cliente.", true);
                }
            });
        }



        function showCropperModal(file) {
            const cropperModal = document.getElementById('cropperModal');
            cropperModal.innerHTML = `
                <header class="modal-header">
                    <button id="closeCropperModal"><i data-lucide="x"></i></button>
                    <span class="modal-title">Recortar Imagem</span>
                </header>
                <div class="modal-content-wrapper">
                    <div id="cropper-container" class="container">
                        <img id="cropper-image">
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn-secondary" id="cancelCropBtn"><i data-lucide="x-circle"></i> Cancelar</button>
                    <button class="btn-primary" id="confirmCropBtn"><i data-lucide="check-circle"></i> Confirmar</button>
                </div>
            `;
            cropperModal.classList.add('active');
            lucide.createIcons({nodes: cropperModal.querySelectorAll('[data-lucide]')});

            const image = document.getElementById('cropper-image');
            const reader = new FileReader();
            let cropper;

            reader.onload = (e) => {
                image.src = e.target.result;
                cropper = new Cropper(image, { aspectRatio: 1, viewMode: 1, background: false });
            };
            reader.readAsDataURL(file);

            document.getElementById('closeCropperModal').addEventListener('click', () => cropperModal.classList.remove('active'));
            document.getElementById('cancelCropBtn').addEventListener('click', () => cropperModal.classList.remove('active'));
            document.getElementById('confirmCropBtn').addEventListener('click', () => {
                cropper.getCroppedCanvas({ width: 256, height: 256, imageSmoothingQuality: 'high' }).toBlob((blob) => {
                    handleProfilePictureChange(blob);
                    cropperModal.classList.remove('active');
                }, 'image/jpeg');
            });
        }

        async function handleProfilePictureChange(blob) {

        async function handleLogin(event) {
    event.preventDefault();
    
    // --- [INICIO: MODIFICACIÓN BOTÓN DE LOGIN] ---
    const loginForm = event.target;
    const loginButton = loginForm.querySelector('button[type="submit"]');
    let originalButtonHTML = '';

    if (loginButton) {
        originalButtonHTML = loginButton.innerHTML; // 1. Guardar HTML original
        loginButton.disabled = true; // 2. Deshabilitar

        // 3. Poner estado de carga (con spinner)
        // Usamos "Acessando..." para el texto de carga
        loginButton.innerHTML = `
            <span style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i data-lucide="loader-circle" style="animation: spin 1s linear infinite; width: 20px; height: 20px;"></i>
                Acessando...
            </span>`;
        
        // 4. Renderizar el nuevo ícono
        lucide.createIcons({ nodes: [loginButton.querySelector('i')] });
    }
    // --- [FIN: MODIFICACIÓN BOTÓN DE LOGIN] ---

    const email = document.getElementById('username').value; // Ahora es un email
    const pass = document.getElementById('password').value;

    try {
        // ¡AQUÍ ESTÁ LA MAGIA!
        // Intentamos iniciar sesión con Firebase Auth
        await signInWithEmailAndPassword(auth, email, pass);

        // No necesitamos llamar a showMainApp() aquí.
        // El 'listener' de onAuthStateChanged se encargará automáticamente.
        // El botón desaparecerá junto con la pantalla de login.

    } catch (error) {
        // Este es el catch correcto para el LOGIN
        console.error("Erro de login:", error.code);
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
            showToast('Email ou senha inválidos.', true);
        } else if (error.code === 'auth/invalid-email') {
            showToast('Formato de email inválido.', true);
        } else {
            showToast('Erro ao tentar fazer login.', true);
        }

        // --- [INICIO: RESTAURAR BOTÓN EN ERROR] ---
        // Si el login falla, restauramos el botón a su estado original
        if (loginButton) {
            loginButton.disabled = false;
            loginButton.innerHTML = originalButtonHTML; // Restaurar HTML original
        }
        // --- [FIN: RESTAURAR BOTÓN EN ERROR] ---
    }
}


        
        function init() {
    document.body.classList.add('dark-mode');

    // Lógica del Banner de Instalación PWA (se queda igual)
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBanner = document.getElementById('install-banner');
        if (installBanner) {
            installBanner.style.display = 'block';
            applyLanguage(currentLang); // Aplica el idioma al nuevo contenido
        }
    });
    const installBtn = document.getElementById('install-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
            }
        });
    }
    const closeInstallBtn = document.getElementById('close-install-banner');
    if (closeInstallBtn) {
        closeInstallBtn.addEventListener('click', () => {
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.style.display = 'none';
        });
    }

    // Lógica de Global Settings (se queda igual)
    

    // --- ¡AQUÍ ESTÁ EL GRAN CAMBIO! ---
    // Quitamos el setTimeout y usamos onAuthStateChanged.
    // Esto escucha si el usuario está logueado o no CADA VEZ que se carga la app.
    const splash = document.getElementById('splash-screen');

    
    onAuthStateChanged(auth, async (user) => {
    // Ocultamos el splash AHORA
    splash.style.opacity = '0';
    setTimeout(() => {
        splash.style.display = 'none';
    }, 500);

    if (user) {
        // ¡El usuario SÍ está logueado! (Es el admin)
        // Empezamos la verificación inteligente...

        // PASO 1 (TAREA 1): Verificar permisos (Custom Claims)
        try {
            console.log("Verificando permissões do admin...");
            // Pedimos los permisos "frescos" a Firebase
            const tokenResult = await user.getIdTokenResult(true); 
            const claims = tokenResult.claims;

            console.log("Claims (permissões) do usuário:", claims);

            // Verificamos si es un 'admin' y tiene un 'companyId'
            if (claims.role !== 'admin' || !claims.companyId) {
                const errorMsg = "Sua conta não tem permissões de administrador. Contate o suporte.";
                console.error(errorMsg, claims);
                showBlockedView(errorMsg); // Muestra pantalla de bloqueo
                await signOut(auth); // Deslogueamos al usuario no autorizado
                return; // Detenemos la ejecución
            }

            // ¡Éxito! Guardamos la "llave maestra"
            currentCompanyId = claims.companyId; 
            console.log("Admin verificado. Company ID:", currentCompanyId);

            // PASO 2 (TAREA 0): Verificar si la empresa está ACTIVA o SUSPENSA
            // Usamos la 'llave maestra' (currentCompanyId) para leer el documento de la empresa
            const companyRef = doc(db, 'companies', currentCompanyId);
            const companySnap = await getDoc(companyRef); // <-- Usamos la herramienta que importamos

            if (!companySnap.exists()) {
                const errorMsg = `Erro crítico: A empresa com ID (${currentCompanyId}) não foi encontrada no banco de dados.`;
                console.error(errorMsg);
                showBlockedView(errorMsg);
                await signOut(auth);
                return;
            }

            // Guardamos los datos de la empresa (nombre, logo, status)
            currentCompanyData = companySnap.data(); 

            // ¡LA COMPROBACIÓN DE ESTADO!
            if (currentCompanyData.status === 'suspended') {
                const errorMsg = `A conta da sua empresa (${currentCompanyData.name}) está suspensa. Entre em contato com o suporte para reativar seu serviço.`;
                console.warn(errorMsg);
                showBlockedView(errorMsg); // Muestra bloqueo
                // No cerramos sesión, solo bloqueamos la app.
                return;
            }

            // ¡TODAS LAS VERIFICACIONES PASARON!
            console.log(`Acesso concedido para: ${currentCompanyData.name} (Status: ${currentCompanyData.status})`);
            document.getElementById('login-view').style.display = 'none';

            globalSettings = currentCompanyData; 
            loadGlobalSettings(globalSettings); 
            updateSettingsForm(globalSettings);


            // Ahora llamamos a la app principal
            showMainApp(); 

        } catch (error) {
            console.error("Erro crítico durante a verificação de acesso:", error);
            showBlockedView(`Ocorreu um erro ao verificar sua conta: ${error.message}`);
            await signOut(auth);
        }

    } else {
        // El usuario NO está logueado (esto no cambia)
        // Mostramos la pantalla de login
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('login-view').style.display = 'flex';
        // Añadimos el listener para el formulario de login
        const loginForm = document.getElementById('login-form');
        if (loginForm) { // Comprobamos si existe antes de añadir
            loginForm.addEventListener('submit', handleLogin);
        }
    }
});


    // --- FIN DEL GRAN CAMBIO ---
}


        init();
    </script>
