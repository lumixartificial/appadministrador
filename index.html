            const photoUrl = collector?.profilePictureUrl || placeholderUrl;
            
            const date = settlement.date?.seconds ? new Date(settlement.date.seconds * 1000) : null;
            const dateString = date ? date.toLocaleDateString('pt-BR') : 'Data inválida';
            const timeString = date ? date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
            
            modal.innerHTML = `

                    ${settlement.notes ? `
                        <div class="kpi-card" style="margin-bottom: 20px;">
                            <h4 class="kpi-title">Observações do Cobrador</h4>
                            <p style="font-style: italic;">${settlement.notes}</p>

                            `<p class="no-items">Nenhum comprovante anexado.</p>`
                        }
                    </div>
                </div> 
                <div class="action-buttons"> 
                    <button id="reject-settlement-btn" class="btn-danger" style="flex-grow: 1;">
                        <i data-lucide="x-circle"></i> <span data-lang-key="delete"></span>
                    </button>
                    <button id="approve-settlement-btn" class="btn-primary" style="flex-grow: 1;">
                        <i data-lucide="check-circle"></i> Aprovar
                    </button>
                </div>
            `;
            
            modal.classList.add('active');
            lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });
            applyLanguage(currentLang);

            // --- Listeners de Ação ---
            modal.querySelector('#closeSettlementVerifyModal').addEventListener('click', () => modal.classList.remove('active'));

            const settlementRef = doc(db, 'companies', currentCompanyId, 'settlements', settlement.id);

            // Botão REJEITAR
            modal.querySelector('#reject-settlement-btn').addEventListener('click', async (e) => {
                e.currentTarget.disabled = true;
                try {
                    await updateDoc(settlementRef, { status: 'rejected' });
                    showToast('Liquidação Rejeitada.');
                    modal.classList.remove('active');
                } catch (error) {
                    showToast('Erro ao rejeitar: ' + error.message, true);
                    e.currentTarget.disabled = false;
                }
            });

            // Botão APROVAR
            modal.querySelector('#approve-settlement-btn').addEventListener('click', async (e) => {
                e.currentTarget.disabled = true;
                e.currentTarget.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Aprovando...`;
                lucide.createIcons({nodes: [e.currentTarget.querySelector('i')]});
                
                try {
                    // La única acción es aprobar el documento.
                    // El 'onSnapshot' de 'settlements' y 'checkAndRunGlobalUpdate'
                    // se encargarán automáticamente de recalcular la contabilidad.
                    await updateDoc(settlementRef, { status: 'approved' });
                    showToast('Liquidação APROVADA com sucesso!');
                    modal.classList.remove('active');
                } catch (error) {
                    showToast('Erro ao aprovar: ' + error.message, true);
                    e.currentTarget.disabled = false;
                    e.currentTarget.innerHTML = `<i data-lucide="check-circle"></i> Aprovar`;
                    lucide.createIcons({nodes: [e.currentTarget.querySelector('i')]});
                }
            });
        }

        async function handleDeleteCollector(collectorId, collectorName) {
            const modal = document.getElementById('collectorFormModal');
            const detailView = document.getElementById('collectorDetailView');
            
            // 1. Mostrar confirmación
            const confirmed = await showConfirmationModal(
                'Eliminar Cobrador?',
                `¡ATENCIÓN! Estás a punto de eliminar permanentemente a ${collectorName} (${collectorId}). ESTA ACCIÓN TAMBIÉN ELIMINARÁ A TODOS LOS CLIENTES Y DATOS asociados a este cobrador. Esta acción no se puede deshacer.`,
                'Sim, Eliminar Permanentemente',
                'btn-danger'
            );

            if (!confirmed) {
                console.log("Eliminación cancelada por el usuario.");
                return;
            }

            // 2. Mostrar estado de carga (reutilizando el modal de overlay)
            const overlay = document.getElementById('reportOptionsModal');
            overlay.innerHTML = `
                <div class="modal-content" style="max-width: 350px; text-align: center;">
                    <i data-lucide="loader-circle" style="width: 48px; height: 48px; animation: spin 1s linear infinite; margin-bottom: 15px; color: var(--danger-color);"></i>
                    <h3 style="font-size: 1.25em; font-weight: 600;">Eliminando Cobrador...</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 0;">Por favor espere, esto puede tardar un momento...</p>
                </div>
            `;
            lucide.createIcons({ nodes: overlay.querySelectorAll('[data-lucide]') });
            overlay.classList.add('active');

            try {
                // 3. Eliminar todos los clientes de este cobrador
                console.log(`Buscando clientes para eliminar del cobrador: ${collectorId}`);
                const clientsQuery = query(
                    collection(db, 'companies', currentCompanyId, 'clients'),
                    where('collectorId', '==', collectorId)
                );
                
                const clientsSnapshot = await getDocs(clientsQuery);
                const deleteClientPromises = [];
                
                clientsSnapshot.forEach(clientDoc => {
                    console.log(`Añadiendo cliente a la cola de eliminación: ${clientDoc.id}`);
                    deleteClientPromises.push(deleteDoc(doc(db, 'companies', currentCompanyId, 'clients', clientDoc.id)));
                });

                if (deleteClientPromises.length > 0) {
                    await Promise.all(deleteClientPromises);
                    console.log(`${deleteClientPromises.length} clientes eliminados.`);
                } else {
                    console.log("No se encontraron clientes para este cobrador.");
                }

                // 4. Eliminar el documento principal del cobrador
                console.log(`Eliminando documento principal del cobrador: ${collectorId}`);
                const collectorRef = doc(db, 'collectors', collectorId);
                await deleteDoc(collectorRef);
                
                // NOTA: La cuenta de autenticación (Auth) de Firebase no se elimina
                // desde el cliente. Esto requiere una Cloud Function.
                // El 'auth user' quedará huérfano.

                console.log("¡Eliminación completada!");
                showToast('Cobrador e todos os seus clientes foram eliminados com sucesso.');

                // 5. Cerrar todos los modales
                overlay.classList.remove('active');
                if (modal) modal.classList.remove('active');
                if (detailView) detailView.classList.remove('active');
                
                // El onSnapshot de 'allCollectors' se actualizará automáticamente.

            } catch (error) {
                console.error("Erro catastrófico ao eliminar cobrador:", error);
                showToast('Erro ao eliminar o cobrador. Verifique o console.', true);
                overlay.classList.remove('active');
            }
        }

                                collectorId: clientData.collectorId,
                                collectorName: "Sistema (Lixeira)",
                                amount: impactoNeto,
                                notes: noteText,
                                date: serverTimestamp(),
                                adminId: auth.currentUser ? auth.currentUser.uid : 'admin',
                                status: 'approved'
                            });
                        } else if (impactoNeto < 0) {
                            // El cliente dio pérdidas. Metemos un Gasto para que la caja no suba sola.
                            await addDoc(collection(db, 'companies', currentCompanyId, 'expenses'), {
                                collectorId: clientData.collectorId,
                                category: 'other',
                                value: Math.abs(impactoNeto),
                                description: noteText,
                                date: serverTimestamp()
                            });
                        }
                        // --- FIN DEL CÓDIGO A PEGAR ---
                        await setDoc(doc(db, 'companies', currentCompanyId, "deletedClients", clientId), {
                            ...clientData,
                            deletedAt: serverTimestamp(),
                            deletedBy: auth.currentUser ? auth.currentUser.uid : 'admin'
                        });
                    }
                    
                    // Eliminamos de la colección activa
                    await deleteDoc(doc(db, 'companies', currentCompanyId, "clients", clientId));
                    
                    showToast(translations[currentLang].clientDeleted);
                    formModal.classList.remove('active');
                    document.getElementById('clientDetailModal').classList.remove('active');
                    // Mantenemos la vista del cobrador abierta
                } catch (error) {
                    console.error("Error deleting client: ", error);
                    showToast("Erro ao excluir cliente.", true);
                }
            });
        }

            profileImageView.src = localUrl;

    try {
        // ¡AQUÍ ESTÁ LA MAGIA!
        // Intentamos iniciar sesión con Firebase Auth
        await signInWithEmailAndPassword(auth, email, pass);

        // No necesitamos llamar a showMainApp() aquí.
        // El 'listener' de onAuthStateChanged se encargará automáticamente.

    } catch (error) {
        // Este es el catch correcto para el LOGIN
        console.error("Erro de login:", error.code);
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
            showToast('Email ou senha inválidos.', true);
        } else if (error.code === 'auth/invalid-email') {
            showToast('Formato de email inválido.', true);
        } else {
            showToast('Erro ao tentar fazer login.', true);
        }

        // --- [INICIO: RESTAURAR BOTÓN EN ERROR] ---

        if (loginButton) {

            loginButton.innerHTML = originalButtonHTML; // Restaurar HTML original
        }

    }

                function init() {
            document.body.classList.add('dark-mode');
            
            // APLICAR IDIOMA INMEDIATAMENTE PARA EL LOGIN
            applyLanguage(currentLang);

            // Lógica del Banner de Instalación PWA
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBanner = document.getElementById('install-banner');
                if (installBanner) {
                    installBanner.style.display = 'block';
                    applyLanguage(currentLang); 
                }
            });
            const installBtn = document.getElementById('install-btn');
            if (installBtn) {
                installBtn.addEventListener('click', async () => {
                    const installBanner = document.getElementById('install-banner');
                    if (installBanner) installBanner.style.display = 'none';
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        console.log(`User response to the install prompt: ${outcome}`);
                        deferredPrompt = null;
                    }
                });
            }
            const closeInstallBtn = document.getElementById('close-install-banner');
            if (closeInstallBtn) {
                closeInstallBtn.addEventListener('click', () => {
                    const installBanner = document.getElementById('install-banner');
                    if (installBanner) installBanner.style.display = 'none';
                });
            }

            const splash = document.getElementById('splash-screen');

            onAuthStateChanged(auth, async (user) => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);

                if (user) {
                    try {
                        console.log("Verificando permissões do admin...");
                        const tokenResult = await user.getIdTokenResult(true); 
                        const claims = tokenResult.claims;

                        console.log("Claims (permissões) do usuário:", claims);

                        if (claims.role !== 'admin' || !claims.companyId) {
                            const errorMsg = "Sua conta não tem permissões de administrador. Contate o suporte.";
                            console.error(errorMsg, claims);
                            showBlockedView(errorMsg); 
                            await signOut(auth); 
                            return; 
                        }

                        currentCompanyId = claims.companyId; 
                        console.log("Admin verificado. Company ID:", currentCompanyId);

                        const companyRef = doc(db, 'companies', currentCompanyId);
                        const companySnap = await getDoc(companyRef); 

                        if (!companySnap.exists()) {
                            const errorMsg = `Erro crítico: A empresa com ID (${currentCompanyId}) não foi encontrada no banco de dados.`;
                            console.error(errorMsg);
                            showBlockedView(errorMsg);
                            await signOut(auth);
                            return;
                        }

                        currentCompanyData = companySnap.data(); 

                        if (currentCompanyData.status === 'suspended') {
                            const errorMsg = `A conta da sua empresa (${currentCompanyData.name}) está suspensa. Entre em contato com o suporte para reativar seu serviço.`;
                            console.warn(errorMsg);
                            showBlockedView(errorMsg); 
                            return;
                        }

                        console.log(`Acesso concedido para: ${currentCompanyData.name} (Status: ${currentCompanyData.status})`);
                        document.getElementById('login-view').style.display = 'none';

                        globalSettings = currentCompanyData; 
                        loadGlobalSettings(globalSettings); 
                        updateSettingsForm(globalSettings);

                        showMainApp(); 

                    } catch (error) {
                        console.error("Erro crítico durante a verificação de acesso:", error);
                        showBlockedView(`Ocorreu um erro ao verificar sua conta: ${error.message}`);
                        await signOut(auth);
                    }

                } else {
                    document.getElementById('app-container').style.display = 'none';
                    document.getElementById('login-view').style.display = 'flex';
                    const loginForm = document.getElementById('login-form');
                    if (loginForm) { 
                        loginForm.addEventListener('submit', handleLogin);
                    }
                }
            });
        }

        // --- HACER FUNCIONES ACCESIBLES DESDE EL MAPA ---
        window.showClientDetails = showClientDetails;
        window.showCollectorDetails = showCollectorDetails;
        // === NUEVA FUNCIÓN PARA EDITAR GASTOS ===

            const t = translations[currentLang];
            modal.classList.add('active');

            modal.innerHTML = `
                <div class="modal-content" style="max-width: 400px;">
                    <button class="close-modal-btn" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; color: var(--text-secondary);">&times;</button>

                </div>
            `;

            // Listeners
            const close = () => modal.classList.remove('active');
            modal.querySelector('.close-modal-btn').addEventListener('click', close);
            modal.querySelector('#cancel-edit-exp').addEventListener('click', close);

            modal.querySelector('#save-edit-exp').addEventListener('click', async (e) => {
                const newVal = parseFloat(document.getElementById('edit-expense-val').value);

                if (isNaN(newVal) || newVal <= 0) {
                    showToast('Valor inválido.', true);
                    return;
                }

                e.currentTarget.disabled = true;
                e.currentTarget.innerHTML = '...';

                try {
                    // Actualizar en Firebase
                    const expenseRef = doc(db, 'companies', currentCompanyId, 'expenses', expenseId);
                    await updateDoc(expenseRef, {
                        value: newVal,
                        description: newDesc,
                        // Opcional: registrar quién editó y cuándo
                        lastEditedBy: auth.currentUser.uid,
                        lastEditedAt: serverTimestamp()
                    });

                    showToast('Gasto atualizado com sucesso!', 'success');
                    close();
                    // La vista se actualizará sola gracias a los listeners en tiempo real
                } catch (error) {
                    console.error("Error updating expense:", error);

                    e.currentTarget.disabled = false;
                    e.currentTarget.innerHTML = t.saveChanges;

        };
        // === NUEVA FUNCIÓN: MODAL DE PAPELERA ===
        async function showTrashModal(collectorId) {
            const modal = document.getElementById('reportOptionsModal'); // Reutilizamos este modal base
            const t = translations[currentLang];
            modal.classList.add('active');

            modal.innerHTML = `
                <div class="modal-content" style="max-width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
                    <header class="modal-header" style="padding: 0 0 15px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="margin: 0; display: flex; align-items: center; gap: 8px;"><i data-lucide="trash-2" style="color: var(--danger-color);"></i> <span data-lang-key="trashTitle">${t.trashTitle || 'Papelera'}</span></h3>
                        <button class="close-modal-btn" style="background: none; border: none; font-size: 24px; color: var(--text-secondary); cursor: pointer;">&times;</button>
                    </header>
                    
                    <div id="trash-list-container" style="flex-grow: 1; overflow-y: auto; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                        <div style="text-align: center; padding: 20px; color: var(--text-secondary);">
                            <i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Carregando...
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons({nodes: modal.querySelectorAll('[data-lucide]')});

            modal.querySelector('.close-modal-btn').addEventListener('click', () => modal.classList.remove('active'));

            const container = modal.querySelector('#trash-list-container');

            try {
                // Obtener clientes eliminados
                const trashQuery = query(collection(db, 'companies', currentCompanyId, 'deletedClients'), where('collectorId', '==', collectorId));
                const snapshot = await getDocs(trashQuery);
                
                if (snapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-secondary); margin-top: 20px;">${t.emptyTrash || 'A lixeira está vazia.'}</p>`;
                    return;
                }

                let html = '';
                snapshot.forEach(docSnap => {
                    const client = docSnap.data();
                    html += `
                    <div class="client-card" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background-color: var(--bg); border: 1px solid var(--border-color); border-left: 4px solid var(--danger-color);">
                        <div>
                            <strong style="font-size: 0.95em; color: var(--text-primary); display: block;">${client.name}</strong>
                            <span style="font-size: 0.8em; color: var(--text-secondary);"><i data-lucide="phone" style="width: 12px; height: 12px;"></i> ${client.phone || client.whatsapp || 'N/A'}</span>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="restore-client-btn" data-id="${docSnap.id}" style="background: var(--surface); border: 1px solid var(--accent-green); color: var(--accent-green); border-radius: 6px; padding: 6px; cursor: pointer;" title="${t.restoreBtn || 'Restaurar'}">
                                <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
                            </button>
                            <button class="perm-delete-client-btn" data-id="${docSnap.id}" style="background: var(--danger-color); border: none; color: white; border-radius: 6px; padding: 6px; cursor: pointer;" title="${t.permDeleteBtn || 'Excluir Definitivo'}">
                                <i data-lucide="trash" style="width: 16px; height: 16px;"></i>
                            </button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
                lucide.createIcons({nodes: container.querySelectorAll('[data-lucide]')});

                // Listeners de Restaurar
                container.querySelectorAll('.restore-client-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.dataset.id;
                        btn.disabled = true;
                        
                        try {
                            const deletedRef = doc(db, 'companies', currentCompanyId, 'deletedClients', id);
                            const snap = await getDoc(deletedRef);
                            
                            if(snap.exists()) {
                                const data = snap.data();
                                const clientName = data.name; 
                                const clientCollector = data.collectorId; // Usamos el ID del cobrador para no cruzar datos
                                
                                // 1. Restaurar al cliente a la lista activa
                                delete data.deletedAt; 
                                delete data.deletedBy;
                                await setDoc(doc(db, 'companies', currentCompanyId, 'clients', id), data);
                                await deleteDoc(deletedRef);
                                
                                // --- INICIO: REVERSIÓN AUTOMÁTICA DE CAJA (SUPER BLINDADA) ---
                                const searchName = clientName.toLowerCase().trim();
                                
                                // A) Buscar y borrar Aportes inyectados (Ignora mayúsculas y textos viejos)
                                const injQuery = query(collection(db, 'companies', currentCompanyId, 'capitalInjections'));
                                const injSnap = await getDocs(injQuery);
                                for (const docSnap of injSnap.docs) {
                                    const notes = (docSnap.data().notes || '').toLowerCase();
                                    if (notes.includes("ajuste") && notes.includes(searchName)) {
                                        await deleteDoc(doc(db, 'companies', currentCompanyId, 'capitalInjections', docSnap.id));
                                    }
                                }

                                // B) Buscar y borrar Gastos generados (Pérdidas)
                                const expQuery = query(collection(db, 'companies', currentCompanyId, 'expenses'));
                                const expSnap = await getDocs(expQuery);
                                for (const docSnap of expSnap.docs) {
                                    const desc = (docSnap.data().description || '').toLowerCase();
                                    if (desc.includes("ajuste") && desc.includes(searchName)) {
                                        await deleteDoc(doc(db, 'companies', currentCompanyId, 'expenses', docSnap.id));
                                    }
                                }
                                // --- FIN: REVERSIÓN AUTOMÁTICA DE CAJA ---

                                showToast(t.clientRestored || 'Cliente restaurado e caixa balanceada!', 'success');
                                showTrashModal(collectorId); // Refrescar pantalla
                            }
                        } catch(err) {
                            console.error(err); 
                            showToast('Erro ao restaurar.', true);
                            btn.disabled = false;
                        }
                    });
                });

                // Listeners de Eliminar Definitivo
                container.querySelectorAll('.perm-delete-client-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.dataset.id;
                        const confirmed = await showConfirmationModal(
                            t.permDeleteBtn || 'Excluir Definitivo', 
                            'Esta ação NÃO PODE ser desfeita. O histórico deste cliente será perdido para sempre.', 
                            'Excluir', 'btn-danger'
                        );
                        if (!confirmed) return;
                        
                        showTrashModal(collectorId); // Reabrir papelera tras confirmar

                        try {
                            await deleteDoc(doc(db, 'companies', currentCompanyId, 'deletedClients', id));
                            showToast('Cliente excluído permanentemente.');
                            showTrashModal(collectorId);
                        } catch(err) {
                            console.error(err); showToast('Erro ao excluir.', true);
                        }
                    });
                });

            } catch (error) {
                console.error("Erro ao abrir lixeira:", error);
                container.innerHTML = `<p style="text-align: center; color: var(--danger-color); margin-top: 20px;">Erro ao carregar dados.</p>`;
            }
        }

async function generateDelinquencyPDF(collectorId) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const collector = allCollectors.find(c => c.id === collectorId);
    const clients = allClients.filter(c => c.collectorId === collectorId);
    const t = translations[currentLang];

    let totalCriticalDebt = 0;
    let lateClientsData = [];

    clients.forEach(client => {
        (client.loans || []).forEach(loan => {
            const details = calculateLoanDetails(loan);
            if (details.status !== 'finished' && details.lateDays > 0) {
                // Cálculo de deuda pendiente real
                const paid = (loan.history || []).filter(h => h.status !== 'rejected').reduce((s, h) => s + (h.amount || 0), 0) + (loan.initialMigratedAmount || 0);
                const totalWithFees = (loan.totalLoan || 0) + (details.lateFeesAccumulated || 0);
                const balance = Math.max(0, totalWithFees - paid);

                lateClientsData.push({
                    name: client.name,
                    days: details.lateDays,
                    balance: balance,
                    installment: loan.originalInstallmentAmount
                });

                // Suma especial para los de 5 días o más
                if (details.lateDays >= 5) {
                    totalCriticalDebt += balance;
                }
            }
        });
    });

    // --- Diseño del PDF ---
    doc.setFontSize(18);
    doc.text(t.delinquencyReport.toUpperCase(), 105, 20, { align: 'center' });
    doc.setFontSize(12);
    doc.text(`Cobrador: ${collector.name}`, 105, 28, { align: 'center' });

    // Tarjeta de Resumen Crítico
    doc.setDrawColor(239, 68, 68); // Rojo
    doc.setLineWidth(0.5);
    doc.rect(20, 35, 170, 20);
    doc.setFont(undefined, 'bold');
    doc.text(t.criticalLateDebt, 25, 47);
    doc.text(money(totalCriticalDebt), 185, 47, { align: 'right' });

    // Tabla de Clientes
    const tableBody = lateClientsData.sort((a,b) => b.days - a.days).map(c => [
        c.name,
        `${c.days} d`,
        money(c.installment),
        money(c.balance)
    ]);

    doc.autoTable({
        startY: 60,
        head: [['Cliente', 'Atraso', 'Cuota', 'Saldo Total']],
        body: tableBody,
        theme: 'striped',
        headStyles: { fillStyle: '#1e293b' }
    });

    doc.save(`Morosidad_${collector.name}.pdf`);
    showToast('Reporte generado!');
}
