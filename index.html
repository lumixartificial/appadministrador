                                <div style="display: flex; justify-content: space-between; border-top: 1px dashed #e2e8f0; padding-top: 2px; margin-top: 1px;">
                                    <span style="font-weight: 600;">Resta:</span> <strong style="color: #ef4444;">${money(remaining)}</strong>
                                </div>
                            </div>
                        `;
                    }

                    // POPUP COMPACTO BLANCO
                    const popupContent = `
                        <div style="font-family: 'Inter', sans-serif; min-width: 170px; background-color: #ffffff; color: #1e293b; padding: 2px; border-radius: 8px;">
                            <!-- CABECERA: NOMBRE (Izq) - ESTADO + X (Der) -->
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">
                                <strong style="font-size: 0.95em; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;" title="${client.name}">${client.name}</strong>
                                
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="background-color: ${statusColor}; color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.65em; font-weight: 700; text-transform: uppercase;">
                                        ${statusLabel}
                                    </span>
                                    <button onclick="mapInstance.closePopup()" style="background:none; border:none; color:#94a3b8; font-size: 1.4em; cursor:pointer; line-height: 0.8; padding: 0;">&times;</button>
                                </div>
                            </div>

                            ${financialInfoHtml}

                            <!-- BOTÓN VER FICHA -->
                            <button onclick="window.showClientDetails('${client.id}')" style="margin-top: 8px; width: 100%; background-color: #3b82f6; color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.8em;">
                                Ver Ficha
                            </button>
                        </div>
                    `;

                    if (cMarker) {
                        cMarker.setLatLng([lat, lng]);
                        cMarker.getPopup().setContent(popupContent);
                    } else {
                        const newMarker = L.marker([lat, lng], { icon: clientIcon })
                            .addTo(mapInstance)
                            .bindPopup(popupContent, { closeButton: false, offset: [0, -25] }); // Quitamos la X por defecto
                        window.clientMarkers[client.id] = newMarker;
                    }
                } else {
                    if (cMarker) {
                        cMarker.remove();
                        delete window.clientMarkers[client.id];
                    }
                }
            });

            lucide.createIcons();
            applyLanguage(currentLang);
        }

        function focusOnCollector(collectorId) {
            const collector = allCollectors.find(c => c.id === collectorId);
            
            // 1. Validamos si el cobrador tiene datos GPS reales
            if (!collector || !collector.lastLocation || !collector.lastLocation.latitude || !collector.lastLocation.longitude) {
                showToast("Localização GPS não disponível para este cobrador.", true);
                return;
            }

            const { latitude, longitude } = collector.lastLocation;

            // 2. Forzamos el cambio a la vista 'Mapa' para asegurar que el contenedor sea visible
            showView('map');

            // 3. Usamos un pequeño retraso para asegurar que el DOM del mapa esté listo
            setTimeout(() => {
                // Si el mapa no existe, lo iniciamos. Si existe, ajustamos su tamaño.
                if (!mapInstance) {
                    initMap();
                } else {
                    mapInstance.invalidateSize();
                }

                // 4. Volamos a la ubicación
                mapInstance.setView([latitude, longitude], 16);

                // 5. Intentamos abrir el popup del marcador
                const marker = collectorMarkers[collectorId];
                if (marker) {
                    marker.openPopup();
                } else {
                    // Si el marcador no está dibujado aún, forzamos una actualización
                    updateCollectorMarkers();
                    // Re-intentamos abrir el popup brevemente después
                    setTimeout(() => {
                        if (collectorMarkers[collectorId]) collectorMarkers[collectorId].openPopup();
                    }, 200);
                }
            }, 300); // Retraso técnico necesario para la transición
        }

        
        function updateReportsView() {
            const collectorFilter = document.getElementById('report-collector-filter');
            const dateStartInput = document.getElementById('report-date-start');
            const dateEndInput = document.getElementById('report-date-end');
            const resultsContainer = document.getElementById('report-results');
            const generateBtn = document.getElementById('report-generate-btn');

            if (!collectorFilter || !dateStartInput || !dateEndInput || !resultsContainer || !generateBtn) return;

            const t = translations[currentLang];

            // 1. Configurar Filtros
            const currentSelectedCollector = collectorFilter.value;
            if (collectorFilter.options.length <= 1) {
                collectorFilter.innerHTML = `<option value="all">${t.all}</option>` + allCollectors.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                collectorFilter.value = currentSelectedCollector || 'all';
            }

            // Fechas por defecto
            const today = new Date();
            const beginningOfTime = '2023-01-01'; 

            if (!dateStartInput.value) dateStartInput.value = beginningOfTime;
            if (!dateEndInput.value) dateEndInput.value = today.toISOString().split('T')[0];

            resultsContainer.innerHTML = `<div class="loading" style="padding: 80px; text-align: center;"><i data-lucide="aperture" style="animation: spin 3s linear infinite; width: 60px; height: 60px; color: #00f2ff;"></i><p style="margin-top:20px; color: #00f2ff; font-family: monospace; letter-spacing: 3px; font-size: 1.2em;">${t.calculatingFlow}</p></div>`;
            lucide.createIcons({nodes: resultsContainer.querySelectorAll('[data-lucide]')});
            generateBtn.disabled = true;

            const selectedCollectorId = collectorFilter.value;
            
            const startParts = dateStartInput.value.split('-');
            const endParts = dateEndInput.value.split('-');
            
            const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2], 0, 0, 0, 0);
            const endDate = new Date(endParts[0], endParts[1] - 1, endParts[2], 23, 59, 59, 999);

            // 2. Filtrado de Datos
            const filteredPayments = [];
            const filteredNewLoans = [];
            let valInitial = 0;

            // A. Capital Inicial
            allCollectors.forEach(c => {
                if (selectedCollectorId === 'all' || c.id === selectedCollectorId) {
                    const initCap = (c.startingCapitalOnHand !== undefined) ? Number(c.startingCapitalOnHand) : (Number(c.startingCapital) || 0);
                    valInitial += initCap;
                }
            });

            // B. Clientes (Pagos y Préstamos)
            allClients.forEach(client => {
                if (selectedCollectorId === 'all' || client.collectorId === selectedCollectorId) {
                    (client.loans || []).forEach((loan) => {
                        // Pagos
                        (loan.history || []).forEach(h => {
                            if (h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                                let pd = new Date(); 
                                if (h.date && h.date.seconds) {
                                    pd = new Date(h.date.seconds * 1000);
                                }
                                if (pd >= startDate && pd <= endDate) {
                                    filteredPayments.push({ ...h, clientName: client.name });
                                }
                            }
                        });
                        
                        // Préstamos Nuevos
                        let ld = new Date();
                        const hasValidDate = loan.startDate && loan.startDate.seconds;
                        if (hasValidDate) {
                            ld = new Date(loan.startDate.seconds * 1000);
                        }
                        
                        if ((hasValidDate || !loan.migrationDate) && ld >= startDate && ld <= endDate && !loan.migrationDate) {
                        filteredNewLoans.push({ ...loan, clientName: client.name, clientInterest: client.interestRate });
                        }
                    });
                }
            });

            // C. Gastos
            const filteredExpenses = allExpenses.filter(e => {
                if (selectedCollectorId !== 'all' && e.collectorId !== selectedCollectorId) return false;
                let d = e.date && e.date.seconds ? new Date(e.date.seconds * 1000) : new Date();
                return d >= startDate && d <= endDate;
            });

            // D. Aportes
            const filteredInjections = allCapitalInjections.filter(i => {
                if (selectedCollectorId !== 'all' && i.collectorId !== selectedCollectorId) return false;
                if (i.status !== 'approved') return false;
                let d = i.date && i.date.seconds ? new Date(i.date.seconds * 1000) : new Date();
                return d >= startDate && d <= endDate;
            });

            // E. Retiros (TODOS)
            const filteredSettlements = allSettlements.filter(s => {
                if (selectedCollectorId !== 'all' && s.collectorId !== selectedCollectorId) return false;
                if (s.status === 'rejected') return false;
                let d = s.date && s.date.seconds ? new Date(s.date.seconds * 1000) : new Date();
                return d >= startDate && d <= endDate;
            });

            // --- SEPARACIÓN DE RETIROS (Capital vs Seguro) ---
            const settlementsInsurance = filteredSettlements.filter(s => s.type === 'insurance');
            const settlementsCapital = filteredSettlements.filter(s => s.type !== 'insurance');

            // 3. Cálculos
            const valCollected = filteredPayments.reduce((s, i) => s + (Number(i.amount)||0), 0);
            const valInjected = filteredInjections.reduce((s, i) => s + (Number(i.amount)||0), 0);
            
            const valDeployed = filteredNewLoans.reduce((s, l) => {
                let principal = Number(l.principalAmount);
                if (!principal && l.totalLoan) {
                     const rate = Number(l.clientInterest) || 20;
                     principal = Number(l.totalLoan) / (1 + (rate / 100)); 
                }
                return s + (principal || 0);
            }, 0);

            // Seguro Recaudado
            const valMicroInsurance = filteredNewLoans.reduce((s, l) => s + (Number(l.microInsurance) || 0), 0);
            // Intereses Generados (NUEVO)
            const valInterestGenerated = filteredNewLoans.reduce((s, l) => {
                let principal = Number(l.principalAmount);
                if (!principal && l.totalLoan) {
                     const rate = Number(l.clientInterest) || 20;
                     principal = Number(l.totalLoan) / (1 + (rate / 100)); 
                }
                const total = Number(l.totalLoan) || 0;
                const interest = total - principal;
                return s + (interest > 0 ? interest : 0);
            }, 0);

            // Retiros separados
            const valSettledCapital = settlementsCapital.reduce((s, i) => s + (Number(i.amount)||0), 0);
            const valSettledInsurance = settlementsInsurance.reduce((s, i) => s + (Number(i.amount)||0), 0);
            
            // CORRECCIÓN: Definimos 'valSettledTotal'
            const valSettledTotal = valSettledCapital + valSettledInsurance;

            const expensesByCategory = {};
            let valExpensesTotal = 0;
            filteredExpenses.forEach(e => {
                const cat = e.category || 'other';
                const val = Number(e.value) || 0;
                expensesByCategory[cat] = (expensesByCategory[cat] || 0) + val;
                valExpensesTotal += val;
            });

            const valInflows = valCollected + valInjected;
            const totalInflow = valInitial + valInflows;
            
            // Balance Final EXACTO a la Caja (Aísla el seguro y usa solo retiros de capital)
            const totalOutflow = valExpensesTotal + valDeployed + valSettledCapital;
            const netBalance = totalInflow - totalOutflow;

            // 4. Preparar Datos Gráfico
            const chartLabels = [];
            const chartData = [];
            const chartColors = [];
            
            const neonColors = {
                'initial': '#94a3b8', 'inflows': '#00ff9d', 'salary': '#facc15', 'fuel': '#f97316', 'rent': '#ec4899',
                'mechanics': '#ef4444', 'food': '#8b5cf6', 'other': '#64748b', 'loans': '#00f2ff',
                'settlements': '#a855f7', 'settlements_insurance': '#0ea5e9', 'balance': '#3b82f6', 
                'microInsurance': '#0ea5e9'
            };

            if (valInitial > 0) { chartLabels.push(t.initialCapitalLabel.toUpperCase()); chartData.push(valInitial); chartColors.push(neonColors['initial']); }
            if (valInflows > 0) { chartLabels.push(t.inflowLabel.toUpperCase()); chartData.push(valInflows); chartColors.push(neonColors['inflows']); }
            
            // Entrada Seguro
            if (valMicroInsurance > 0) { 
                chartLabels.push(t.microInsurance.toUpperCase()); 
                chartData.push(valMicroInsurance); 
                chartColors.push(neonColors['microInsurance']); 
            }

            Object.keys(expensesByCategory).forEach(cat => {
                if (expensesByCategory[cat] > 0) {
                    chartLabels.push((t[cat] || cat).toUpperCase());
                    chartData.push(expensesByCategory[cat]);
                    chartColors.push(neonColors[cat] || '#ffffff');
                }
            });
            if (valDeployed > 0) { chartLabels.push(t.newLoans.toUpperCase()); chartData.push(valDeployed); chartColors.push(neonColors['loans']); }
            
            // Salida Retiros (Capital)
            if (valSettledCapital > 0) { 
                chartLabels.push("RETIRADAS (CAPITAL)"); 
                chartData.push(valSettledCapital); 
                chartColors.push(neonColors['settlements']); 
            }
            // Salida Retiros (Seguro)
            if (valSettledInsurance > 0) { 
                chartLabels.push("RETIRADAS (SEGURO)"); 
                chartData.push(valSettledInsurance); 
                chartColors.push(neonColors['settlements_insurance']); 
            }

            if (netBalance > 0) { chartLabels.push(t.cashBalance.toUpperCase()); chartData.push(netBalance); chartColors.push(neonColors['balance']); }

            if (chartData.length === 0) { chartLabels.push(t.noData); chartData.push(1); chartColors.push('#1e293b'); }

            let diagColor = netBalance >= 0 ? "#00ff9d" : "#ff0055";
            let diagTitle = netBalance >= 0 ? t.diagProfitTitle : t.diagDeficitTitle;
            let balanceText = netBalance >= 0 ? t.netBalancePos : t.netBalanceNeg;
            let balanceValueColor = netBalance >= 0 ? "#00ff9d" : "#ff0055"; 

            let diagMsg = "";
            if (netBalance >= 0) {
                diagMsg = t.diagProfitMsg;
            } else {
                 if (valDeployed > valCollected) {
                    diagTitle = t.diagExpansionTitle;
                    diagMsg = t.diagExpansionMsg;
                    diagColor = "#bd00ff";
                 } else if (valExpensesTotal > (valCollected * 0.4)) {
                    diagTitle = t.diagAlertTitle;
                    diagMsg = t.diagAlertMsg;
                    diagColor = "#ff0055";
                 } else {
                    diagTitle = t.diagDeficitTitle;
                    diagMsg = t.diagDeficitMsg;
                    diagColor = "#ffae00";
                 }
            }

            let maxExpenseEntry = Object.entries(expensesByCategory).sort((a,b) => b[1]-a[1])[0];
            let maxExpenseMsg = maxExpenseEntry && maxExpenseEntry[1] > 0 
                ? `${t.maxExpenseLabel} ${(t[maxExpenseEntry[0]] || maxExpenseEntry[0]).toUpperCase()} (${money(maxExpenseEntry[1])})` 
                : t.noSignificantExpense;

            resultsContainer.innerHTML = `
                <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                    <button id="download-graphic-pdf-btn" class="btn-secondary" style="background-color: var(--surface); color: var(--accent-blue); border-color: var(--accent-blue); padding: 8px 16px; font-size: 0.9em; display: flex; align-items: center; gap: 8px;">
                        <i data-lucide="file-down"></i> ${t.downloadGraphicPDF}
                    </button>
                </div>

                <div style="
                    background: linear-gradient(135deg, #020617 0%, #0f172a 100%); 
                    border: 1px solid #1e293b; 
                    border-radius: 24px; 
                    padding: 30px; 
                    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 40px;
                    position: relative;
                    overflow: hidden;
                ">
                    <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: ${diagColor}; filter: blur(150px); opacity: 0.15; pointer-events: none;"></div>

                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
                        <div style="margin-bottom: 20px; color: #64748b; font-size: 0.8em; letter-spacing: 2px; font-weight: 700; text-align: center; width: 100%;">
                            ${t.distributionTitle}
                        </div>

                        <div style="position: relative; height: 320px; width: 320px;">
                            <canvas id="ultra-chart"></canvas>
                            <div style="
                                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                                text-align: center; width: 165px; height: 165px; border-radius: 50%;
                                display: flex; flex-direction: column; justify-content: center;
                                background: radial-gradient(circle, rgba(2,6,23,0.95) 0%, rgba(15,23,42,0.9) 100%);
                                border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(0,0,0,0.5);
                                pointer-events: none; z-index: 5;
                            ">
                                <p style="font-size: 0.65em; color: #94a3b8; margin: 0; letter-spacing: 1px;">${t.capitalGiro}</p>
                                <p style="font-size: 1.05em; color: #fff; font-weight: 700; margin: 2px 0;">${money(totalInflow + valMicroInsurance)}</p>
                                <div style="width: 80%; height: 1px; background: #334155; margin: 6px auto;"></div>
                                <p style="font-size: 0.65em; color: #94a3b8; margin: 0; letter-spacing: 1px;">${t.totalOutflow}</p>
                                <p style="font-size: 1.05em; color: #ef4444; font-weight: 700; margin: 2px 0;">-${money(totalOutflow)}</p>
                                 <div style="margin-top: 8px; padding: 4px 10px; background: ${diagColor}20; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 1px solid ${diagColor}40;">
                                    <span style="font-size: 0.55em; font-weight: 700; color: ${diagColor}; margin-bottom: 1px; letter-spacing: 0.5px;">${t.chartCenterBalance}</span>
                                    <span style="color: ${diagColor}; font-size: 0.95em; font-weight: 800;">${netBalance >= 0 ? '+' : ''}${money(netBalance)}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; justify-content: center; gap: 20px;">
                        <div style="background: rgba(255,255,255,0.03); border-left: 4px solid ${diagColor}; padding: 20px; border-radius: 0 12px 12px 0;">
                            <h3 style="margin: 0 0 5px; color: ${diagColor}; font-size: 1.2em; text-shadow: 0 0 10px ${diagColor}40;">${diagTitle}</h3>
                            <p style="margin: 0; color: #cbd5e1; font-size: 0.95em;">${diagMsg}</p>
                            <p style="margin: 10px 0 0; color: #94a3b8; font-size: 0.85em; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">${maxExpenseMsg}</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding-right: 10px;">
                            
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; padding: 8px 12px; background: ${balanceValueColor}10; border-radius: 8px; border: 1px solid ${balanceValueColor}30;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 12px; height: 12px; background: ${balanceValueColor}; border-radius: 3px; box-shadow: 0 0 8px ${balanceValueColor};"></div>
                                    <span style="color: #fff; font-weight: 700;">${balanceText}</span>
                                </div>
                                <span style="color: ${balanceValueColor}; font-weight: 700; font-family: monospace;">${money(netBalance)}</span>
                            </div>

                            ${chartLabels.map((label, i) => {
                                if (label === t.noData || label === t.cashBalance.toUpperCase()) return '';
                                const val = chartData[i];
                                const percent = (totalInflow + valMicroInsurance) > 0 ? Math.round((val / (totalInflow + valMicroInsurance)) * 100) : 0;
                                return `
                                <div style="padding: 0 5px;">
                                    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; margin-bottom: 4px;">
                                        <div style="display: flex; align-items: center; gap: 12px;">
                                            <div style="width: 12px; height: 12px; background: ${chartColors[i]}; border-radius: 3px; box-shadow: 0 0 8px ${chartColors[i]};"></div>
                                            <span style="color: #94a3b8; font-weight: 500;">${label}</span>
                                        </div>
                                        <div style="text-align: right;">
                                            <span style="color: #fff; font-weight: 700; font-family: monospace;">${money(val)}</span>
                                            <span style="color: #64748b; font-size: 0.85em; margin-left: 5px;">(${percent}%)</span>
                                        </div>
                                    </div>
                                    <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 2px;">
                                        <div style="width: ${percent}%; height: 100%; background: ${chartColors[i]}; border-radius: 2px;"></div>
                                   </div>
                            </div>`;
                        }).join('')}

                        ${valInterestGenerated > 0 ? `
                        <div style="padding: 0 5px; margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;">
                            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.9em;">
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 12px; height: 12px; background: transparent; border: 2px solid #8b5cf6; border-radius: 3px; box-shadow: 0 0 8px #8b5cf6;"></div>
                                    <span style="color: #c4b5fd; font-weight: 700;">${t.monthlyInterestPDF || 'LUCRO (JUROS GERADOS)'}</span>
                                </div>
                                <div style="text-align: right;">
                                    <span style="color: #8b5cf6; font-weight: 700; font-family: monospace;">+${money(valInterestGenerated)}</span>
                                </div>
                            </div>
                        </div>` : ''}

                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                    <details class="kpi-card" style="background: var(--surface); border: 1px solid var(--border-color);">
                        <summary style="cursor: pointer; font-weight: 600; color: var(--text-secondary); padding: 15px; display: flex; align-items: center; gap: 10px;">
                            <i data-lucide="list"></i> ${t.viewFullList}
                        </summary>
                        <div id="report-details-lists" style="margin-top: 0; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 10px;">
                             ${valInitial > 0 ? `<div class="payment-history-item" style="padding: 10px; background-color: var(--bg); border: 1px dashed var(--text-secondary);"><span style="font-weight: 600;">${t.initialCapitalLabel}</span><span style="font-weight: 700; color: var(--text-primary);">${money(valInitial)}</span></div>` : ''}
                             ${generateDetailListHTML(t.inflowLabel, 'arrow-up-circle', '#00ff9d', [...filteredPayments, ...filteredInjections], (item) => `<span>${item.clientName || 'Aporte'}</span><span style="color:var(--accent-green); font-weight:700;">${money(item.amount)}</span>`)}
                             ${generateDetailListHTML(t.monthlyInterestPDF || 'Lucro (Juros)', 'trending-up', '#8b5cf6', filteredNewLoans.filter(l => (Number(l.totalLoan) - (Number(l.principalAmount) || Number(l.totalLoan)/1.2)) > 0), (l) => `<span>${l.clientName}</span><span style="color:#8b5cf6; font-weight:700;">${money(Number(l.totalLoan) - (Number(l.principalAmount) || Number(l.totalLoan)/1.2))}</span>`)}
                             ${generateDetailListHTML(t.microInsurance, 'shield-check', '#0ea5e9', filteredNewLoans.filter(l => l.microInsurance > 0), (l) => `<span>${l.clientName} (Seguro Retido)</span><span style="color:#0ea5e9; font-weight:700;">${money(l.microInsurance)}</span>`)}
                             
                             ${generateDetailListHTML(t.outflowLoansLabel, 'briefcase', '#00f2ff', filteredNewLoans, (l) => `<span>${l.clientName}</span><span style="color:#3b82f6; font-weight:700;">${money(l.principalAmount || l.totalLoan/1.2)}</span>`)}
                             ${generateDetailListHTML(t.outflowExpensesLabel, 'shopping-cart', '#ff0055', filteredExpenses, (e) => `<span>${t[e.category]||e.category} ${(!e.date || !e.date.seconds) ? '(Pendente)' : ''}</span><span style="color:var(--danger-color); font-weight:700;">${money(e.value)}</span>`)}

                    tooltipEl.style.padding = '10px';

                if (tooltip.opacity === 0) {
                    tooltipEl.style.opacity = 0;

                if (tooltip.body) {
                    const bodyLines = tooltip.body.map(b => b.lines);

                    bodyLines.forEach((body, i) => {
                        const colors = tooltip.labelColors[i];
                        const span = document.createElement('span');
                        span.style.background = colors.backgroundColor;
                        span.style.borderColor = colors.borderColor;
                        span.style.borderWidth = '2px';
                        span.style.marginRight = '10px';

                        span.style.width = '10px';
                        span.style.display = 'inline-block';
                        span.style.borderRadius = '2px';

                        const tr = document.createElement('tr');
                        const td = document.createElement('td');
                        const text = body[0]; 
                        const parts = text.split(':');
                        const label = parts[0];
                        const val = parts.slice(1).join(':');

                        td.innerHTML = '';
                        td.appendChild(span);
                        td.appendChild(document.createTextNode(label));
                        const valSpan = document.createElement('span');
                        valSpan.innerText = val;
                        valSpan.style.fontWeight = 'bold';
                        valSpan.style.marginLeft = '8px';
                        valSpan.style.color = colors.backgroundColor;
                        td.appendChild(valSpan);
                        tr.appendChild(td);
                        tableBody.appendChild(tr);
                    });
                    const tableRoot = tooltipEl.querySelector('table');
                    while (tableRoot.firstChild) { tableRoot.firstChild.remove(); }
                    tableRoot.appendChild(tableBody);
                }

                const canvasRect = chart.canvas.getBoundingClientRect();
                const tooltipRect = tooltipEl.getBoundingClientRect();
                const windowWidth = window.innerWidth;
                
                let left = canvasRect.left + window.scrollX + tooltip.caretX;
                let top = canvasRect.top + window.scrollY + tooltip.caretY;

                left -= (tooltipRect.width / 2);
                if (left + tooltipRect.width > windowWidth - 10) left = windowWidth - tooltipRect.width - 10;
                if (left < 10) left = 10;

                top -= (tooltipRect.height + 15);
                if (top < window.scrollY + 60) top = canvasRect.top + window.scrollY + tooltip.caretY + 30;

                tooltipEl.style.opacity = 1;
                tooltipEl.style.left = left + 'px';
                tooltipEl.style.top = top + 'px';
            };

                    if (status === 'rejected') return t.statusRejected;
                    return status;
                };

                // --- 1. FILTROS ---
                const collector = allCollectors.find(c => c.id === collectorId);
                if (!collector) {
                    showToast("Cobrador não encontrado.", true);
                    return;
                }

                let startDate;
                let periodText = t.periodFull;
                if (period === '24h') {
                    startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                    periodText = t.period24h;
                } else if (period === '48h') {
                    startDate = new Date(now.getTime() - 48 * 60 * 60 * 1000);
                    periodText = t.period48h;
                } else if (period === 'week') {
                    startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                    periodText = t.periodWeek;
                } else if (period === 'month') {
                    startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000); 
                    periodText = t.periodMonth;
                }

                // --- 2. DATOS ACTUALES ---
                const collectorMetrics = calculatedCollectorMetrics.get(collectorId) || { capitalOnHand: 0 };
                const capitalOnHand = collectorMetrics.capitalOnHand; 

                // Seguro Acumulado (Histórico Total)
                let lifetimeInsuranceGenerated = 0;
                const allCollectorClients = allClients.filter(c => c.collectorId === collectorId);
                allCollectorClients.forEach(c => {
                    (c.loans || []).forEach(l => {
                        lifetimeInsuranceGenerated += (parseFloat(l.microInsurance) || 0);
                    });
                });

                const lifetimeInsuranceWithdrawn = allSettlements
                    .filter(s => String(s.collectorId) === String(collectorId) && s.status === 'approved' && s.type === 'insurance')
                    .reduce((sum, s) => sum + (s.amount || 0), 0);

                const currentInsuranceBalance = Math.max(0, lifetimeInsuranceGenerated - lifetimeInsuranceWithdrawn);

                // --- 3. PROCESAMIENTO DE DATOS ---
                const periodPaymentsList = [];
                let periodTotalCash = 0;
                let periodTotalDigital = 0;

                const collectorClients = allClients.filter(c => c.collectorId === collectorId);

                collectorClients.forEach(client => {
                    (client.loans || []).forEach((loan, loanIndex) => { 
                        (loan.history || []).forEach(h => {
                            if (h.date?.seconds && h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                                const paymentDateObj = h.date.seconds ? new Date(h.date.seconds * 1000) : null;
                                
                                if (paymentDateObj && (!startDate || paymentDateObj >= startDate)) {
                                    const fmt = safeDate(paymentDateObj);
                                    const amount = h.amount || 0;
                                    periodPaymentsList.push({
                                        clientName: client.name,
                                        amount: amount,
                                        time: fmt.time,
                                        date: fmt.date,
                                        rawDate: paymentDateObj,
                                        method: h.method || 'dinheiro',
                                        loanIndex: loanIndex + 1
                                    });

                                    if (h.method === 'dinheiro') periodTotalCash += amount;
                                    else periodTotalDigital += amount;
                                }
                            }
                        });
                    });
                });
                const periodTotalCollected = periodTotalCash + periodTotalDigital;
                periodPaymentsList.sort((a, b) => a.rawDate - b.rawDate);

                const periodNewLoans = [];
                collectorClients.forEach(client => {
                    (client.loans || []).forEach((loan, index) => {
                        if (loan.startDate?.seconds) {
                            const loanDateObj = new Date(loan.startDate.seconds * 1000);
                            if (!startDate || loanDateObj >= startDate) {
                                if (!loan.migrationDate) {
                                    let principal = loan.principalAmount;
                                    if (!principal && loan.totalLoan) {
                                         const rate = client.interestRate || 20;
                                         principal = loan.totalLoan / (1 + (rate/100));
                                    }
                                    const fmt = safeDate(loanDateObj);
                                    periodNewLoans.push({
                                        interest: (parseFloat(loan.totalLoan) || 0) - (principal || 0),
                                        clientName: client.name,
                                        amount: principal || 0,
                                        time: fmt.time,
                                        date: fmt.date,
                                        rawDate: loanDateObj,
                                        microInsurance: parseFloat(loan.microInsurance) || 0 
                                    });
                                }
                            }
                        }
                    });
                });
                const totalLoansOutflow = periodNewLoans.reduce((sum, l) => sum + l.amount, 0);
                const totalMicroInsurance = periodNewLoans.reduce((sum, l) => sum + l.microInsurance, 0);
                periodNewLoans.sort((a, b) => a.rawDate - b.rawDate);

                // C. Gastos (Salidas)
                const periodExpenses = allExpenses.filter(e => {
                    if (e.collectorId !== collectorId) return false;
                    const d = e.date && e.date.seconds ? new Date(e.date.seconds * 1000) : new Date();
                    return !startDate || d >= startDate;
                });
                const totalExpenses = periodExpenses.reduce((sum, e) => sum + e.value, 0);
                periodExpenses.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

                // FILTRO DE RETIROS (TOLERANTE + BLINDADO)
                const periodSettlements = allSettlements.filter(s => {
                    if (String(s.collectorId) !== String(collectorId)) return false;
                    if (s.status === 'rejected') return false; 
                    
                    let itemDate = new Date(); 
                    if (s.date && s.date.seconds) itemDate = new Date(s.date.seconds * 1000);
                    else if (s.date instanceof Date) itemDate = s.date;
                    
                    if (startDate && itemDate < startDate) return false;
                    return true;
                });
                
                const settlementsCapital = periodSettlements.filter(s => s.type !== 'insurance');
                const settlementsInsurance = periodSettlements.filter(s => s.type === 'insurance');
                const totalSettlementsCapital = settlementsCapital.reduce((sum, s) => sum + s.amount, 0);
                const totalSettlementsInsurance = settlementsInsurance.reduce((sum, s) => sum + s.amount, 0);
                const totalSettlementsAll = totalSettlementsCapital + totalSettlementsInsurance;
                
                periodSettlements.sort((a, b) => {
                    const dateA = a.date?.seconds ? a.date.seconds : (Date.now()/1000);
                    const dateB = b.date?.seconds ? b.date.seconds : (Date.now()/1000);
                    return dateA - dateB;
                });
                
                const periodInjections = allCapitalInjections.filter(i => {
                    if (i.collectorId !== collectorId) return false;
                    if (!i.date?.seconds) return false;
                    if (i.status !== 'approved') return false;
                    const d = new Date(i.date.seconds * 1000);
                    return !startDate || d >= startDate;
                });
                const totalInjections = periodInjections.reduce((sum, i) => sum + i.amount, 0);
                periodInjections.sort((a, b) => (a.date.seconds || 0) - (b.date.seconds || 0));

                const netBalance = (periodTotalCollected + totalInjections + totalMicroInsurance) - (totalExpenses + totalSettlementsAll + totalLoansOutflow);

                // --- 4. GENERAR PDF ---
                const pageMargin = 15;
                const pageWidth = doc.internal.pageSize.getWidth();
                const center = pageWidth / 2;
                let y = 0;

                y = 25;
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text(currentCompanyData?.name || t.title, center, y, { align: 'center' });

                doc.setTextColor(150);
                doc.text(`${t.collector}:`, pageMargin, y);
                doc.setFontSize(12);
                doc.setTextColor(0);
                doc.setFont(undefined, 'bold');
                doc.text(collector.name || 'N/A', pageMargin + 25, y); 

                y += 15;
                doc.setFontSize(14);
                doc.setFont(undefined, 'bold');
                doc.text(t.summaryTitle, pageMargin, y);
                y += 5;
                doc.setLineWidth(0.5);
                doc.setDrawColor(200);
                doc.line(pageMargin, y, pageWidth - pageMargin, y);

                const addSummaryLine = (label, value, color = '#000000', bold = false) => {
                    y += 8;
                    doc.setFontSize(11);
                    doc.setFont(undefined, bold ? 'bold' : 'normal');
                    doc.setTextColor(100);
                    doc.text(label, pageMargin + 5, y);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(color);
                    doc.text(money(value), pageWidth - pageMargin - 5, y, { align: 'right' });
                };

                addSummaryLine(t.received, periodTotalCollected, '#28a745');

                // D.4. Liquidaciones
                if (periodSettlements.length > 0) {

                    addTableHeaders([

                        { label: `${t.type} / ${t.obs}`, x: pageMargin + 40 },
                        { label: t.status, x: pageMargin + 125 },

                    periodSettlements.forEach(s => {

        async function exportFinancialAnalysisPDF(reportData) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const { period, collector, financials, breakdown } = reportData;
            const t = translations[currentLang];
            const primaryColor = '#0f172a'; 

            // 1. TÍTULO Y FECHA
            let y = 20;
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(primaryColor);
            doc.text((currentCompanyData?.name || 'Relatório Financeiro').toUpperCase(), 105, y, { align: 'center' });
            
            y += 8;
            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.setTextColor(100);
            const dateRange = `${period.start.toLocaleDateString()} - ${period.end.toLocaleDateString()}`;
            doc.text(`${t.reports} (${dateRange})`, 105, y, { align: 'center' });
            
            y += 8;
            doc.setFontSize(10);
            doc.text(`Cobrador: ${collector}`, 105, y, { align: 'center' });

            // 2. CAPTURA DEL GRÁFICO (IMAGEN)
            if (reportChartInstance) {
                const canvas = document.getElementById('ultra-chart');
                if (canvas) {
                    y += 10;
                    const chartImgData = canvas.toDataURL('image/png', 1.0);
                    
                    doc.addImage(chartImgData, 'PNG', 65, y, 80, 80);
                    
                    // Círculo central simulado
                    doc.setFillColor(255, 255, 255);
                    doc.circle(105, y + 40, 15, 'F'); 
                    
                    doc.setFontSize(8);
                    doc.setTextColor(100);
                    doc.text(t.capitalGiro, 105, y + 35, { align: 'center' });
                    
                    // Sumamos el Seguro a la entrada visual en el PDF también para consistencia
                    doc.setFontSize(11);
                    doc.setTextColor(0);
                    doc.setFont(undefined, 'bold');
                    doc.text(money(financials.totalIn + (financials.microInsurance||0)), 105, y + 40, { align: 'center' });
                    
                    doc.setFontSize(8);
                    doc.setTextColor(100);
                    doc.setFont(undefined, 'normal');
                    doc.text(t.totalOutflow, 105, y + 46, { align: 'center' });
                    
                    doc.setFontSize(10);
                    doc.setTextColor('#ef4444');
                    doc.setFont(undefined, 'bold');
                    doc.text(`-${money(financials.totalOut)}`, 105, y + 51, { align: 'center' });

                    y += 85; 
                }
            }

            // 3. TABLA DE RESUMEN
            doc.setDrawColor(200);
            doc.setLineWidth(0.1);
            doc.line(20, y, 190, y);
            y += 10;

            const addRow = (label, value, color = '#000000', isBold = false) => {
                doc.setFontSize(11);
                doc.setFont(undefined, isBold ? 'bold' : 'normal');
                doc.setTextColor(100); 
                doc.text(label, 20, y);
                
                doc.setTextColor(color);
                doc.text(money(value), 190, y, { align: 'right' });
                y += 8;
            };

            // Capital Inicial
            if (financials.initial > 0) {
                addRow(t.initialCapitalLabel, financials.initial, '#64748b');
            }

            // Entradas
            addRow(t.inflowLabel, financials.inflow, '#22c55e', true);
            
            // --- MICRO SEGURO (ENTRADA) ---
            if (financials.microInsurance > 0) {
                addRow(t.microInsurance, financials.microInsurance, '#0ea5e9', true); // Azul Celeste
            }
            // --- INTERESES GENERADOS (LUCRO) ---
            if (financials.interestGenerated > 0) {
                addRow(t.monthlyInterestPDF || 'LUCRO (JUROS GERADOS)', financials.interestGenerated, '#8b5cf6', true);
            }
            // Salidas
            addRow(t.outflowLoansLabel, financials.loans, '#3b82f6');
            addRow(t.outflowExpensesLabel, financials.expenses, '#ef4444');
            
            // --- RETIROS DESGLOSADOS ---
            if (financials.settlementsCapital > 0) {
                 addRow("Saídas (Retiradas Capital)", financials.settlementsCapital, '#a855f7');
            }
            if (financials.settlementsInsurance > 0) {
                 addRow("Saídas (Retiradas Seguro)", financials.settlementsInsurance, '#0ea5e9');
            }
            
            y += 2;
            doc.line(20, y, 190, y);
            y += 10;
            
            // Saldo Final
            const balanceLabel = t.cashBalance;
            const balanceColor = financials.balance >= 0 ? '#22c55e' : '#ef4444';
            
            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(balanceColor);
            doc.text(balanceLabel, 20, y);
            doc.text(money(financials.balance), 190, y, { align: 'right' });
            
            y += 15;
            
            // 4. DESGLOSE DE GASTOS
            const expenseKeys = Object.keys(breakdown).filter(k => breakdown[k] > 0);
            if (expenseKeys.length > 0) {
                doc.setFontSize(12);
                doc.setTextColor(primaryColor);
                doc.text(t.maxExpenseLabel.replace(':', ''), 20, y); 
                y += 8;

                expenseKeys.forEach(cat => {
                    const label = (translations[currentLang][cat] || cat).toUpperCase();
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');
                    doc.setTextColor(100);
                    doc.text(`• ${label}`, 25, y);
                    doc.setTextColor('#ef4444');
                    doc.text(`-${money(breakdown[cat])}`, 190, y, { align: 'right' });
                    y += 6;
                });
            }

            // 5. PIE DE PÁGINA
            const pageHeight = doc.internal.pageSize.getHeight();
            doc.setFontSize(9);
            doc.setTextColor(150);
            doc.text('Gerado por LUMIX Finanças', 105, pageHeight - 10, { align: 'center' });

            doc.save(`Analise_Financeira_${new Date().toLocaleDateString().replace(/\//g, '-')}.pdf`);
            showToast('PDF do gráfico baixado!');
        }

                </div>
            </div>
            `;

            const radioBtns = modal.querySelectorAll('input[name="settlement-type"]');
            const typeDivs = modal.querySelectorAll('.type-btn');
            
            radioBtns.forEach((radio, index) => {
                radio.addEventListener('change', () => {
                    typeDivs.forEach(div => {
                        div.style.borderColor = 'var(--border-color)';
                        div.style.color = 'var(--text-secondary)';
                        div.classList.remove('active');
                    });
                    
                    const selectedDiv = typeDivs[index];
                    if (radio.value === 'capital') {
                        selectedDiv.style.borderColor = 'var(--accent-green)';
                        selectedDiv.style.color = 'var(--accent-green)';
                    } else {
                        selectedDiv.style.borderColor = '#0ea5e9';
                        selectedDiv.style.color = '#0ea5e9';
                    }
                    selectedDiv.classList.add('active');
                });
            });

            const confirmBtn = modal.querySelector('#confirm-settlement-btn');
            const cancelBtn = modal.querySelector('#cancel-settlement-btn');
            const closeModalBtn = modal.querySelector('.close-modal-btn');
            const amountInput = modal.querySelector('#settlement-amount');
            const notesInput = modal.querySelector('#settlement-notes');

            const closeModal = () => modal.classList.remove('active');
            cancelBtn.addEventListener('click', closeModal);
            closeModalBtn.addEventListener('click', closeModal);

            confirmBtn.addEventListener('click', async () => {
                const amount = parseFloat(amountInput.value);
                const typeInput = document.querySelector('input[name="settlement-type"]:checked');
                const type = typeInput ? typeInput.value : 'capital';
                
                if (isNaN(amount) || amount <= 0) {
                    showToast('Por favor, insira um valor válido.', true);
                    return;
                }
                
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i>...`;
                lucide.createIcons({ nodes: [confirmBtn.querySelector('i')] });

                try {
                    const noteText = notesInput.value.trim();
                    const adminUserId = auth.currentUser ? auth.currentUser.uid : 'admin_manual';

                    if (type === 'capital') {
                        await addDoc(collection(db, 'companies', currentCompanyId, 'settlements'), {
                            collectorId: collectorId,
                            collectorName: collectorName, 
                            amount: amount,
                            notes: noteText,
                            date: serverTimestamp(), 
                            adminId: adminUserId, 
                            status: 'approved',
                            type: 'capital'
                        });
                    } else {
                        await addDoc(collection(db, 'companies', currentCompanyId, 'insuranceWithdrawals'), {
                            collectorId: collectorId,
                            amount: amount,
                            date: serverTimestamp(),
                            adminId: adminUserId,
                            note: `Retirada via ${collectorName} - ${noteText}`,
                            type: 'insurance'
                        });
                        await addDoc(collection(db, 'companies', currentCompanyId, 'settlements'), {
                            collectorId: collectorId,
                            collectorName: collectorName,
                            amount: amount,
                            notes: `[MICRO SEGURO] ${noteText}`,
                            date: serverTimestamp(),
                            adminId: adminUserId,
                            status: 'approved',
                            type: 'insurance' 
                        });
                    }

                    // Usamos 'purple' para que salga lila
                    showToast('Retirada registrada com sucesso!', 'purple');
                    closeModal();
                } catch (error) {
                    console.error("Erro:", error);
                    showToast('Erro ao salvar.', true);
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = t.confirmRegister;
                }
            });
        }

        async function saveGlobalSettings() {
            const saveBtn = document.getElementById('save-settings-btn');
            const originalBtnHTML = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Salvando...`;
            lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
            
            try {
                // --- 1. LÓGICA DE CAMBIO DE CONTRASEÑA ---
                const newPasswordInput = document.getElementById('settings-new-password');
                const newPassword = newPasswordInput ? newPasswordInput.value.trim() : '';

                if (newPassword) {
                    if (newPassword.length < 6) {
                        throw new Error("A nova senha deve ter no mínimo 6 caracteres.");
                    }
                    
                    if (auth.currentUser) {
                        console.log("Tentando atualizar senha do administrador...");
                        try {
                            await updatePassword(auth.currentUser, newPassword);
                            showToast("Senha de acesso atualizada com sucesso!", false);
                            newPasswordInput.value = ''; 
                        } catch (authError) {
                            console.error("Erro ao atualizar senha:", authError);
                            if (authError.code === 'auth/requires-recent-login') {
                                throw new Error("Por segurança, faça Logout e entre novamente para mudar a senha.");
                            } else {
                                throw new Error(`Erro ao mudar senha: ${authError.message}`);
                            }
                        }
                    }
                }

                // --- 2. LÓGICA DE DATOS DE EMPRESA (ROBUSTA) ---
                // Verifica existencia de inputs antes de leer .value
                let logoUrl = globalSettings.companyLogo || '';
                const logoInput = document.getElementById('settings-logo-input');
                const logoFile = logoInput ? logoInput.files[0] : null;
                
                if (logoFile) {
                    const storageRef = ref(storage, `companies/${currentCompanyId}/assets/companyLogo.jpg`);
                    await uploadBytes(storageRef, logoFile);
                    logoUrl = await getDownloadURL(storageRef);
                }

                // Referencias seguras a los inputs
                const nameInput = document.getElementById('settings-company-name');
                const interestInput = document.getElementById('settings-default-interest');
                const gpsInput = document.getElementById('settings-gps-toggle');

                const newSettings = {
                    // Si el input existe, usa su valor. Si no, mantiene el valor actual guardado.
                    companyName: nameInput ? nameInput.value : (globalSettings.companyName || ''),
                    companyLogo: logoUrl,
                    defaultInterest: interestInput ? parseFloat(interestInput.value) : (globalSettings.defaultInterest || 0),
                    requireGps: gpsInput ? gpsInput.checked : (globalSettings.requireGps || false),
                };

                await updateDoc(doc(db, 'companies', currentCompanyId), newSettings);
                
                globalSettings = { ...globalSettings, ...newSettings };
                
                // Actualizar UI si los elementos existen
                const headerLogoText = document.getElementById('header-logo-text');
                const headerLogo = document.getElementById('header-logo');
                if (headerLogoText) headerLogoText.textContent = newSettings.companyName;
                if (headerLogo) headerLogo.src = newSettings.companyLogo;

                showToast(translations[currentLang].settingsSaved);

            } catch (error) {
                console.error("Erro ao salvar ajustes:", error);
                showToast(error.message || 'Erro ao salvar ajustes.', true);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnHTML;
                lucide.createIcons({ nodes: [saveBtn.querySelector('i')] });
            }
        }

        /**
         * Formatea un timestamp de Firebase (u otros formatos) a una fecha simple (DD/MM/YYYY)
         */
        function formatSimpleDate(timestamp) {
            let date;

            // 1. Manejar nulo o indefinido
            if (!timestamp) return '--';

            // 2. Manejar formato Timestamp de Firebase (ej: { seconds: ..., nanoseconds: ... })
            if (timestamp.seconds && typeof timestamp.toDate === 'function') {
                date = timestamp.toDate();
            
            // 3. Manejar si ya es un objeto Date de JavaScript
            } else if (timestamp instanceof Date) {
                date = timestamp;
            
            // 4. Manejar si es un string (ej: "2025-11-01T10:00:00Z")
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            
            // 5. Si no es ninguno de los anteriores, no sabemos qué es
            } else {
                console.warn("Formato de data desconhecido:", timestamp);
                return '--';
            }

            // 6. Validar que la fecha resultante sea válida
            if (isNaN(date.getTime())) {
                console.error("Data inválida após conversão:", timestamp);
                return 'Data Inválida';
            }
            
            // 7. Formatear la fecha válida
            try {
                return date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (e) {
                console.error("Error al formatear data:", e);
                return 'Erro Formato';
            }
        }

            function updateProfileView(collectorData = null) {
            // --- 1. ELEMENTOS FINANCIEROS (KPIs) ---
            const dailyTotalEl = document.getElementById('kpi-daily-total');
            const capitalTotalEl = document.getElementById('kpi-capital-total');
            const dailyCashEl = document.getElementById('kpi-daily-cash');
            const dailyDigitalEl = document.getElementById('kpi-daily-digital');
            const totalFinesEl = document.getElementById('kpi-total-fines'); // Tarjeta de Multas

            // --- 2. ELEMENTOS DEL PLAN ---
            const planTypeElement = document.getElementById('plan-info-type');
            const planCollectorsElement = document.getElementById('plan-info-collectors');
            const planStartDateElement = document.getElementById('plan-info-start-date');
            const planEndDateElement = document.getElementById('plan-info-end-date');

            // --- 3. CÁLCULOS FINANCIEROS (GLOBALES) ---
            let dailyTotal = 0;
            let dailyTotalCash = 0;
            let dailyTotalDigital = 0;
            let totalActiveFines = 0;

            // Usamos la fecha de hoy para filtrar lo recaudado hoy
            const today = new Date();
            const isSameDate = (d1, d2) => 
                d1.getDate() === d2.getDate() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getFullYear() === d2.getFullYear();

            // Iteramos todos los clientes para sumar pagos de hoy y multas activas
            allClients.forEach(client => {
                (client.loans || []).forEach(loan => {
                    // A. Sumar Pagos de Hoy
                    (loan.history || []).forEach(h => {
                        if (h.status !== 'pending_verification' && h.status !== 'rejected' && h.status !== 'postponed' && h.method !== 'migration') {
                            let pDate = null;
                            if (h.date?.seconds) pDate = new Date(h.date.seconds * 1000);
                            else if (h.date instanceof Date) pDate = h.date;
                            
                            if (pDate && isSameDate(pDate, today)) {
                                const amt = h.amount || 0;
                                dailyTotal += amt;
                                if (h.method === 'dinheiro') dailyTotalCash += amt;
                                else dailyTotalDigital += amt;
                            }
                        }
                    });

                    // B. Sumar Multas Activas
                    const details = calculateLoanDetails(loan);
                    if (details.hasFixedFine && details.fixedFineApplied > 0) {
                        totalActiveFines += details.fixedFineApplied;
                    }
                });
            });

            // Actualizar DOM Financiero (Si los elementos existen en la vista)
            if (dailyTotalEl) dailyTotalEl.textContent = money(dailyTotal);
            if (dailyCashEl) dailyCashEl.textContent = money(dailyTotalCash);
            if (dailyDigitalEl) dailyDigitalEl.textContent = money(dailyTotalDigital);
            if (totalFinesEl) totalFinesEl.textContent = money(totalActiveFines);
            
            // Capital en Manos (Usamos la métrica global ya calculada)
            if (capitalTotalEl && calculatedGlobalMetrics && calculatedGlobalMetrics.sumGlobalCapitalOnHand !== undefined) {
                capitalTotalEl.textContent = money(calculatedGlobalMetrics.sumGlobalCapitalOnHand);
            }

            // --- 4. LÓGICA DEL PLAN ---
            if (planTypeElement && currentCompanyData && currentCompanyData.plan) {
                const plan = currentCompanyData.plan; 
                const planTypeText = plan.type === 'pro' ? `PRO (${plan.plan || 'N/A'})` : 'DEMO';
                planTypeElement.textContent = planTypeText; 
                
                const currentCollectorCount = allCollectors.length; 
                let collectorLimit = 'Ilimitado';
                
                if (plan.type === 'demo') {
                    collectorLimit = currentCompanyData.plan.collectorLimit || 1; 
                } else if (currentCompanyData.plan.collectorLimit && currentCompanyData.plan.collectorLimit !== -1) {
                    collectorLimit = currentCompanyData.plan.collectorLimit;
                } 
                
                planCollectorsElement.textContent = `${currentCollectorCount} / ${collectorLimit}`;
                
                if (collectorLimit !== 'Ilimitado' && collectorLimit !== '?' && currentCollectorCount >= collectorLimit) {
                    planCollectorsElement.style.color = 'var(--danger-color)';
                    planCollectorsElement.style.fontWeight = 'bold';
                } else {
                    planCollectorsElement.style.color = ''; 
                    planCollectorsElement.style.fontWeight = '';
                }
                
                planStartDateElement.textContent = formatSimpleDate(currentCompanyData.createdAt);
                planEndDateElement.textContent = formatSimpleDate(plan.endDate);
            } else if (planTypeElement) {
                planTypeElement.textContent = 'Não definido';
                planCollectorsElement.textContent = `${allCollectors.length} / ?`;
                planStartDateElement.textContent = '--';
                planEndDateElement.textContent = '--';
            }
        }

        async function showPaymentDetailModal(clientId, loanIndex, historyIndex) {
    const modal = document.getElementById('paymentDetailModal');
    
    // --- (CORRECCIÓN INICIO) ---
    // 1. Obtenemos el cliente FRESCO desde el array global CADA VEZ que se abre el modal
    const client = allClients.find(c => c.id === clientId);
    // --- (CORRECCIÓN FIN) ---

    // Validaciones
    if (!client || !client.loans || !client.loans[loanIndex] || !client.loans[loanIndex].history || !client.loans[loanIndex].history[historyIndex]) {
        showToast('Erro: Não foi possível encontrar os dados deste pagamento.', true);
        return;
    }

    const loan = client.loans[loanIndex];
    const payment = loan.history[historyIndex];

    const paymentDate = payment.date?.seconds ? new Date(payment.date.seconds * 1000) : null;
    const dateString = paymentDate ? paymentDate.toLocaleDateString(currentLang === 'pt' ? 'pt-BR' : 'es-ES') : 'N/A';
    const timeString = paymentDate ? paymentDate.toLocaleTimeString(currentLang === 'pt' ? 'pt-BR' : 'es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
    
    let receiptHtml = '';
    if (payment.receiptUrl) {
        receiptHtml = `<img src="${payment.receiptUrl}" alt="Comprovante" class="receipt-preview">`;
    } else {
        receiptHtml = `<p class="no-receipt">Nenhum comprovante anexado para este pagamento.</p>`;
    }

    // Determina el estado del pago
    let statusText, statusClass;
    switch(payment.status) {
        case 'pending_verification': statusText = 'Pendente'; statusClass = 'status-pending'; break;
        case 'rejected': statusText = 'Rejeitado'; statusClass = 'status-late'; break;
        case 'postponed': statusText = 'Adiado'; statusClass = 'status-paid'; break;
        default: statusText = 'Aprovado'; statusClass = 'status-paid';
    }

    const canDelete = (payment.status === 'approved' || (!payment.status && payment.date));

    modal.innerHTML = `
        <header class="modal-header">
            <button id="closePaymentDetailModal"><i data-lucide="arrow-left"></i></button>
            <span class="modal-title">Detalhes do Pagamento</span>
        </header>
        <div class="modal-content-wrapper container">
            <div class="kpi-card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <h3 class="kpi-title">Data</h3>
                        <p class="kpi-value" style="font-size: 1.2em;">${dateString} às ${timeString}</p>
                    </div>
                    <div>
                        <h3 class="kpi-title" style="justify-content: flex-end;">Status</h3>
                        <p class="kpi-value ${statusClass}" style="font-size: 1.2em;">${statusText}</p>
                    </div>
                </div>
                <div style="text-align: center;">
                    <h3 class="kpi-title" style="justify-content: center;">Valor Pago</h3>
                    <p class="kpi-value" style="font-size: 1.8em; color: var(--accent-green);">${money(payment.amount)}</p>
                </div>
            </div>
            
            <h3 class="section-title" style="border: none; margin-bottom: 10px;">Comprovante</h3>
            ${receiptHtml}
        </div>
        <div class="action-buttons">
            <button id="delete-payment-btn" class="btn-danger" ${canDelete ? '' : 'disabled'} title="${canDelete ? '' : 'Não é possível excluir pagamentos pendentes, rejeitados ou adiados.'}">
                <i data-lucide="trash-2"></i> Excluir Pagamento
            </button>
        </div>
    `;

    history.pushState({ modal: 'paymentDetailModal' }, 'Payment Details', '#payment-detail');
    modal.classList.add('active');
    
    try {
        lucide.createIcons({ nodes: modal.querySelectorAll('[data-lucide]') });
    } catch (iconError) {
        console.warn("Lucide icons failed to render in paymentDetailModal:", iconError);
    }
    // --- [FIN DE LA CORRECCIÓN 2/2] ---

    // --- Listeners del Modal ---
    modal.querySelector('#closePaymentDetailModal').addEventListener('click', () => window.history.back());


    const deleteBtn = modal.querySelector('#delete-payment-btn');
    if (canDelete) {
        deleteBtn.addEventListener('click', async () => {
            
            // --- (CORRECCIÓN INICIO) 2. Muestra la confirmación ANTES de hacer nada ---
            const confirmed = await showConfirmationModal(
                'Confirmar Exclusão',
                'Você está prestes a excluir este pagamento. Esta ação é IRREVERSÍVEL e irá reverter a contabilidade (o saldo do cliente e o capital do cobrador serão recalculados). Deseja continuar?',
                'Sim, Excluir Pagamento',
                'btn-danger'
            );

            if (!confirmed) return; // Si el admin cancela, no hacemos nada.
            // --- (CORRECCIÓN FIN) 2. ---

            // Mostrar estado de carga en el botón
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = `<i data-lucide="loader-circle" style="animation: spin 1s linear infinite;"></i> Excluindo...`;
            lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });

            try {
                const clientRef = doc(db, 'companies', currentCompanyId, "clients", clientId);
                
                // --- (CORRECCIÓN INICIO) 3. Busca el cliente FRESCO OTRA VEZ ---
                //    Esto garantiza que estamos editando los datos más actuales de 'allClients'.
                const latestClientData = allClients.find(c => c.id === clientId);
                if (!latestClientData) throw new Error("Cliente desapareceu durante a operação.");

                // 4. Hacemos la copia profunda de los datos FRESCOS.
                const updatedLoans = JSON.parse(JSON.stringify(latestClientData.loans));
                // --- (CORRECCIÓN FIN) 3 y 4 ---

                const loanToUpdate = updatedLoans[loanIndex];

                if (!loanToUpdate || !loanToUpdate.history || !loanToUpdate.history[historyIndex]) {
                    throw new Error("Referência de pagamento inválida ao tentar excluir.");
                }

                // Elimina el pago del array de historial
                const deletedPayment = loanToUpdate.history.splice(historyIndex, 1);
                console.log("Pagamento excluído do array local:", deletedPayment);

                // Actualiza el documento del cliente en Firestore
                await updateDoc(clientRef, {
                    loans: updatedLoans
                });

                showToast('Pagamento excluído com sucesso! A contabilidade será recalculada.', false);

                window.history.back(); 
                
                // Forzamos el recálculo global (esto revertirá la contabilidad)
                checkAndRunGlobalUpdate();
                
                // Refrescamos la vista de detalles del cliente si sigue abierta
                if (document.getElementById('clientDetailModal').classList.contains('active')) {
                     showClientDetails(clientId, loanIndex);
                }

            } catch (error) {
                console.error("Erro ao excluir pagamento:", error);
                showToast(`Falha ao excluir pagamento: ${error.message}`, true);
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = `<i data-lucide="trash-2"></i> Excluir Pagamento`;
                lucide.createIcons({ nodes: [deleteBtn.querySelector('i')] });
            }
        });
    }
}

function updateAdminNotificationsView() {
            const container = document.getElementById('admin-notifications-list');
            const badge = document.getElementById('admin-notification-badge');
            if (!badge) return; 

            let notifications = [];

            // 1. Pagos Pendientes
            allClients.forEach(client => {
                (client.loans || []).forEach((loan, loanIndex) => {
                    (loan.history || []).forEach((payment, historyIndex) => {
                        if (payment && payment.status === 'pending_verification') {
                            notifications.push({
                                type: 'payment',
                                date: payment.date,
                                clientId: client.id,
                                clientName: client.name,
                                profilePictureUrl: client.profilePictureUrl,
                                amount: payment.amount,
                                loanIndex: loanIndex,
                                historyIndex: historyIndex
                            });
                        }
                    });

                    // 2. Mensajes de Chat (AHORA CON FILTRO DE LEÍDOS)
                    if (loan.chatHistory && loan.chatHistory.length > 0) {
                        const lastMsg = loan.chatHistory[loan.chatHistory.length - 1];
                        // Solo mostramos si es del cobrador Y no ha sido marcado como leído/borrado
                        if (lastMsg.sender === 'collector' && !lastMsg.adminRead) {
                            notifications.push({
                                type: 'message', 
                                date: lastMsg.timestamp,
                                clientId: client.id,
                                clientName: client.name,
                                profilePictureUrl: client.profilePictureUrl,
                                amount: 0, 
                                loanIndex: loanIndex,
                                messageText: lastMsg.text 
                            });
                        }
                    }
                });
            });

            // 3. Liquidaciones
            allSettlements.forEach(settlement => {

                    const collector = allCollectors.find(c => c.id === settlement.collectorId);

                        date: settlement.date,

                        collectorName: settlement.collectorName || collector?.name || 'Desconhecido',
                        profilePictureUrl: collector?.profilePictureUrl,
                        amount: settlement.amount,
                        settlementId: settlement.id
                    });
                }
            });

            // 4. Refinanciamientos
            allClients.forEach(client => {
                if (client.refinanceRequest && client.refinanceRequest.status === 'pending') {
                     notifications.push({
                        type: 'refinance',
                        date: client.refinanceRequest.requestDate,
                        clientId: client.id,
                        clientName: client.name,
                        profilePictureUrl: client.profilePictureUrl,
                        amount: client.refinanceRequest.amount
                    });
                }
            });
            
            notifications.sort((a, b) => {
                const timeA = a.date?.seconds ? a.date.seconds : (a.date instanceof Date ? a.date.getTime()/1000 : 0);
                const timeB = b.date?.seconds ? b.date.seconds : (b.date instanceof Date ? b.date.getTime()/1000 : 0);
                return timeB - timeA;
            });

            badge.textContent = notifications.length;
            badge.style.display = notifications.length > 0 ? 'flex' : 'none';
            badge.classList.toggle('visible', notifications.length > 0);

                    return;
                }

                container.innerHTML = notifications.map(n => {
                    const name = n.clientName || n.collectorName || 'N/A';

                    const placeholderUrl = `https://placehold.co/80x80/6f42c1/FFFFFF?text=${nameInitial}`;
                    const photoUrl = n.profilePictureUrl || placeholderUrl;
                    
                    let subtitle = '';

                    if (n.type === 'payment') {

                        iconBadge = `<i data-lucide="dollar-sign" style="color: var(--accent-green);"></i>`;

                        iconBadge = `<i data-lucide="refresh-cw" style="color: var(--warning-color);"></i>`;
                    } else if (n.type === 'message') {
                        const msgPreview = n.messageText.length > 50 ? n.messageText.substring(0, 50) + '...' : n.messageText;
                        let timeStr = '';
                        if (n.date) {
                            const d = n.date.seconds ? new Date(n.date.seconds * 1000) : new Date(n.date);
                            timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                        subtitle = `<div style="display:flex; justify-content:space-between; align-items:center;">

        function showSettlementVerificationModal(settlement) {
